});
renderWhole();
// Practice a different verse in the drill: starts a fresh shuffled round
// (each verse choice keeps its own place in its round).
function renderDrillVerse() {
  document.querySelectorAll(".drill-verse .dv").forEach(b => b.classList.toggle("on", b.dataset.v === drillVerse));
}
function roundIntro() {
  const v = drillVerse, m = chorusMode();
  const verses = v === "mix" ? T("drill.allVerses", { n: VERSE_COUNT }) : VERSE_COUNT > 1 ? T("phrase.verseN", { v }) : SONG.title;
  const key = !HAS_CHORUS ? "drill.introNoChorus" : m === "skip" ? "drill.introSkip" : m === "after" ? "drill.introAfter" : "drill.introMixed";
  return T(key, { verses, n: order.length });
}
function renderChorusMode() {
  document.querySelectorAll(".cm").forEach(b => b.classList.toggle("on", b.dataset.m === chorusMode()));
}
function setDrillVerse(v) {
  stopAll();
  drillVerse = v; $("drillVerse").value = v; savePrefs();
  PHRASES = buildPool(v);
  if (!load()) shuffle();
  renderDrillVerse(); renderProgress();
  if (pos >= 0) { renderStage(); $("prompt").textContent = T("drill.currentOrNew"); }
  else {
    $("prompt").textContent = roundIntro();
    $("prompt").classList.add("quiet");
    $("notes").hidden = $("phraseId").hidden = $("revealBtn").hidden = true;
    $("lyricBox").hidden = $("lyricsBtn").hidden = true;
    $("againBtn").disabled = $("slowBtn").disabled = true;
  }
}
document.querySelectorAll(".drill-verse .dv").forEach(b => b.addEventListener("click", () => { if (b.dataset.v !== drillVerse) setDrillVerse(b.dataset.v); }));
// Changing the chorus setting always starts a fresh round in the new style
document.querySelectorAll(".cm").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.m === chorusMode()) return;
  stopAll();
  $("chorusMode").value = b.dataset.m; savePrefs(); renderChorusMode();
  shuffle(); save(); renderProgress();
  $("prompt").textContent = roundIntro(); $("prompt").classList.add("quiet");
  $("notes").hidden = $("phraseId").hidden = $("revealBtn").hidden = true;
  $("lyricBox").hidden = $("lyricsBtn").hidden = true;
  $("againBtn").disabled = $("slowBtn").disabled = true;
}));

// Choose what Play along plays
function renderAlongSub() {
  // a pickup starts in the bar before the first full bar
  const hasPickup = pickupEighths(SEQ[0].items) > 0;
  const first = hasPickup ? +firstBar(0) - 1 : +firstBar(0);
  const lastNum = barNums(SEQ[SEQ.length - 1]).slice(-1)[0];
  const span = T("seq.span", { a: first >= 1 && first < +firstBar(0) ? first : firstBar(0), b: lastNum });
  $("alongSub").textContent = $("seqSel").value === "song"
    ? T(HAS_CHORUS ? "seq.subSong" : "seq.subSongNoChorus", { n: VERSE_COUNT, span })
    : T("seq.subOne", { label: SEQ_CHOICES[$("seqSel").value].label, span });
}
function setSeq(v) {
  stopAll();
  SEQ = joinFill(withItems(SEQ_CHOICES[v].build()));
  abRange = null; abPick = null; abFirst = null;
  storeRemove(AB_STORE);
  renderWhole(); renderStartFrom(); renderAlongSub(); renderAB();
}
$("seqSel").addEventListener("change", () => { setSeq($("seqSel").value); savePrefs(); });
// The saved A–B loop, if it belongs to the current Play choice and still fits it
function loadAB() {
  const saved = storeGetJSON(AB_STORE);
  if (saved && saved.seq === $("seqSel").value && saved.a >= 0 && saved.b < SEQ.length && saved.a <= saved.b) abRange = { a: saved.a, b: saved.b };
}

// Press feedback on every button (restarts each tap, so repeat taps show too)
function pressFx(el) {
  el.classList.remove("pressed");
  void el.offsetWidth;            // restart the animation
  el.classList.add("pressed");
}
document.addEventListener("pointerdown", e => {
  const b = e.target.closest("button");
  if (b && !b.disabled) pressFx(b);
});
document.addEventListener("animationend", e => e.target.classList.remove("pressed", "flash"));
$("calibCancel").addEventListener("click", closeCalib);
$("tapPad").addEventListener("pointerdown", e => { e.preventDefault(); calibTap(); });
$("tapPad").addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); calibTap(); } });
$("visDelay").addEventListener("input", e => $("visDelayVal").textContent = T("units.ms", { n: e.target.value }));
$("restartBtn").addEventListener("click", () => {
  stopAll(); shuffle(); save(); renderProgress();
  $("prompt").textContent = T("drill.reshuffled");
  $("prompt").classList.add("quiet");
  $("notes").hidden = $("phraseId").hidden = $("revealBtn").hidden = true;
  $("lyricBox").hidden = $("lyricsBtn").hidden = true;
  $("againBtn").disabled = $("slowBtn").disabled = true;
});
$("lyricsBtn").addEventListener("click", () => {
  renderLyricBox();
  $("lyricBox").hidden = false; $("lyricsBtn").hidden = true;
});
["lyricSet", "showMeaning"].forEach(id => $(id).addEventListener("change", renderLyricBox));
$("lyricBox").addEventListener("click", e => {
  const t = e.target.closest(".ly-tab");
  if (!t) return;
  $("lyricSet").value = t.dataset.set; savePrefs(); renderLyricBox();
});
$("autoLyrics").addEventListener("change", renderStage);
$("mySave").addEventListener("click", saveMyLyrics);
$("myExport").addEventListener("click", exportMyLyrics);
$("myCopy").addEventListener("click", copyMyLyrics);
// Fix line breaks as soon as you paste or type, keeping the cursor in place
$("myLyrics").addEventListener("input", () => {
  const ta = $("myLyrics");
  if (!/[\u2028\u2029\u0085\r]/.test(ta.value)) return;
  const before = normalizeBreaks(ta.value.slice(0, ta.selectionStart));
  ta.value = normalizeBreaks(ta.value);
  ta.selectionStart = ta.selectionEnd = before.length;
});
$("myImport").addEventListener("change", e => { if (e.target.files[0]) importMyLyrics(e.target.files[0]); e.target.value = ""; });
$("myLyrics").value = loadMyText();
renderLyricsPanel();
$("revealBtn").addEventListener("click", () => {
  $("notes").hidden = $("phraseId").hidden = false;
  $("revealBtn").hidden = true;
});
$("autoReveal").addEventListener("change", renderStage);
$("tempo").addEventListener("input", e => $("tempoVal").textContent = T("units.bpm", { n: e.target.value }));
$("clickVol").addEventListener("input", e => $("clickVolVal").textContent = T("units.pct", { n: e.target.value }));

// Remember settings between visits (same browser only)
// Storage keys keep the old "phrase-parrot-" prefix on purpose (app renamed in v0.39),
// so saved lyrics, sync and settings carry over from earlier versions.
const PREFS = "phrase-parrot-prefs-v1";
const prefIds = ["followLine", "visDelay", "countIn", "clickAll", "loop", "autoReveal", "doFirst", "tempo", "clickVol", "timbre", "transpose", "fineTune", "lyricSet", "showMeaning", "autoLyrics", "drillVerse", "seqSel", "myFileName", "tuneInst", "tuneSound", "tuneRef", "chorusMode", "songSel", "tuneVol", "legato"];
function savePrefs() {
  const p = {};
  prefIds.forEach(id => { const el = $(id); p[id] = el.type === "checkbox" ? el.checked : el.value; });
  storeSet(PREFS, JSON.stringify(p));
}
// ---------- Startup: restore settings, then render everything once ----------
const savedPrefs = storeGetJSON(PREFS);
if (savedPrefs) prefIds.forEach(id => {
  const el = $(id); if (!(id in savedPrefs)) return;
  if (el.type === "checkbox") el.checked = !!savedPrefs[id]; else el.value = savedPrefs[id];
});
$("tempoVal").textContent = T("units.bpm", { n: $("tempo").value });
$("clickVolVal").textContent = T("units.pct", { n: $("clickVol").value });
$("visDelayVal").textContent = T("units.ms", { n: $("visDelay").value });
$("tuneVolVal").textContent = T("units.pct", { n: $("tuneVol").value });
prefIds.forEach(id => $(id).addEventListener("change", savePrefs));
// settings from before Transpose existed stored an absolute do (always the Internationale, in A)
if (savedPrefs && savedPrefs.doPitch && !("transpose" in savedPrefs)) { $("transpose").value = +savedPrefs.doPitch - 69; savePrefs(); }
$("doPitch").value = SONG_DO_MIDI;
renderPitch();
// saved choices that don't exist in this song fall back to the first one
if (!SEQ_CHOICES[$("seqSel").value]) $("seqSel").value = Object.keys(SEQ_CHOICES)[0];
if (!VERSE_M[$("drillVerse").value] && !($("drillVerse").value === "mix" && VERSE_COUNT > 1)) $("drillVerse").value = String(VERSE_NUMS[0]);
// each song remembers its own lyric choice
const LYRICSET_STORE = songKey("phrase-parrot-lyricset-v1");
const savedLyricSet = storeGet(LYRICSET_STORE);
if (savedLyricSet) $("lyricSet").value = savedLyricSet;
if (![...$("lyricSet").options].some(o => o.value === $("lyricSet").value)) $("lyricSet").value = $("lyricSet").options[0].value;
const rememberLyricSet = () => storeSet(LYRICSET_STORE, $("lyricSet").value);
$("lyricSet").addEventListener("change", rememberLyricSet);
$("lyricBox").addEventListener("click", e => { if (e.target.closest(".ly-tab")) setTimeout(rememberLyricSet, 0); });
// apply the saved verse choice and play-along choice
if ($("seqSel").value !== Object.keys(SEQ_CHOICES)[0]) {
  SEQ = joinFill(withItems(SEQ_CHOICES[$("seqSel").value].build()));
  renderWhole(); renderStartFrom();
}
loadAB();
renderAlongSub();
drillVerse = $("drillVerse").value || "1";
PHRASES = buildPool(drillVerse);
renderDrillVerse();
renderChorusMode();
// Switching songs: start that song at verse 1, then reload with it
$("songSel").addEventListener("change", () => {
  stopAll();
  $("drillVerse").value = "1"; $("seqSel").value = Object.keys(SEQ_CHOICES)[0];
  savePrefs();
  location.reload();
});
// a saved file name from another song gets this song's default
if (!$("myFileName").value || (/-my-lyrics\.txt$/.test($("myFileName").value) && !$("myFileName").value.startsWith(SONG_ID))) $("myFileName").value = defaultFileName();
// text that depends on the song's shape (phrase counts)
const halfChorus = CHORUS_PHRASES / 2;
$("myHelp").textContent = !HAS_CHORUS ? T("lyrics.helpNoChorus", { v: VERSE_PHRASES })
  : T(CHORUS_PHRASES % 2 === 0 ? "lyrics.help" : "lyrics.helpChorusOdd", { v: VERSE_PHRASES, c: CHORUS_PHRASES, half: halfChorus });
$("myLyrics").placeholder = T(HAS_CHORUS ? "lyrics.placeholderChorus" : "lyrics.placeholder", { v: VERSE_PHRASES });
// the drill round: resume a saved one, or shuffle a new one
if (!load()) { shuffle(); save(); }
renderProgress();
if (pos >= 0) { renderStage(); $("prompt").textContent = T("drill.welcomeBack"); }
else $("prompt").textContent = T("drill.firstPrompt", { n: order.length });
renderAB();   // show any saved A–B loop
renderTuning();
renderLegatoRow();
validateSong();
setUpDeployment();
setUpOfflineAndUpdates();
</script>
</body>
</html>
