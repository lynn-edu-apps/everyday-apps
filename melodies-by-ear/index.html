<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F6">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Melodies" id="appleTitle">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon192.png">
<link rel="icon" type="image/png" href="icon192.png">
<title>Melodies by Ear v0.46</title>
<style>
  :root {
    --paper: #F3F5F6;
    --ink: #22303C;
    --muted: #6B7A86;
    --teal: #1D6E7A;
    --teal-soft: #DCEBED;
    --gold: #D49A12;
    --koa: #6E4527;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 48px; }
  h1 {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 600; font-size: 1.55rem; margin: 0 0 4px;
  }
  .drill-title {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 600; font-size: 1.15rem; margin: 14px 0 2px;
  }
  .lede { color: var(--muted); margin: 0 0 18px; font-size: .95rem; line-height: 1.4; }

  .progress { display: flex; gap: 5px; margin: 0 0 6px; }
  .pip { flex: 1; height: 8px; border-radius: 4px; background: #D5DCE0; }
  .pip.done { background: var(--teal); }
  .pip.now { background: var(--gold); }
  .count { font-size: .88rem; color: var(--muted); margin: 0 0 16px; }

  .stage {
    background: #fff;
    border: 1px solid #DDE3E7;
    border-radius: 14px;
    padding: 18px 16px;
    min-height: 168px;
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
  }
  .prompt { font-size: 1.05rem; line-height: 1.45; margin: 0; }
  .prompt.quiet { color: var(--muted); }
  .phrase-id { font-size: .85rem; color: var(--muted); margin: 0; }
  .notes { display: flex; flex-wrap: wrap; gap: 14px 4px; align-items: center; }
  .n { position: relative; }
  .n.s16::after {
    content: ""; position: absolute; left: 22%; right: 22%; bottom: -11px; height: 6px;
    border-top: 2px solid var(--teal); border-bottom: 2px solid var(--teal); opacity: .85;
  }
  /* the bars sit below the chip, so they keep their color when it lights up */
  .n.pk.s16::after { border-color: #7FA9B0; }
  .n.do.s16::after { border-color: #8A5F00; }
  .n.dotted::after { content: "·"; font-weight: 900; margin-left: 1px; }
  .n {
    font-weight: 650; font-size: 1.02rem;
    padding: 4px 8px; border-radius: 8px;
    background: var(--teal-soft); color: var(--teal);
    transition: background .06s, color .06s;
  }
  .n.pk { background: transparent; color: #7FA9B0; box-shadow: inset 0 0 0 1.5px #B9D3D7; }
  .n.do { background: #FBF0D4; color: #8A5F00; }
  .n.on { background: var(--teal); color: #fff; }
  .n.do.on { background: var(--gold); color: #2B2005; }
  .bar { color: #B5C0C7; padding: 0 2px; }
  .reveal {
    align-self: flex-start;
    font: inherit; font-size: .92rem;
    background: none; border: 0; padding: 4px 0;
    color: var(--teal); text-decoration: underline; cursor: pointer;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 10px; }
  .btn {
    font: inherit; font-weight: 600; font-size: 1.05rem;
    border: 0; border-radius: 12px; padding: 16px 10px;
    cursor: pointer; touch-action: manipulation;
  }
  .btn.primary { background: var(--teal); color: #fff; }
  .btn.secondary { background: #fff; color: var(--teal); box-shadow: inset 0 0 0 2px var(--teal); }
  .btn.secondary.stop { background: var(--gold); color: #2B2005; box-shadow: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.wide { grid-column: 1 / -1; }
  .small-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .chipbtn {
    font: inherit; font-size: .9rem;
    background: #fff; color: var(--ink);
    border: 1px solid #C9D2D8; border-radius: 999px;
    padding: 7px 14px; cursor: pointer;
  }
  .chipbtn.active { background: var(--gold); border-color: var(--gold); color: #2B2005; }
  .chipbtn .gold { color: #8A5F00; font-weight: 650; }

  .metro {
    margin-top: 16px;
    background: #fff; border: 1px solid #DDE3E7; border-radius: 14px;
    padding: 12px 16px; display: grid; gap: 10px;
  }
  .metro-head { display: flex; align-items: center; justify-content: space-between; }
  .metro-title { font-weight: 600; }
  .beats { display: flex; gap: 8px; }
  .beat { width: 12px; height: 12px; border-radius: 50%; background: #D5DCE0; transition: background .04s; }
  .beat.one { width: 16px; height: 16px; }
  .beat.on { background: var(--teal); }
  .beat.one.on { background: var(--gold); }
  .switch { display: flex; align-items: center; gap: 12px; font-size: .97rem; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track {
    flex: none; position: relative; width: 44px; height: 26px; border-radius: 13px;
    background: #C9D2D8; transition: background .12s;
  }
  .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .12s;
  }
  .switch input:checked + .track { background: var(--teal); }
  .switch input:checked + .track::after { left: 21px; }
  .switch input:focus-visible + .track { outline: 3px solid var(--gold); outline-offset: 2px; }

  .calib { display: grid; gap: 10px; padding: 10px 0 2px; border-top: 1px solid #E3E8EB; }
  .calib-text { margin: 0; font-size: .95rem; line-height: 1.4; }
  .tap-pad {
    font: inherit; font-weight: 650; font-size: 1.2rem;
    border: 0; border-radius: 14px; padding: 30px 10px;
    background: var(--teal); color: #fff; cursor: pointer; touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .tap-pad.hit { background: #155760; }
  .calib-row { display: flex; align-items: center; justify-content: space-between; }
  .calib-count { color: var(--muted); font-size: .9rem; }

  /* Tap feedback: every button gives a quick press-and-glow when tapped,
     even if you tap the same one twice in a row */
  .btn, .chipbtn, .reveal, .tap-pad { transition: transform .08s ease; }
  @keyframes press {
    0%   { transform: scale(.94); filter: brightness(.82); box-shadow: 0 0 0 0 rgba(212,154,18,.75); }
    60%  { transform: scale(1);   filter: brightness(1);   box-shadow: 0 0 0 8px rgba(212,154,18,0); }
    100% { transform: scale(1);   filter: brightness(1);   box-shadow: 0 0 0 0 rgba(212,154,18,0); }
  }
  .pressed { animation: press .32s ease-out; }
  @keyframes flash {
    0%   { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,154,18,.45); }
    100% { border-color: #DDE3E7; box-shadow: 0 0 0 0 rgba(212,154,18,0); }
  }
  .stage.flash { animation: flash .6s ease-out; }

  .along {
    margin-top: 16px; background: #fff; border: 1px solid #DDE3E7; border-radius: 14px;
    padding: 14px 16px; display: grid; gap: 12px;
  }
  .along h2 {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 600; font-size: 1.15rem; margin: 0 0 2px;
  }
  .along-sub { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.4; }
  .btn.primary.stop { background: var(--gold); color: #2B2005; }
  .btn.secondary.resume { background: var(--teal); color: #fff; }
  .along-notes { margin-top: 0; }
  .along-notes summary { font-weight: 500; color: var(--teal); }
  .all-section { font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
  .all-line { display: flex; flex-wrap: wrap; gap: 12px 3px; align-items: center; margin: 0 0 12px; }
  .all-line .bn { font-size: .75rem; color: var(--muted); min-width: 22px; }
  .all-line .n { font-size: .9rem; padding: 3px 6px; }

  .along-start label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .along-btns { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .along-btns.two { grid-template-columns: 1fr 1fr; }
  .along-status { margin: 0; font-size: .92rem; color: var(--ink); line-height: 1.4; }
  .along-tip { margin: 6px 0 0; font-size: .85rem; color: var(--muted); }
  .all-line { border-radius: 10px; padding: 2px 4px; margin-left: -4px; margin-right: -4px; transition: background .1s; }
  .all-line.on { background: #EEF5F6; }
  .all-line.resume-here { background: #FBF0D4; }
  .all-line .bn {
    font: inherit; font-size: .75rem; color: var(--teal); min-width: 26px;
    background: none; border: 0; padding: 4px 2px; cursor: pointer; text-decoration: underline;
  }

  .switch.follow { margin: 10px 0 4px; font-size: .92rem; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96); border-top: 1px solid #DDE3E7;
    box-shadow: 0 -2px 10px rgba(34,48,60,.08);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .dock-where { flex: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dock .btn { padding: 11px 18px; font-size: 1rem; }
  /* while the melody plays, extra room below the page lets even the last
     lines scroll up to the same spot as the others */
  body.docked main { padding-bottom: 75vh; }

  .ab { display: grid; gap: 8px; justify-items: start; }
  .ab-msg { margin: 0; font-size: .92rem; line-height: 1.4; }
  .ab-msg strong { color: var(--teal); }
  /* lines inside the A–B loop get a teal bracket down the left side */
  .all-line { position: relative; }
  .all-line.in-ab, .all-line.ab-pending { padding-left: 12px; }
  .all-line.in-ab::before, .all-line.ab-pending::before {
    content: ""; position: absolute; left: 0; top: -1px; bottom: -14px; width: 4px;
    border-radius: 2px; background: var(--teal);
  }
  .all-line.ab-last::before, .all-line.ab-pending::before { bottom: 2px; }
  .all-line.ab-pending::before { background: var(--gold); }
  .picking .all-line .bn { background: #EEF5F6; border-radius: 6px; text-decoration: none; font-weight: 700; }
  select:disabled { opacity: .55; }

  .transpose-row { justify-content: flex-start; }
  .chipbtn.step { width: 44px; height: 40px; padding: 0; font-size: 1.3rem; line-height: 1; }
  .t-val { flex: 1; text-align: center; font-weight: 600; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .presets .chipbtn.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .hint { margin: 6px 0 0; font-size: .85rem; color: var(--muted); line-height: 1.4; }
  .pitch-note {
    font: inherit; font-size: .88rem; font-weight: 600; color: #2B2005;
    background: #FBF0D4; border: 1px solid #EED9A2; border-radius: 999px;
    padding: 5px 12px; margin: 0 0 10px; cursor: pointer;
  }

  .reveal-row { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .lyrics { display: grid; gap: 10px; border-top: 1px solid #E3E8EB; padding-top: 10px; }
  .ly-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .ly-tab {
    font: inherit; font-size: .85rem; border: 1px solid #C9D2D8; background: #fff; color: var(--ink);
    border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .ly-tab.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .ly-set-name { margin: 0 0 4px; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .ly-row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 3px 0; }
  .ly-label { font-size: .78rem; color: var(--muted); padding-top: 3px; }
  .ly-text { font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif; font-size: 1.08rem; line-height: 1.35; }
  .ly-mean { display: block; font-family: system-ui, -apple-system, sans-serif; font-size: .85rem; color: var(--muted); margin-top: 1px; }
  .ly-empty { margin: 0; font-size: .92rem; color: var(--muted); }
  .lyrics-panel h3 { font-size: 1rem; margin: 6px 0 4px; }
  textarea {
    width: 100%; font: inherit; font-size: .95rem; line-height: 1.4;
    padding: 10px; border: 1px solid #C9D2D8; border-radius: 8px; background: #fff; color: var(--ink);
  }
  .mine-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .file-btn { position: relative; overflow: hidden; display: inline-block; }
  .settings label.file-btn { font-size: .9rem; color: var(--ink); margin-bottom: 0; display: inline-block; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #myStatus.warn { color: #8A4B00; }
  .settings label.fname-label { margin-top: 10px; }
  .fname {
    width: 100%; font: inherit; font-size: 1rem; padding: 9px 10px;
    border: 1px solid #C9D2D8; border-radius: 8px; background: #fff; color: var(--ink);
  }

  .drill-verse { display: flex; align-items: center; gap: 6px; margin: 0 0 12px; }
  .dv-label { font-size: .9rem; color: var(--muted); margin-right: 4px; }
  .dv {
    font: inherit; font-size: .95rem; font-weight: 600; min-width: 44px; height: 36px; padding: 0 12px;
    border: 1px solid #C9D2D8; border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer;
  }
  .dv.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .drill-chorus { flex-wrap: wrap; margin-top: -4px; }
  .cm {
    font: inherit; font-size: .88rem; height: 32px; padding: 0 11px;
    border: 1px solid #C9D2D8; border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer;
  }
  .cm.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .pip.ch.done { background: #B88A12; }
  .progress.many { gap: 3px; }
  .ly-row.ly-current .ly-label { color: var(--teal); font-weight: 700; }
  .ly-row.ly-current .ly-text { font-weight: 600; }
  .trip { display: inline-flex; gap: 3px; position: relative; padding-top: 12px; }
  .trip::before {
    content: ""; position: absolute; top: 4px; left: 6px; right: 6px; height: 6px;
    border: 1.5px solid #8FA4AE; border-bottom: 0; border-radius: 3px 3px 0 0;
  }
  .trip::after {
    content: "3"; position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
    padding: 0 3px; background: #fff; font-size: .66rem; font-weight: 700; color: #6B7A86; line-height: 1;
  }

  .seg-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tstrings { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .tstr {
    font: inherit; border: 1px solid #C9D2D8; border-radius: 12px; background: #fff; color: var(--ink);
    padding: 10px 4px 8px; cursor: pointer; line-height: 1.15;
  }
  .tstr b { display: block; font-size: 1.25rem; }
  .tstr small { display: block; font-size: .72rem; color: var(--muted); margin-top: 2px; }
  .tstr.on { background: var(--gold); border-color: var(--gold); color: #2B2005; }
  .tstr.on small { color: #4A3608; }

  .song-row { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
  .song-row label { font-size: .9rem; color: var(--muted); }
  .song-row select { flex: 1; }
  .dv-btns { display: contents; }

  details { margin-top: 22px; }
  summary { cursor: pointer; font-weight: 600; color: var(--ink); padding: 6px 0; }
  .settings { display: grid; gap: 14px; padding: 8px 0 4px; }
  .settings label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row input[type=range] { flex: 1; accent-color: var(--teal); }
  .tempo-val { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  select {
    width: 100%; font: inherit; font-size: 1rem;
    padding: 9px 10px; border: 1px solid #C9D2D8; border-radius: 8px;
    background: #fff; color: var(--ink);
  }
  .check { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
  .check input { width: 18px; height: 18px; accent-color: var(--teal); }

  .footnote { font-size: .82rem; color: var(--muted); margin-top: 22px; line-height: 1.45; }

  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    .pressed { animation: none; filter: brightness(.85); }
    .stage.flash { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) { .n { transition: none; } }
  /* Error banner: stays until dismissed (alpha-testing phase: fail loudly) */
  .errbox {
    position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top)); z-index: 30;
    max-width: 560px; margin: 0 auto; max-height: 60vh; overflow-y: auto;
    background: #FFF1EE; color: #5A1408; border: 2px solid #C0391B; border-radius: 12px;
    box-shadow: 0 6px 24px rgba(90,20,8,.25); padding: 8px 12px 10px;
  }
  .err-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .err-head strong { font-size: 1rem; }
  .err-close { font: inherit; font-size: 1.1rem; border: 0; background: none; color: #5A1408; padding: 6px 10px; cursor: pointer; }
  .err-list { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 6px; }
  .err-item { font-size: .9rem; line-height: 1.35; padding: 6px 8px; border-radius: 8px; background: #fff; border: 1px solid #F0B8AA; overflow-wrap: anywhere; }
  .err-item.copyable { cursor: pointer; }
  .err-details { display: block; margin-top: 6px; font: .74rem/1.35 ui-monospace, Menlo, Consolas, monospace;
    color: #5A3A33; white-space: pre-wrap; overflow-wrap: anywhere; }
  .err-item.copied { background: #E8F4EA; border-color: #9CCBA5; }
  .err-hint { margin: 2px 0 0; font-size: .8rem; color: #7A3A2C; }
  .deploy-tag { font-family: system-ui, -apple-system, sans-serif; font-size: .72rem; font-weight: 700; vertical-align: middle;
    margin-left: 6px; padding: 2px 7px; border-radius: 999px; color: #fff; background: #B84028; }
  .deploy-tag.stable { background: #3C5AA0; }
  /* "A new version is ready" notice (informational, so tapping it doesn't copy) */
  .update-note {
    position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 25;
    max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
    background: #fff; border: 2px solid var(--teal); border-radius: 12px; padding: 10px 12px;
    box-shadow: 0 6px 24px rgba(34,48,60,.2); font-size: .95rem;
  }
  .update-note span { flex: 1; }
  .update-note .btn { padding: 9px 14px; font-size: .95rem; }
  .ver { font-family: system-ui, -apple-system, sans-serif; font-size: .8rem; font-weight: 500; color: var(--muted); vertical-align: middle; margin-left: 4px; }
</style>
</head>
<body>
<main>
  <h1><span data-s="app.name"></span> <span class="ver">v0.46</span><span class="deploy-tag" id="deployTag" hidden></span></h1>
  <div class="song-row">
    <label for="songSel" data-s="ui.song"></label>
    <select id="songSel"></select>
  </div>
  <button class="pitch-note" id="pitchNote" hidden></button>
  <h2 class="drill-title" data-s="ui.drillTitle"></h2>
  <p class="lede" id="lede"></p>

  <div class="drill-verse" role="group" aria-label="Which verse to practice" data-s-aria-label="ui.whichVerseAria">
    <span class="dv-label" data-s="ui.verse"></span>
    <span id="dvBtns" class="dv-btns"></span>
    <input type="hidden" id="drillVerse" value="1">
  </div>
  <div class="drill-verse drill-chorus" id="chorusRow" role="group" aria-label="Chorus phrases" data-s-aria-label="ui.chorusPhrasesAria">
    <span class="dv-label" data-s="ui.chorus"></span>
    <button class="cm" data-m="mixed" data-s="ui.chorusMixed"></button><button class="cm" data-m="after" data-s="ui.chorusAfter"></button><button class="cm" data-m="skip" data-s="ui.chorusSkip"></button>
    <input type="hidden" id="chorusMode" value="mixed">
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <p class="count" id="count"></p>

  <div class="stage" aria-live="polite">
    <p class="prompt quiet" id="prompt"></p>
    <p class="phrase-id" id="phraseId" hidden></p>
    <div class="notes" id="notes" hidden></div>
    <div class="reveal-row">
      <button class="reveal" id="revealBtn" hidden data-s="ui.showSolfege"></button>

    for (const it of items) if (!it.bar && !(it.syl in PITCH)) say(T("err.songSyllable", { label, syl: it.syl }));
  };

// ---------- Offline use and updates (PWA) ----------
// A service worker (service-worker.js, in each deployment folder) keeps a copy
// of the app so it opens without a connection, and always fetches the newest
// page when online. Only registered on GitHub Pages: in previews (like the
// Claude app's viewer) there is no service-worker.js, which isn't an error.
// When a newer version is installed while the app is open, a notice offers
// to reload; coming back to the app checks for a newer version.
function setUpOfflineAndUpdates() {
  if (!("serviceWorker" in navigator) || !location.hostname.endsWith(".github.io")) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" }).then(reg => {
    // Coming back to the app checks for a newer version. With no network
    // (airplane mode) there is nothing to check, so don't try: that failure
    // is expected, not an error. navigator.onLine is false only when the
    // device knows it is offline, so a real failure while online still shows.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || navigator.onLine === false) return;
      reg.update().catch(e => {
        if (navigator.onLine === false) return;     // went offline during the check
        reportError(T("err.swUpdate", { msg: `${e.name}: ${e.message}` }));
      });
    });
  }).catch(e => reportError(T("err.swRegister", { msg: e.message })));
  // The first install also takes control of the page; that isn't an update.
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) $("updateNote").hidden = false; });
  $("updateReload").addEventListener("click", () => location.reload());
  $("updateLater").addEventListener("click", () => { $("updateNote").hidden = true; });
}

let ctx = null;

// When an alert, alarm, call or Siri interrupts the page, iOS can leave the
// audio engine "interrupted", stuck in "suspended", or reporting "running"
// while its clock has frozen. Any of those means silence until reload.
// So on every tap we check the engine, and if it looks stuck we throw it away
// and build a fresh one, inside the tap (which iOS requires).
let needsFresh = false;     // set when we notice an interruption

function newContext() {
  if (ctx && ctx.state !== "closed") ctx.close().catch(e => reportError(T("err.audio", { where: "close", msg: e.message })));
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  cache.clear();            // sounds are rebuilt for the new engine
  needsFresh = false;
  ctx.onstatechange = () => {
    if (ctx.state === "interrupted" || ctx.state === "suspended") {
      needsFresh = true;
      if (typeof onAudioInterrupted === "function") onAudioInterrupted();
    }
  };
}

function ensureAudio() {
  // iOS 17+: treat this page like a music player. It then keeps playing with
  // the silent switch on, and recovers more reliably after interruptions.
  if (navigator.audioSession) {
    try { navigator.audioSession.type = "playback"; }
    catch (e) { reportError(T("err.audio", { where: "audioSession", msg: e.message })); }
  }

  const now = performance.now();
  let frozen = false;
  if (ctx && ctx.state === "running" && lastCheck) {
    const wallGap = (now - lastCheck.wall) / 1000;
    const audioGap = ctx.currentTime - lastCheck.audio;
    if (wallGap > 0.5 && audioGap < wallGap * 0.2) frozen = true;
  }
  if (!ctx || needsFresh || frozen || ctx.state === "closed" || ctx.state === "interrupted") {
    if (typeof stopAll === "function" && ctx) stopAll();
    newContext();
  }
  if (ctx.state !== "running") ctx.resume().catch(e => reportError(T("err.audio", { where: "resume", msg: e.message })));

  // A silent blip, played inside the tap, "unlocks" output on iOS.
  try {
    const b = ctx.createBuffer(1, 1, ctx.sampleRate);
    const s = ctx.createBufferSource();
    s.buffer = b; s.connect(ctx.destination); s.start(0);
  } catch (e) { reportError(T("err.audio", { where: "unlock", msg: e.message })); }

  lastCheck = { wall: now, audio: ctx.currentTime };
}

// ---------- Consistent pluck tone ----------
// Each note starts as a short burst of noise. Truly random noise made some
// sessions sound brighter and others duller, because the sounds are rebuilt
// whenever the audio restarts. Now the noise comes from a fixed "recipe" per
// note: we try 9 recipes, measure how bright each one is, and keep the middle
// one. So every note has a typical, steady tone, the same every session.
function seededNoise(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  const candidates = [];
  for (let c = 0; c < 9; c++) {
    const rnd = seededNoise(Math.round(freq * 100) * 31 + c * 7919 + passes);
    let ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = rnd() * 2 - 1;
    for (let p = 0; p < passes; p++) {
      const r2 = new Float32Array(N);
      for (let i = 0; i < N; i++) r2[i] = (ring[i] + ring[(i + 1) % N]) / 2;
      ring = r2;
    }
    const mean = ring.reduce((a, b) => a + b, 0) / N;
    for (let i = 0; i < N; i++) ring[i] -= mean;
    // brightness: how much the wave jumps sample to sample, relative to its size
    let edge = 0, size = 0;
    for (let i = 0; i < N; i++) { edge += Math.abs(ring[i] - ring[(i + 1) % N]); size += Math.abs(ring[i]); }
    candidates.push({ ring, bright: edge / (size || 1) });

function makePluck(freq, timbre) {
  const key = freq.toFixed(3) + timbre;
  if (cache.has(key)) return cache.get(key);
  const sr = ctx.sampleRate;
  const N = Math.max(2, Math.floor(sr / freq - 0.5));
  const rate = freq / (sr / (N + 0.5));
  const dur = timbre === "uke" ? 2.2 : 3.0;
  const decay = timbre === "uke" ? 0.994 : 0.997;
  const passes = timbre === "uke" ? 3 : 1;
  const len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(1, len, sr);
  const out = buf.getChannelData(0);
  const ring = excitation(N, passes, freq);
  for (let i = 0; i < len; i++) {
    const idx = i % N, nxt = (idx + 1) % N;
    out[i] = ring[idx];
    ring[idx] = decay * 0.5 * (ring[idx] + ring[nxt]);
  }
  let peak = 0;
  for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(out[i]));
  const fadeStart = len - Math.floor(sr * 0.15);
  for (let i = 0; i < len; i++) {
    out[i] /= (peak || 1);

    pk.type = "peaking"; pk.frequency.value = pkDef.f; pk.gain.value = pkDef.gain; pk.Q.value = pkDef.q;

  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
  n.connect(hp).connect(g).connect(ctx.destination);
  n.start(when, Math.random() * 1.5); n.stop(when + 0.1);
  activeNodes.push(n);
}

// Legato: the whole run of notes is ONE continuous sound that changes pitch
// at each note, the way a player slurs, so nothing overlaps. A repeated
// note gets a brief dip in volume so you still hear it as a new note.
// events: [{ midi, t, dur }] in time order.
function legatoVoice(events, type) {
  if (!events.length) return;
  const w = WINDS[type];
  const first = events[0], last = events[events.length - 1];
  const start = first.t, end = last.t + Math.max(0.06, last.dur - 0.035);
  const f0 = freqOf(first.midi);
  const voices = w.voices || [0];
  const oscs = voices.map(c => {
    const o = ctx.createOscillator();
    o.setPeriodicWave(windWave(type));
    o.frequency.setValueAtTime(f0, start); o.detune.value = c;
    return o;
  });
  // one handle that moves every voice together
  const osc = {
    connect: n => oscs.forEach(o => o.connect(n)),
    start: t => oscs.forEach(o => o.start(t)),
    stop: t => oscs.forEach(o => o.stop(t)),
    frequency: {
      setValueAtTime: (v, t) => oscs.forEach(o => o.frequency.setValueAtTime(v, t)),
      exponentialRampToValueAtTime: (v, t) => oscs.forEach(o => o.frequency.exponentialRampToValueAtTime(v, t))
    }
  };
  const shaped = toneChain(w, 1000);
  const lp = shaped.lp;
  const g = ctx.createGain();
  const levelFor = m => w.level * (0.8 + 0.2 * Math.min(1.6, 330 / freqOf(m))) / Math.sqrt(voices.length);
  const cutFor = m => Math.min(w.lowpass, Math.max(freqOf(m) * (w.track || 6), 1200));
  if (w.swell) {
    lp.frequency.setValueAtTime(Math.min(w.swell.from, cutFor(first.midi)), start);
    lp.frequency.exponentialRampToValueAtTime(cutFor(first.midi), start + w.swell.time);
  } else lp.frequency.setValueAtTime(cutFor(first.midi), start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(levelFor(first.midi), start + w.attack);
  events.forEach((e, i) => {
    if (i === 0) return;
    const prev = events[i - 1];
    const f = freqOf(e.midi), lvl = levelFor(e.midi);
    if (e.midi === prev.midi) {
      if (w.scrape) bowScrape(e.t, f, w.scrape * 0.7);
      // same note again: a quick dip, like a light re-tongue or bow change
      g.gain.setValueAtTime(levelFor(prev.midi), e.t - 0.035);
      g.gain.linearRampToValueAtTime(levelFor(prev.midi) * 0.3, e.t - 0.004);
      g.gain.linearRampToValueAtTime(lvl, e.t + 0.03);
    } else {
      // move to the new pitch: winds slide very briefly, so it sounds
      // connected; bowed strings change instantly, like a finger on the string
      if (w.slide === 0) {
        osc.frequency.setValueAtTime(f, e.t);
      } else {
        const gl = w.glide || 0.022;
        osc.frequency.setValueAtTime(freqOf(prev.midi), e.t - gl / 2);
        osc.frequency.exponentialRampToValueAtTime(f, e.t + gl / 2);
      }
      g.gain.setValueAtTime(levelFor(prev.midi), e.t - 0.012);
      g.gain.linearRampToValueAtTime(lvl, e.t + 0.04);
      lp.frequency.setValueAtTime(cutFor(prev.midi), e.t - 0.012);
      lp.frequency.linearRampToValueAtTime(cutFor(e.midi), e.t + 0.01);
    }
  });
  g.gain.setValueAtTime(levelFor(last.midi), end);
  g.gain.exponentialRampToValueAtTime(0.0001, end + w.release);
  osc.connect(shaped.input);
  const trem = tremoloNode(w, start, end);
  shaped.output.connect(trem);
  trem.connect(g).connect(ctx.destination);
  osc.start(start); osc.stop(end + w.release + 0.05);
  activeNodes.push(...oscs);
  if (w.scrape) bowScrape(start, f0, w.scrape);
  if (w.vib) {
    // vibrato that eases in after each new pitch, as players do
    const lfo = ctx.createOscillator(), depth = ctx.createGain();
    lfo.frequency.value = w.vib.rate;
    events.forEach(e => {
      const amount = freqOf(e.midi) * (Math.pow(2, w.vib.cents / 1200) - 1);
      depth.gain.setValueAtTime(0, e.t);
      if (e.dur > w.vib.delay + 0.1) {
        depth.gain.setValueAtTime(0, e.t + w.vib.delay);
        depth.gain.linearRampToValueAtTime(amount, e.t + Math.min(e.dur - 0.02, w.vib.delay + 0.3));
      }
    });
    oscs.forEach(o => depth.connect(o.frequency));
    lfo.connect(depth);
    lfo.start(start); lfo.stop(end + w.release + 0.05);
    activeNodes.push(lfo);
  }
  if (w.breath) {
    const n = ctx.createBufferSource(); n.buffer = breathNoise(); n.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = Math.min(6000, f0 * 3); bp.Q.value = 0.8;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, start);
    ng.gain.exponentialRampToValueAtTime(w.breath * 2.5, start + 0.02);
    ng.gain.exponentialRampToValueAtTime(w.breath, start + 0.12);
    ng.gain.setValueAtTime(w.breath, end);
    ng.gain.exponentialRampToValueAtTime(0.0001, end + w.release);
    n.connect(bp).connect(ng).connect(ctx.destination);
    n.start(start, Math.random() * 1.5); n.stop(end + w.release + 0.05);
    activeNodes.push(n);
  }
}

// ---------- Piano ----------
// A struck string: overtones slightly stretched (as real piano strings are),
// each fading at its own rate (higher ones faster, higher notes faster), plus
// a soft hammer "thunk". Built once per pitch and reused, like the ukulele.
const pianoCache = new Map();
function makePiano(freq) {
  const key = freq.toFixed(3) + "|" + ctx.sampleRate;
  const hit = pianoCache.get(key);
  if (hit && hit.ctx === ctx) return hit.buf;
  const sr = ctx.sampleRate, dur = 3.2, len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(1, len, sr), out = buf.getChannelData(0);
  const B = 0.00035;                                  // string stiffness (stretches overtones)
  const pitchFactor = Math.pow(freq / 261.6, 0.6);     // higher notes fade faster
  const rnd = seededNoise(Math.round(freq * 10));
  for (let n = 1; n <= 14; n++) {
    const fn = n * freq * Math.sqrt(1 + B * n * n);
    if (fn > sr / 2 - 500) break;
    const amp = Math.pow(n, -1.15) * (n === 1 ? 1 : 0.9) * (1 + 0.15 * Math.sin(n * 1.7));
    const decay = 1.6 * pitchFactor * (1 + 0.35 * (n - 1));     // per second (shortened in v0.36 and v0.37)
    const phase = rnd() * 6.283;
    const w = 2 * Math.PI * fn / sr;
    for (let i = 0; i < len; i++) out[i] += amp * Math.exp(-decay * i / sr) * Math.sin(w * i + phase);
  }
  // hammer: a short, soft thump of low noise at the very start
  let lpState = 0;
  const thump = Math.floor(sr * 0.03);
  for (let i = 0; i < thump; i++) {
    lpState += 0.08 * ((rnd() * 2 - 1) - lpState);
    out[i] += lpState * 1.6 * (1 - i / thump);
  }
  // quick attack and normalize
  let peak = 0;
  for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(out[i]));
  const att = Math.floor(sr * 0.004);
  for (let i = 0; i < len; i++) { out[i] /= (peak || 1); if (i < att) out[i] *= i / att; }
  pianoCache.set(key, { ctx, buf });
  return buf;
}
function pianoAt(midi, when, holdSec) {
  const src = ctx.createBufferSource();
  src.buffer = makePiano(freqOf(midi));
  const g = ctx.createGain();
  // the key is released when the note ends: the damper stops the string
  g.gain.setValueAtTime(0.55, when);
  g.gain.setValueAtTime(0.55, when + holdSec);
  g.gain.exponentialRampToValueAtTime(0.0001, when + holdSec + 0.12);
  src.connect(g).connect(ctx.destination);
  src.start(when); src.stop(when + holdSec + 0.15);
  activeNodes.push(src);
}

function pluckAt(midi, when, holdSec) {
  const timbre = $("timbre").value;
  if (timbre === "piano") return pianoAt(midi, when, holdSec);
  if (WINDS[timbre]) return windAt(midi, when, holdSec, timbre);
  const { buf, rate } = makePluck(freqOf(midi), timbre);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.playbackRate.value = rate;
  const lp = ctx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = timbre === "uke" ? 2600 : 4800;
  const g = ctx.createGain();
  // Damp the string gently when the next note starts, like a player's finger
  g.gain.setValueAtTime(0.6, when);
  g.gain.setValueAtTime(0.6, when + holdSec);
  g.gain.linearRampToValueAtTime(0.0001, when + holdSec + 0.06);
  src.connect(lp).connect(g).connect(ctx.destination);
  src.start(when);
  src.stop(when + holdSec + 0.1);
  activeNodes.push(src);
}
let looping = null;      // timer for scheduling the next loop pass
let endTimer = null;     // timer that flips the button back after a single pass
let playing = false;

function setPlaying(on, kind) {
  playing = on;
  const metro = kind === true || kind === "metro";
  const all = $("allBtn");
  all.textContent = on && kind === "all" ? T("drill.stop") : playLabel();
  all.classList.toggle("stop", !!(on && kind === "all"));
  const btn = $("againBtn");
  btn.textContent = on ? T("drill.stop") : T("ui.playAgain");
  btn.classList.toggle("stop", on);
  btn.disabled = on ? false : pos < 0;
  const m = $("metroBtn");
  m.textContent = on && metro ? T("drill.stopMetronome") : T("ui.metronomeOnly");
  m.classList.toggle("active", !!(on && metro));

  document.querySelectorAll(".tstr").forEach(b => b.classList.toggle("on", !!(on && kind === "tune" && +b.dataset.midi === tuneMidi)));
}
function stopAll() {
  activeNodes.forEach(s => {
    try { s.stop(); }

// ---------- Highlights that follow the sound ----------
// Highlights follow the audio clock rather than a separate timer, so they
// wait for the sound if the phone starts it late. Two iPhone quirks matter:
// 1. Its audio clock often moves in jumps instead of smoothly, so we smooth
//    it, using the phone's "what is being heard right now" timestamp when it
//    offers one.
// 2. A jump can skip right over a short highlight, so instead of asking
//    "is this one on right now?", each group (beat dots, note syllables)
//    lights its most recent event and holds it long enough to see.
let visuals = [];          // { el, group, start, end } in audio-clock seconds
let rafId = null;
const MIN_HOLD_MS = 120;
let lastCT = -1, lastCTwall = 0, lastHeard = 0, heardCtx = null;

function showAt(el, when, dur) {
  const group = el.classList.contains("beat") ? "beat" : el.classList.contains("all-line") ? "line" : "note";
  visuals.push({ el, group, start: when, end: when + dur, shownAt: 0 });
  if (!rafId) rafId = requestAnimationFrame(drawVisuals);
}

function heardTime() {
  const wall = performance.now();
  const ct = ctx.currentTime;
  if (ctx !== heardCtx) { heardCtx = ctx; lastCT = -1; lastHeard = 0; }
  if (ct !== lastCT) { lastCT = ct; lastCTwall = wall; }
  const sinceTick = (wall - lastCTwall) / 1000;
  // If the clock hasn't moved for a while, the sound isn't playing yet
  // (or has paused): hold still rather than run ahead of it.
  const ahead = sinceTick > 0.35 ? 0 : sinceTick;
  const lag = (ctx.outputLatency || 0) + (ctx.baseLatency || 0);
  let t = ct + ahead - lag;
  try {
    if (ctx.getOutputTimestamp) {
      const ts = ctx.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
        const heard = ts.contextTime + (wall - ts.performanceTime) / 1000;
        t = Math.min(heard, ct + ahead);   // never ahead of the clock itself
      }
    }
  } catch (e) { reportError(T("err.audio", { where: "getOutputTimestamp", msg: e.message })); }
  lastHeard = Math.max(lastHeard, t);     // never step backwards
  return lastHeard;
}

function drawVisuals() {
  rafId = null;
  if (!ctx || !visuals.length) return;
  const now = heardTime() - (+$("visDelay").value) / 1000;
  const wall = performance.now();
  const keep = [];
  for (const group of ["beat", "note", "line"]) {
    const items = visuals.filter(v => v.group === group);
    // the latest event that has started
    let current = null;
    for (const v of items) if (v.start <= now && (!current || v.start > current.start)) current = v;
    if (current && !current.shownAt) current.shownAt = wall;
    const lit = current && (now < current.end || wall - current.shownAt < MIN_HOLD_MS) ? current : null;
    for (const v of items) {
      if (v !== lit && v.el !== (lit && lit.el)) v.el.classList.remove("on");
      // keep future events, and the current one until it's done showing
      if (v.start > now || v === lit) keep.push(v);
    }
    if (lit) lit.el.classList.add("on");
    if (group === "line" && lit && lit.el !== lastLineEl) { lastLineEl = lit.el; onLineChange(lit.el); }
  }
  visuals = keep;
  if (visuals.length) rafId = requestAnimationFrame(drawVisuals);
  else document.querySelectorAll(".n.on, .beat.on").forEach(el => el.classList.remove("on"));
}

// ---------- Playback ----------
let timers = [];
// Metronome click: a short pitched tick. The first beat of each measure is
// higher and louder so you can hear where "1" is.
function clickAt(when, accent, beatIndex) {
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = "triangle";
  osc.frequency.value = accent ? 1760 : 1100;
  const peak = (accent ? 0.55 : 0.28) * (+$("clickVol").value / 100);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), when + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, when + (accent ? 0.07 : 0.05));
  osc.connect(g).connect(ctx.destination);
  osc.start(when); osc.stop(when + 0.09);
  activeNodes.push(osc);
  const dot = calibrating ? null : document.querySelectorAll("#beats .beat")[beatIndex];
  if (dot) {
    showAt(dot, when, 0.14);
  }
}

// Schedules one pass of a phrase starting at audio time t.
// Returns the time the pass is finished. In loop mode the pass always has a
// lead-in measure (clicked if count-in is on) and the last measure is filled
// out to a full bar, so every repeat lines up with the beat.
// opt.beat is one metronome beat in seconds (a quarter note in 4/4 or 3/4,
// a dotted quarter in 6/8); opt.eighth is an eighth note.
function schedulePass(phrase, t, opt) {
  const { beat, eighth, doMidi, countIn, clickAll, loop } = opt;
  const notes = phrase.items.filter(x => !x.bar);
  const pickup = pickupEighths(phrase.items);
  const total = notes.reduce((s, n) => s + n.dur, 0);

  const leadIn = countIn || loop;
  const downbeat = leadIn ? t + BEATS_PER_BAR * beat : t + pickup * eighth;
  if (countIn) for (let b = 0; b < BEATS_PER_BAR; b++) clickAt(t + b * beat, b === 0, b);

  const noteStart = downbeat - pickup * eighth;
  const phraseEnd = noteStart + total * eighth;
  const fullBars = Math.ceil((total - pickup) / METER.perBar - 1e-6);
  const barEnd = downbeat + fullBars * BEATS_PER_BAR * beat;
  const clickUntil = loop ? barEnd : phraseEnd;

  if (clickAll) {
    const firstBeat = countIn ? 0 : -Math.floor(pickup / METER.beatLen);
    for (let k = firstBeat; downbeat + k * beat < clickUntil - 0.01; k++) {
      const pos = ((k % BEATS_PER_BAR) + BEATS_PER_BAR) % BEATS_PER_BAR;
      clickAt(downbeat + k * beat, pos === 0, pos);
    }
  }

  const chips = opt.chips || [...document.querySelectorAll(opt.chipSel || "#notes .n")];
  if (chips.length !== notes.length) reportError(T("err.chipMismatch", { chips: chips.length, notes: notes.length }));
  opt.noteStart = noteStart;
  let nt = noteStart;
  const timbreNow = $("timbre").value;
  const legatoRun = WINDS[timbreNow] && $("legato").checked ? [] : null;
  notes.forEach((n, i) => {
    const dur = n.dur * eighth;
    if (legatoRun) legatoRun.push({ midi: doMidi + PITCH[n.syl], t: nt, dur });
    else pluckAt(doMidi + PITCH[n.syl], nt, dur);
    const chip = chips[i];
    if (chip) {
      showAt(chip, nt, Math.max(0.05, dur - 0.03));
    }
    nt += dur;
  });
  if (legatoRun) legatoVoice(legatoRun, timbreNow);
  return loop ? barEnd : phraseEnd;
}

// What the user sees if the audio gets interrupted mid-play
function onAudioInterrupted() {
  if (wholeRun) { pauseWhole(); return; }
  if (!playing) return;
  stopAll();
  $("prompt").textContent = T("drill.interrupted");
}

// The whole melody is just the 16 phrases joined end to end. Each phrase
// already carries its own pickups, so joined together they rebuild the
// sheet music exactly: the opening pickup in bar 4, then bars 5–36.
const wholeItems = () => SEQ.flatMap(p => p.items);

// ---------- Syllable chips with rhythm marks ----------
// Durations are in eighth notes, so a 16th is 0.5. Every 16th gets a double
// underline (like the two beams on a written 16th). If the note just before
// a 16th is dotted (a dotted 16th, eighth, quarter or half), it gets a dot
// after its name, as in sheet music. Works for any song's data.
const SIXTEENTH = 0.5;
const DOTTED = [0.75, 1.5, 3, 6];
const near = (a, b) => Math.abs(a - b) < 1e-6;
const isTrip = it => it && !it.bar && Math.abs(it.dur - 2 / 3) < 1e-6;
function chipsHTML(items) {
  const notes = items.filter(x => !x.bar);
  let html = "", k = 0, tripLeft = 0;
  for (let ii = 0; ii < items.length; ii++) {
    const it = items[ii];
    if (it.bar) { html += `<span class="bar">|</span>`; continue; }
    // three triplet eighths get a small "3" bracket over them, as in sheet music
    if (!tripLeft && isTrip(it) && isTrip(items[ii + 1]) && isTrip(items[ii + 2])) { html += `<span class="trip">`; tripLeft = 3; }
    const nextNote = notes[k + 1];
    const is16 = near(it.dur, SIXTEENTH);
    const dotted = DOTTED.some(d => near(it.dur, d)) && nextNote && near(nextNote.dur, SIXTEENTH);
    const cls = ["n", it.pk ? "pk" : "", it.syl === "do" ? "do" : "", is16 ? "s16" : "", dotted ? "dotted" : ""].join(" ");
    const label = is16 ? T("chips.sixteenth") : dotted ? T("chips.dotted") : "";
    html += `<span class="${cls}"${label ? ` title="${label}"` : ""}>${it.syl}</span>`;
    if (tripLeft && --tripLeft === 0) html += `</span>`;
    k++;
  }
  return html;
}

function renderWhole() {
  let html = "";
  SEQ.forEach((p, i) => {
    if (i === 0 || SEQ[i - 1].section !== p.section) html += `<p class="all-section">${p.section}</p>`;
    const bar = barNums(p)[0];
    html += `<div class="all-line" data-i="${i}"><button class="bn" data-start="${i}" aria-label="${T("seq.startFromBarAria", { bar })}">${bar}</button>`;
    html += chipsHTML(p.items);
    html += `</div>`;
  });
  $("allNotes").innerHTML = html;
}

}
function onBarTap(i) {
  if (abPick === "a") { abFirst = i; abPick = "b"; renderAB(); return; }
  if (abPick === "b") {
    abRange = { a: Math.min(abFirst, i), b: Math.max(abFirst, i) };
    abPick = null; abFirst = null;
    $("loop").checked = true;              // an A–B loop is meant to loop
    savePrefs();
    storeSet(AB_STORE, JSON.stringify({ ...abRange, seq: $("seqSel").value }));
    renderAB();
    return;
  }
  $("startFrom").value = abActive() ? $("startFrom").value : i;
  playWhole(i);
}

// ---------- Whole melody: play, pause, resume, start anywhere ----------
let wholeRun = null;       // { from, opt, passes: [{ starts: [audio times per phrase] }] }
let wholePaused = null;    // phrase index to resume at

function phraseLabel(i) {
  const p = SEQ[i];
  return T("phrase.label", { name: p.shortId, bar: p.firstBarNum });
}

function playWhole(from = 0, resuming = false) {
  ensureAudio(); stopAll();
  const beat = 60 / +$("tempo").value;
  // The phrases, lines and syllables for a pass starting at phrase i
  // With an A–B loop: the first pass plays from where you started to the end
  // of B (or to the end of the song if you started after B), and every
  // repeat plays A to B. Without one: the first pass plays to the end, and
  // repeats start from the beginning of the song.
  const ab = abActive() ? { ...abRange } : null;
  const lastI = SEQ.length - 1;
  const segment = (i, j) => {
    const lines = [...document.querySelectorAll("#allNotes .all-line")].slice(i, j + 1);
    const part = SEQ.slice(i, j + 1);
    return { lines, chips: lines.flatMap(l => [...l.querySelectorAll(".n")]),
             part, items: part.flatMap(p => p.items) };
  };
  const opt = {
    beat, eighth: beat / METER.beatLen,
    doMidi: +$("doPitch").value,
    countIn: $("countIn").checked || resuming,   // always count in when resuming
    clickAll: $("clickAll").checked,
    loop: $("loop").checked
  };
  let t = ctx.currentTime + 0.12;
  if ($("doFirst").checked) { pluckAt(opt.doMidi, t, 1.0); t += 1.5; }
  setPlaying(true, "all");
  wholeRun = { from, opt, starts: [] };
  lastLineEl = null;
  handScrollUntil = 0;
  followTo(document.querySelector(`#allNotes .all-line[data-i="${from}"]`), true);
  // iPhone can still be coasting from your last swipe, which can cancel a
  // scroll, so set the position again a moment later.
  setTimeout(() => { if (wholeRun) followTo(document.querySelector(`#allNotes .all-line[data-i="${from}"]`), true); }, 250);
  showDock("playing", T("along.getReady"));
  $("pauseBtn").hidden = false; $("pauseBtn").textContent = T("along.pause");
  $("pauseBtn").parentElement.classList.add("two");
  showStatus(ab ? "" : from > 0 ? T("along.playingFrom", { phrase: phraseLabel(from) }) : "");

  // Each pass starts at phrase passFrom. The first pass starts wherever you
  // chose; when it loops, it goes back to the very beginning of the song.
  const pass = (start, passFrom, passTo) => {
    timers = timers.slice(-200);
    activeNodes = activeNodes.slice(-400);
    const { lines, chips, part, items } = segment(passFrom, passTo);
    opt.chips = chips;
    wholeRun.from = passFrom;
    const end = schedulePass({ items }, start, opt);
    // when each phrase starts, so Pause knows where you are
    let at = opt.noteStart;
    const starts = part.map((p, k) => {
      const here = at;
      at += p.items.filter(x => !x.bar).reduce((s, n) => s + n.dur, 0) * opt.eighth;
      // light the line while it plays. The first line lights from the very
      // start of the pass, so the page is already back at the top during the
      // count-in (and the silent lead-in measure when looping).
      const from = k === 0 ? Math.min(start, here) : here;
      // the last line stays lit through the rest of its final measure
      const to = k === part.length - 1 ? Math.max(at, end) : at;
      if (lines[k]) showAt(lines[k], from, to - from);
      return here;
    });
    wholeRun.starts = starts;
    if (opt.loop) {
      const nextFrom = ab ? ab.a : 0, nextTo = ab ? ab.b : lastI;
      looping = setTimeout(() => pass(end, nextFrom, nextTo), Math.max(0, (end - ctx.currentTime - 0.35) * 1000));
    } else {
      endTimer = setTimeout(() => { setPlaying(false); endWhole(); }, (end - ctx.currentTime) * 1000 + 600);
    }
  };
  // One extra "get ready" measure of metronome clicks before the first pass
  // only, so you have time to get your hands on the uke after tapping.
  // With the count-in on, that's two full measures of clicks before beat 1,
  // and a pickup note comes in at the end of the second. Loops don't repeat it.
  // With the count-in (or looping) on, the pass brings its own lead-in
  // measure. Without one, the pickup has to sit at the end of the "get ready"
  // measure, so that beat 1 lands right after it, on the clicks' grid.
  // If "Keep clicking" is on, the pass clicks the pickup's beats itself, so the
  // get-ready measure leaves those out rather than clicking them twice.
  const pickup = opt.countIn || opt.loop ? 0 : pickupEighths(SEQ[from].items);
  const pickupBeats = opt.clickAll ? Math.floor(pickup / METER.beatLen + 1e-9) : 0;
  for (let b = 0; b < BEATS_PER_BAR - pickupBeats; b++) clickAt(t + b * beat, b === 0, b);
  t += BEATS_PER_BAR * beat;
  pass(t - pickup * opt.eighth, from, ab && from <= ab.b ? ab.b : lastI);
}

// Which phrase is sounding right now
function currentPhrase() {
  if (!wholeRun || !ctx) return 0;
  const now = heardTime() - (+$("visDelay").value) / 1000;
  let k = 0;
  wholeRun.starts.forEach((st, j) => { if (st <= now) k = j; });
  return wholeRun.from + k;
}

function pauseWhole() {
  if (!wholeRun) return;
  const at = currentPhrase();
  stopAll();                      // clears wholeRun
  wholePaused = at;
  $("pauseBtn").hidden = false;
  $("pauseBtn").parentElement.classList.add("two");
  $("pauseBtn").textContent = T("along.resumeAtBar", { bar: firstBar(at) });
  $("pauseBtn").classList.add("resume");
  document.querySelectorAll("#allNotes .all-line").forEach((l, i) => l.classList.toggle("resume-here", i === at));
  showStatus(T("along.paused", { phrase: phraseLabel(at) }));
  showDock("paused", T("along.dockPaused", { bar: firstBar(at) }));
}

// ---------- Keep the playing line in view ----------
// When a new line starts, the page glides so that line sits about a third of
// the way down the screen, leaving the next lines visible for reading ahead.
// It moves only when the music reaches a new line, so it follows any tempo.
// If you scroll by hand, it waits a few seconds before following again.
let lastLineEl = null;
let handScrollUntil = 0;
// Only an actual drag or wheel counts as scrolling by hand. (A tap on a
// button, like Play whole melody, must not pause the following.)
// Scrolling only counts once the melody is playing, so scrolling down to
// reach the Play button doesn't hold anything back.
["touchmove", "wheel"].forEach(ev => window.addEventListener(ev, e => {
  if (!wholeRun) return;
  if (!e.target.closest(".dock")) handScrollUntil = performance.now() + 4000;
}, { passive: true }));
window.addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "].includes(e.key) && e.target === document.body)
    handScrollUntil = performance.now() + 4000;
});

function onLineChange(el) {
  const bar = el.querySelector(".bn");
  if (bar) $("dockWhere").textContent = T("along.dockBar", { bar: bar.textContent });
  followTo(el, false);
}

// instant = jump right away (used the moment you tap play); otherwise glide
function followTo(el, instant) {
  if (!el || !$("followLine").checked || !$("allDetails").open) return;
  if (!instant && performance.now() < handScrollUntil) return;
  // Every playing line sits in the same spot: near the top of the screen,
  // with just enough room above it for a "Verse 1" or "Chorus" heading, so
  // the lines ahead fill the rest of the screen. Only at the end of the song,
  // when the page can't scroll any further, do lines sit lower.
  const LINE_TOP = 56;
  const top = el.getBoundingClientRect().top + window.scrollY - LINE_TOP;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: Math.max(0, top), behavior: reduce || instant ? "auto" : "smooth" });
}

function showDock(mode, where) {
  $("dock").hidden = mode === "off";
  document.body.classList.toggle("docked", mode !== "off");
  $("dockPause").textContent = mode === "paused" ? T("along.resume") : T("along.pause");
  $("dockPause").classList.toggle("resume", mode === "paused");
  if (where) $("dockWhere").textContent = where;
}

function endWhole() {
  wholeRun = null; wholePaused = null;
  showDock("off");
  $("pauseBtn").hidden = true;
  $("pauseBtn").classList.remove("resume");
  $("pauseBtn").parentElement.classList.remove("two");
  document.querySelectorAll("#allNotes .resume-here").forEach(l => l.classList.remove("resume-here"));
  showStatus("");
}

function showStatus(text) {
  $("allStatus").textContent = text;
  $("allStatus").hidden = !text;
}

function playPhrase(phrase, slow) {
  ensureAudio(); stopAll();
  const bpm = +$("tempo").value * (slow ? 0.6 : 1);
  const beat = 60 / bpm;
  const opt = {
    beat, eighth: beat / METER.beatLen,
    doMidi: +$("doPitch").value,
    countIn: $("countIn").checked,
    clickAll: $("clickAll").checked,
    loop: $("loop").checked
  };
  let t = ctx.currentTime + 0.12;
  if ($("doFirst").checked) { pluckAt(opt.doMidi, t, 1.0); t += 1.5; }
  setPlaying(true);

  const pass = start => {
    // drop finished timers and audio nodes so a long loop stays light
    timers = timers.slice(-200);
    activeNodes = activeNodes.slice(-200);
    const end = schedulePass(phrase, start, opt);
    if (opt.loop) {
      // schedule the next pass a moment before this one ends
      const ms = (end - ctx.currentTime - 0.35) * 1000;
      looping = setTimeout(() => pass(end), Math.max(0, ms));
    } else {
      endTimer = setTimeout(() => setPlaying(false), (end - ctx.currentTime) * 1000 + 600);
    }
  };
  pass(t);
}

// Metronome only: clicks at the set tempo, beat 1 accented, until Stop.
// It schedules one measure at a time, so a tempo change takes effect at the
// next measure.
function playMetronome() {
  ensureAudio(); stopAll();
  setPlaying(true, "metro");
  let t = ctx.currentTime + 0.12;
  const measure = () => {
    const beat = 60 / +$("tempo").value;
    timers = timers.slice(-200); activeNodes = activeNodes.slice(-200);
    for (let b = 0; b < BEATS_PER_BAR; b++) clickAt(t + b * beat, b === 0, b);
    t += BEATS_PER_BAR * beat;
    looping = setTimeout(measure, Math.max(0, (t - ctx.currentTime - 0.35) * 1000));
  };
  measure();
}

// ---------- Sync calibration ----------
// The phone doesn't tell web pages how long the sound takes to reach your
// ears (speaker, wired or Bluetooth all differ). So we measure it: play slow,
// evenly spaced clicks, you tap when you hear each one, and the typical gap
// between "click scheduled" and "you tapped" becomes the highlight delay.
// Clicks are 1.5 s apart so even a long Bluetooth delay can't be mistaken
// for the next click.
let calibrating = false;
let calib = null;
const CAL_CLICKS = 10, CAL_GAP = 1.5;

function openCalib() {
  stopAll();
  $("calib").hidden = false; $("syncOpen").hidden = true;
  $("calibText").textContent = T("calib.intro");
  $("tapPad").textContent = T("calib.start"); $("calibCount").textContent = "";
  $("calibCancel").textContent = T("calib.cancel");
  calib = null;
}
function closeCalib() {
  calibrating = false; calib = null; stopAll();
  $("calib").hidden = true; $("syncOpen").hidden = false;
}
function startCalib() {
  ensureAudio(); stopAll();
  calibrating = true;
  const t0 = ctx.currentTime + 0.6;
  const clicks = [];
  for (let i = 0; i < CAL_CLICKS; i++) {
    const when = t0 + i * CAL_GAP;
    clickAt(when, true, 0);
    clicks.push(when);
  }
  calib = { clicks, taps: [] };
  setPlaying(true);
  $("tapPad").textContent = T("calib.tapEach");
  $("calibCount").textContent = T("calib.count", { n: 0, total: CAL_CLICKS });
  // keep the smoothed clock running so taps are measured accurately
  const keepAlive = () => { if (calibrating) { heardTime(); requestAnimationFrame(keepAlive); } };
  keepAlive();
  endTimer = setTimeout(finishCalib, (t0 - ctx.currentTime + CAL_CLICKS * CAL_GAP + 0.6) * 1000);
}
function calibTap() {
  if (!calib) { startCalib(); return; }
  const t = heardTime();
  calib.taps.push(t);
  $("calibCount").textContent = T("calib.count", { n: calib.taps.length, total: CAL_CLICKS });
  $("tapPad").classList.add("hit"); setTimeout(() => $("tapPad").classList.remove("hit"), 90);
}
function finishCalib() {
  if (!calib) return;
  const diffs = [];
  for (const tap of calib.taps) {
    // match each tap to the click it belongs to: up to 0.4 s early, 1.1 s late
    let best = null;
    for (const c of calib.clicks.slice(2)) {          // skip the first two while you settle in
      const d = tap - c;
      if (d > -0.4 && d < 1.1 && (best === null || Math.abs(d) < Math.abs(best))) best = d;
    }
    if (best !== null) diffs.push(best);
  }
  calibrating = false;
  setPlaying(false);
  if (diffs.length < 4) {
    calib = null;
    $("calibText").textContent = T("calib.tooFew");
    $("tapPad").textContent = T("calib.start"); $("calibCount").textContent = "";
    return;
  }
  diffs.sort((a, b) => a - b);
  const mid = diffs[Math.floor(diffs.length / 2)];
  const ms = Math.max(-300, Math.min(1000, Math.round(mid * 100) * 10));
  $("visDelay").value = ms;
  $("visDelayVal").textContent = T("units.ms", { n: ms });
  savePrefs();
  calib = null;
  $("calibText").textContent = T("calib.done", { ms });
  $("tapPad").textContent = T("calib.again"); $("calibCount").textContent = "";
  $("calibCancel").textContent = T("calib.close");
}

// ---------- Transpose ----------
const KEY_NAMES = ["C", "D♭", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
function noteName(m) { return KEY_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }

function renderPitch() {
  const t = +$("transpose").value, c = +$("fineTune").value;
  const n = Math.abs(t);
  $("tVal").textContent = t === 0 ? T("pitch.asWritten") : TN(n, t < 0 ? "pitch.down1" : "pitch.up1", t < 0 ? "pitch.downN" : "pitch.upN");
  const doM = SONG_DO_MIDI + t;
  const keyVars = { key: KEY_NAMES[((doM % 12) + 12) % 12], do: noteName(doM), interval: T(`pitch.interval${n}`) };
  $("keyNote").textContent = t === 0 ? T("pitch.keyAsWritten", keyVars)
    : T(t < 0 ? "pitch.keyDown" : "pitch.keyUp", keyVars) + (t === -5 ? " " + T("pitch.guitarHint") : "");
  document.querySelectorAll(".presets .chipbtn").forEach(b => b.classList.toggle("on", +b.dataset.t === t));
  const signed_c = `${c > 0 ? "+" : ""}${c}`;
  $("fineVal").textContent = T("pitch.cents", { c: signed_c });
  $("aNote").textContent = T(c === 0 ? "pitch.aStandard" : "pitch.aShifted", { hz: (440 * Math.pow(2, c / 1200)).toFixed(1) });
  // a reminder at the top whenever the pitch isn't as written
  const parts = [];
  if (t !== 0) parts.push(TN(n, t < 0 ? "pitch.transposedDown1" : "pitch.transposedUp1", t < 0 ? "pitch.transposedDownN" : "pitch.transposedUpN", { do: noteName(doM) }));
  if (c !== 0) parts.push(T("pitch.fine", { c: signed_c }));
  $("pitchNote").hidden = parts.length === 0;
  $("pitchNote").textContent = parts.join(T("pitch.listSep"));
}
function setTranspose(t) {
  $("transpose").value = Math.max(-12, Math.min(12, t));
  renderPitch(); savePrefs();
}

// ---------- Tuning notes ----------
// Open-string notes as MIDI numbers, low string first, as you'd tune them.
// Each instrument: a menu name, an optional note, and its open strings as
// [string name, MIDI note], in the usual tuning order (low string first,
// except ukulele-style re-entrant tunings, listed G C E A as players say it).
// The menu name and any note for each instrument are in STRINGS
// (tuning.name_<id>, tuning.note_<id>).
const TUNING_LIST = [
  ["uke",        [["G", 67], ["C", 60], ["E", 64], ["A", 69]]],
  ["lowg",       [["G", 55], ["C", 60], ["E", 64], ["A", 69]]],
  ["baritone",   [["D", 50], ["G", 55], ["B", 59], ["E", 64]]],
  ["guitalele",  [["A", 45], ["D", 50], ["G", 55], ["C", 60], ["E", 64], ["A", 69]]],
  ["guitaleleE", [["E", 40], ["A", 45], ["D", 50], ["G", 55], ["B", 59], ["E", 64]]],
  ["guitar",     [["E", 40], ["A", 45], ["D", 50], ["G", 55], ["B", 59], ["E", 64]]],
  ["violin",     [["G", 55], ["D", 62], ["A", 69], ["E", 76]]],
  ["mandolin",   [["G", 55], ["D", 62], ["A", 69], ["E", 76]]],
  ["viola",      [["C", 48], ["G", 55], ["D", 62], ["A", 69]]],
  ["cello",      [["C", 36], ["G", 43], ["D", 50], ["A", 57]]],
  ["dulcimer",   [["D", 50], ["A", 57], ["d", 62]]],
  ["tenorbanjo", [["C", 48], ["G", 55], ["D", 62], ["A", 69]]],
  ["irishbanjo", [["G", 43], ["D", 50], ["A", 57], ["E", 64]]],
  ["winds",      [["A", 69], ["B♭", 70]]]
];
const TUNINGS = Object.fromEntries(TUNING_LIST);
const tuningNote = id => STRINGS.tuning["note_" + id] || "";
let tuneMidi = null;
const refHz = () => +$("tuneRef").value;
const tuneFreq = m => refHz() * Math.pow(2, (m - 69) / 12);   // ignores Transpose and Fine tune

// A clean tone at exactly the right frequency: a fundamental plus a few
// gentle overtones, which makes it easier to hear against a string.
let toneWave = null;
// Low notes need help: our ears hear low pitches as much quieter, and phone
// speakers, earbuds and hearing aids play them weakly. So lower notes get
//  1. more overtones, which small speakers can play (the ear fills in the
//     low pitch from them), and
//  2. a volume boost, growing gradually toward the lowest notes.
// The pitch stays exact; only the tone color and loudness change.
const BASE_PARTIALS = [0, 1, 0.35, 0.18, 0.09, 0.05, 0, 0, 0, 0];
const RICH_PARTIALS = [0, 1, 0.85, 0.7, 0.55, 0.42, 0.32, 0.24, 0.17, 0.12];
const waveCache = new Map();
function toneWaveFor(freq) {
  // richness: 0 at 300 Hz and above, rising to 1 at about 100 Hz and below
  const key = Math.round(Math.max(0, Math.min(1, (300 - freq) / 200)) * 20);
  const hit = waveCache.get(key);
  if (!hit || hit.ctx !== ctx) {
    const r = key / 20;
    const real = new Float32Array(BASE_PARTIALS.map((b0, i) => b0 * (1 - r) + RICH_PARTIALS[i] * r));
    waveCache.set(key, { ctx, wave: ctx.createPeriodicWave(real, new Float32Array(real.length)) });
  }
  return waveCache.get(key).wave;
}
// Louder for lower notes: about 1.5x at 110 Hz (low A), 1.9x at 65 Hz (cello C)
const lowBoost = freq => Math.max(1, Math.min(2.2, Math.pow(330 / freq, 0.45)));
const tuneVolume = () => +(document.getElementById("tuneVol") || { value: 80 }).value / 100;

function toneAt(freq, when, steady, gap = 1) {
  const osc = ctx.createOscillator();
  osc.setPeriodicWave(toneWaveFor(freq));
  osc.frequency.value = freq;
  const g = ctx.createGain();
  const level = lowBoost(freq) * tuneVolume() / 0.8;   // 80% on the slider = the original loudness
  const steadyPeak = 0.22 * level, pluckPeak = 0.32 * level;
  g.gain.setValueAtTime(0.0001, when);
  if (steady) {
    g.gain.exponentialRampToValueAtTime(steadyPeak, when + 0.08);      // soft start, then hold
  } else {
    // plucked: quick attack, then a natural ring that fades gradually,
    // still clearly sounding when the next pluck arrives
    g.gain.exponentialRampToValueAtTime(pluckPeak, when + 0.006);
    g.gain.setTargetAtTime(0.0001, when + 0.02, gap * 0.55);
    // a short fade right at the end, so there's no click
    g.gain.setValueAtTime(pluckPeak * Math.exp(-(gap - 0.06) / (gap * 0.55)), when + gap - 0.04);
    g.gain.linearRampToValueAtTime(0.0001, when + gap + 0.02);
  }
  osc.connect(g).connect(ctx.destination);
  osc.start(when);
  if (!steady) osc.stop(when + gap + 0.05);
  activeNodes.push(osc);
}

function playTuning(midi) {
  ensureAudio(); stopAll();
  tuneMidi = midi;
  setPlaying(true, "tune");
  const f = tuneFreq(midi);
  let t = ctx.currentTime + 0.05;
  const sound = $("tuneSound").value;
  if (sound === "steady") { toneAt(f, t, true); return; }
  const gap = sound === "pluck2" ? 2 : 1;
  const tick = () => {
    activeNodes = activeNodes.slice(-20);
    toneAt(f, t, false, gap);
    t += gap;
    looping = setTimeout(tick, Math.max(0, (t - ctx.currentTime - 0.3) * 1000));
  };
  tick();
}

function noteLabel(m) { return ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"][m % 12] + (Math.floor(m / 12) - 1); }
function renderTuning() {
  const inst = $("tuneInst").value, sound = $("tuneSound").value;
  if (!TUNINGS[inst]) { $("tuneInst").value = "uke"; return renderTuning(); }
  $("tuneInstSel").value = inst;
  $("tuneInstNote").textContent = tuningNote(inst);
  $("tuneInstNote").hidden = !tuningNote(inst);
  document.querySelectorAll(".tsound").forEach(b => b.classList.toggle("on", b.dataset.sound === sound));
  $("tStrings").innerHTML = TUNINGS[inst].map(([name, m]) =>
    `<button class="tstr${playing && tuneMidi === m && $("tStrings").dataset.inst === inst ? " on" : ""}" data-midi="${m}" aria-label="${T("tuning.stringAria", { name, note: noteLabel(m), hz: tuneFreq(m).toFixed(2) })}">
       <b>${name}</b><small>${noteLabel(m)}</small><small>${T("tuning.hz", { hz: tuneFreq(m).toFixed(1) })}</small></button>`).join("");
  $("tStrings").dataset.inst = inst;
  const r = refHz();
  $("refVal").textContent = T("tuning.refVal", { hz: r });
  $("refNote").textContent = r === 440 ? T("tuning.refStandard")
    : T(r < 440 ? "tuning.refLower" : "tuning.refHigher", { cents: Math.abs(Math.round(1200 * Math.log2(r / 440))) });
}
function setRef(hz) {
  $("tuneRef").value = Math.max(415, Math.min(466, hz));
  savePrefs(); renderTuning();
  if (playing && tuneMidi !== null && document.querySelector(".tstr.on")) playTuning(tuneMidi);
}

function playDo() {
  ensureAudio(); stopAll();
  pluckAt(+$("doPitch").value, ctx.currentTime + 0.05, 1.4);
}

// ---------- Quiz state ----------
const STORE = songKey("phrase-parrot-v1");
let order = [], pos = -1;

// Chorus setting: "mixed" shuffles verse and chorus phrases together;
// "after" shuffles the verse phrases, then the chorus phrases; "skip"
// leaves the chorus out of the round.
const chorusMode = () => ($("chorusMode") && $("chorusMode").value) || "mixed";
function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffle() {
  const all = PHRASES.map((_, i) => i);
  const verse = all.filter(i => PHRASES[i].kind === "verse");
  const chorus = all.filter(i => PHRASES[i].kind === "chorus");
  const mode = chorusMode();
  order = mode === "after" ? [...shuffled(verse), ...shuffled(chorus)]
        : mode === "skip" ? shuffled(verse)
        : shuffled(all);
  pos = -1;
}
function save() {
  storeSet(STORE + "-" + drillVerse, JSON.stringify({ order, pos, mode: chorusMode() }));
}
function load() {
  const s = storeGetJSON(STORE + "-" + drillVerse);
  // only resume a round shuffled with today's chorus setting
  if (s && Array.isArray(s.order) && s.mode === chorusMode() && s.order.length && s.order.every(i => i >= 0 && i < PHRASES.length)) {
    order = s.order; pos = s.pos; return true;
  }
  return false;
}

function renderProgress() {
  const n = order.length;
  $("progress").classList.toggle("many", n > 16);
  // played pips show verse (teal) and chorus (darker gold), so you can see the mix;
  // upcoming ones stay plain so they don't give away what's next
  $("progress").innerHTML = order.map((ix, i) =>
    `<span class="pip ${i < pos && PHRASES[ix] && PHRASES[ix].kind === "chorus" ? "ch" : ""} ${i < pos ? "done" : i === pos ? "now" : ""}"></span>`).join("");
  if (pos < 0) $("count").textContent = T("drill.countNone", { n });
  else $("count").textContent = T("drill.countNow", { k: pos + 1, n });
  $("nextBtn").textContent = pos >= n - 1 ? T("drill.startNewRound") : T("ui.newPhrase");
}

// Apple Notes (and some other apps) mark line breaks with special characters
// (Unicode "line separator" U+2028 or "paragraph separator" U+2029, or an old
// Mac carriage return) instead of a normal newline. A text box shows those as
// nothing, so pasted lines look run together. This turns them all into normal
// newlines. If a normal newline was also typed right next to one, the pair
// counts as a single line break, so lines don't end up double-spaced.
function normalizeBreaks(text) {
  return String(text)
    .replace(/\r\n/g, "\n")
    .replace(/[\u2028\u2029\u0085\r][ \t]*\n|\n[ \t]*[\u2028\u2029\u0085\r]/g, "\n")
    .replace(/[\u2028\u2029\u0085\r]/g, "\n");
}

function loadMyText() {
  const t = storeGet(LYRICS_STORE) || "";
  const clean = normalizeBreaks(t);
  // tidy lyrics saved by an earlier version
  if (clean !== t) storeSet(LYRICS_STORE, clean);
  return clean;
}

// Section headings written into lyric files. These are part of the file
// format (Import looks for them), so they are not translated.
const FILE_LABELS = { verse: n => `Verse ${n}`, chorus: "Chorus", chorusN: n => `Chorus ${n}` };

// Turn typed text into verses and choruses.
// Blocks are separated by a blank line. A block may start with a heading
// like "Verse 2" or "Chorus"; without one, it's counted as the next verse.
// A 4-line chorus is used twice, since the chorus melody repeats.
function parseMyLyrics(text) {
  const blocks = text.replace(/\r/g, "").split(/\n\s*\n/).map(b => b.split("\n").map(l => l.trim()).filter(Boolean)).filter(b => b.length);
  const verses = [], choruses = [], problems = [];
  for (const b of blocks) {
    let label = null, lines = b;
    if (/^(verse|couplet|chorus|refrain)\b[^a-z]*\d*\s*:?\s*$/i.test(b[0])) { label = b[0].replace(/:$/, ""); lines = b.slice(1); }
    const isChorus = label && /^(chorus|refrain)/i.test(label);
    if (isChorus) {
      if (CHORUS_PHRASES % 2 === 0 && lines.length === CHORUS_PHRASES / 2) lines = lines.concat(lines);
      if (lines.length !== CHORUS_PHRASES) problems.push(T(CHORUS_PHRASES % 2 === 0 ? "lyrics.problemChorus" : "lyrics.problemChorusOdd",
        { label, lines: TN(lines.length, "lyrics.lines1", "lyrics.linesN"), need: CHORUS_PHRASES, half: CHORUS_PHRASES / 2 }));
      choruses.push({ label, lines });
    } else {
      label = label || FILE_LABELS.verse(verses.length + 1);
      if (lines.length !== VERSE_PHRASES) problems.push(T("lyrics.problemVerse", { label, lines: TN(lines.length, "lyrics.lines1", "lyrics.linesN"), need: VERSE_PHRASES }));
      verses.push({ label, lines });
    }
  }
  return { name: T("lyrics.mySetName"), verses, choruses, problems };
}

// This song's built-in lyric sets (public-domain texts), plus "My lyrics"
const builtInSets = () => SONG.lyrics || {};
function lyricSets() {
  const choice = $("lyricSet").value;
  const mine = parseMyLyrics(loadMyText());
  const all = { ...builtInSets(), mine };
  if (choice === "all") return Object.values(all).filter(s => s.verses.length || s.choruses.length);
  return [all[choice] || mine].filter(Boolean);
}
(function fillLyricChoices() {

const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// The lyric lines for one phrase (0–7 are verse phrases, 8–15 chorus)
// For a verse phrase, the line for the verse you're hearing comes first and
// is highlighted (French couplets 1, 2 and 6 stand in for verses 1, 2, 3).
function lyricsHTML(p) {
  const sets = lyricSets();
  const chorus = p.kind === "chorus";
  const k = p.k;
  const showMeaning = $("showMeaning").checked;
  const many = sets.length > 1;
  let html = "";
  for (const set of sets) {
    let groups = chorus ? set.choruses : set.verses;
    if (!groups.length) continue;
    const cur = chorus ? -1 : p.verse - 1;
    if (cur > 0 && cur < groups.length) groups = [groups[cur], ...groups.filter((_, gi) => gi !== cur)];
    const curGroup = cur >= 0 && cur < (chorus ? set.choruses : set.verses).length ? (chorus ? set.choruses : set.verses)[cur] : null;
    // Choruses that are identical only need showing once
    const seen = new Set();
    let rows = "";
    for (const g of groups) {
      const line = g.lines[k];
      if (chorus && seen.has(line)) continue;
      seen.add(line);
      const meaning = showMeaning && g.meaning ? `<span class="ly-mean">${esc(g.meaning[k] || "")}</span>` : "";
      rows += `<div class="ly-row${g === curGroup && !chorus ? " ly-current" : ""}"><span class="ly-label">${esc(g.label)}</span><span class="ly-text">${line ? esc(line) : `<em>${T("lyrics.noLine")}</em>`}${meaning}</span></div>`;
    }
    html += `<div class="ly-set">${many ? `<p class="ly-set-name">${esc(set.name)}</p>` : ""}${rows}</div>`;
  }
  if (!html) {
    html = `<p class="ly-empty">${T("lyrics.empty")}</p>`;
  }
  return html;
}

// Export as a real plain-text file. On phones, the share sheet is the
// reliable way: "Save to Files" there writes a true .txt file. (A plain
// download link makes iPhone Safari open the text as a web page instead.)
// Elsewhere, fall back to a download that browsers save rather than open.
// ---------- Save lyrics to a file ----------
// The file always uses the same tidy layout, which Import reads back:
//   Verse 1            <- a label line
//   words for phrase 1 <- one line per phrase, single-spaced
//   ...
//                      <- one blank line between verses and the chorus
//   Chorus
//   ...
function lyricsFileText() {
  const parsed = parseMyLyrics(normalizeBreaks($("myLyrics").value || loadMyText()));
  const blocks = [];
  parsed.verses.forEach((v, i) => blocks.push([v.label || FILE_LABELS.verse(i + 1), ...v.lines]));
  parsed.choruses.forEach((c, i) => {
    // a chorus whose two halves match is saved as its 4 lines
    const L = c.lines;
    const halvesMatch = L.length === 8 && L.slice(0, 4).every((x, j) => x === L[4 + j]);
    blocks.push([c.label || (parsed.choruses.length > 1 ? FILE_LABELS.chorusN(i + 1) : FILE_LABELS.chorus), ...(halvesMatch ? L.slice(0, 4) : L)]);
  });
  return blocks.map(b => b.join("\n")).join("\n\n") + "\n";
}

const defaultFileName = () => SONG.fileName || T("lyrics.defaultFile", { song: SONG_ID });
function fileName() {
  let n = ($("myFileName").value || "").trim() || defaultFileName();
  n = n.replace(/[\\/:*?"<>|]+/g, "-");
  if (!/\.txt$/i.test(n)) n += ".txt";
  return n;
}

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

async function exportMyLyrics() {
  const text = lyricsFileText();
  const name = fileName();
  const say = t => { $("myStatus").textContent = t; };

  // 1. Computers with Chrome or Edge (Windows, Chromebook, Mac):
  //    the real Save dialog, starting in Downloads, with the name filled in.
  if (window.showSaveFilePicker && !isIOS) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name, startIn: "downloads",
        types: [{ description: T("lyrics.fileType"), accept: { "text/plain": [".txt"] } }]
      });
      const w = await handle.createWritable();
      await w.write(text); await w.close();
      say(T("lyrics.savedAs", { name: handle.name }));
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;      // you pressed Cancel
      reportError(T("err.saveFile", { how: "showSaveFilePicker", msg: e.message }));
    }
  }

  // 2. Phones and tablets: the share sheet. On iPhone choose Save to Files
  //    (pick a folder there); on Android choose Files, Drive, or similar.
  try {
    const file = new File([text], name, { type: "text/plain" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      say(isIOS ? T("lyrics.iosShared") : T("lyrics.shared"));
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;        // you closed the share sheet
    reportError(T("err.saveFile", { how: "share", msg: e.message }));
  }

  // 3. An iPhone viewer that can't save files (such as a preview inside
  //    another app): don't hand the file to Safari. Offer Copy instead.
  if (isIOS) {
    say(T("lyrics.iosNoSave"));
    return;
  }

  // 4. Everywhere else: an ordinary download to the Downloads folder,
  //    using the name in the box above.
  const blob = new Blob([text], { type: "application/octet-stream" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = name;
  document.body.appendChild(link); link.click();
  setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 1000);
  say(T("lyrics.downloaded", { name }));
}

    return;

}

function importMyLyrics(file) {
  const r = new FileReader();
  r.onload = () => { $("myLyrics").value = normalizeBreaks(r.result); saveMyLyrics(); };
  r.onerror = () => reportError(T("err.fileRead", { name: file.name, msg: (r.error && r.error.message) || "unknown" }));
  r.readAsText(file);
}

}
