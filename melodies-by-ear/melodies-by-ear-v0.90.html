    const cls = "wq-choice" + (n.base === "do" ? " do" : "") + (warmWrong.has(n.syl) ? " wrong" : "") + (warmSolved && n.syl === cur.syl ? " right" : "");
    return `<button class="${cls}" data-syl="${esc(n.syl)}" aria-label="${esc(n.syl)}">${noteFace(n)}</button>`;
  }).join("");
  ans.hidden = false;
  if (warmSolved) ans.innerHTML = warmAnswerHTML("warm.right", cur, doM);
  else if (warmWrong.size) { const w = [...warmWrong].pop(); ans.innerHTML = esc(T("warm.wrong", { syl: "\u0000" })).replace("\u0000", warmName(w)); }

}
function warmCheck() {
  const cur = warmDeck[0];
  if (!cur) return;

// Hear it, name it: do (unless turned off), then the note
function warmPlay() {
  const cur = warmDeck[0];

  ensureAudio(); stopAll();
  let t = ctx.currentTime + 0.05;
  if ($("warmDoFirst").checked) { pluckAt(SONG_DO_MIDI, t, 0.9); t += 1.2; }
  pluckAt(SONG_DO_MIDI + cur.step, t, 1.2);

  const cur = warmDeck[0];

  if (!warmSolved) return;
  warmScore(warmWrong.size === 0);

}
function hooksHTML() {
  return para("hooks.intro") + `<table class="hooks">` + ["do", "re", "mi", "fa", "so", "la", "ti"].map(syl =>
    `<tr><td class="hk-shape">${shapeSVG(SHAPE_OF[syl][0])}</td><td class="hk-syl">${syl}</td><td>${esc(T("hooks." + syl))}</td></tr>`).join("")

// ---------- Syllable chips with rhythm marks ----------
// Durations are in eighth notes, so a 16th is 0.5. Every 16th gets a double
// underline (like the two beams on a written 16th). If the note just before
// a 16th is dotted (a dotted 16th, eighth, quarter or half), it gets a dot
// after its name, as in sheet music. Works for any song's data.
const SIXTEENTH = 0.5;

    if (!tripLeft && isTrip(it) && isTrip(items[ii + 1]) && isTrip(items[ii + 2])) { html += `<span class="trip">`; tripLeft = 3; }
    const nextNote = notes[k + 1];
    const is16 = near(it.dur, SIXTEENTH);
    const dotted = DOTTED.some(d => near(it.dur, d)) && nextNote && near(nextNote.dur, SIXTEENTH);
    const cls = ["n", it.pk ? "pk" : "", sylBase(it.syl) === "do" ? "do" : "", is16 ? "s16" : "", dotted ? "dotted" : "", it.tie ? "tied" : ""].join(" ");
    const label = it.tie ? T("chips.tied") : is16 ? T("chips.sixteenth") : dotted ? T("chips.dotted") : "";
    const bare = `<span class="${cls}"${label ? ` title="${label}"` : ""}>${chipInner(it.syl)}</span>`;
    const chip = it.ch ? `<span class="chw">${chordSpan(it.ch)}${bare}</span>` : bare;
    // a "/" for each chord that comes while this note is held; kept on the same line as the note
    html += it.chAfter ? `<span class="ngrp">${chip}${it.chAfter.map(tok => `<span class="chs" aria-hidden="true">${chordSpan(tok)}/</span>`).join("")}</span>` : chip;
    if (tripLeft && --tripLeft === 0) html += `</span>`;
    k++;
  }
  return html;
}

function renderWhole() {
  let html = "";
  SEQ.forEach((p, i) => {
    if (i === 0 || SEQ[i - 1].section !== p.section) html += `<p class="all-section">${p.section}</p>`;
    const bar = barNums(p)[0];
    html += `<div class="all-line" data-i="${i}"><button class="bn" data-start="${i}" aria-label="${T("seq.startFromBarAria", { bar })}">${bar}</button>`;
    html += chipsHTML(p.items);
    html += `<div class="al-lyric" hidden><span class="al-text"></span><span class="al-mean" hidden></span></div>`;
    html += `</div>`;
  });
  $("allNotes").innerHTML = html;
  renderAlongLyrics();
}

// The lyric line (and, for another language, its plain English meaning) for
// one Play along phrase, from the lyrics chosen under "Lyrics to show". With
// ---------- Lyric syllables ----------
// A line with syllable marks, as in MuseScore: "-" between syllables of a
// word, "_" holds the syllable before it over one more note, "\-" is a real
// hyphen that stays visible (and also starts a new syllable). LilyPond's
// " -- " works too. Each "_" is one more note. Returns the syllables in order, each with
// how many notes it takes, or null if the line has nothing to read.
function parseSyl(marked) {
  if (!marked) return null;
  const text = marked.replace(/\s+--\s+/g, "-").trim();
  const syls = [];
  for (const word of text.split(/\s+/)) {
    if (/^_+$/.test(word)) {                       // "_" on its own: hold the last syllable
      if (syls.length) syls[syls.length - 1].notes += word.length;
      continue;
    }
    // "\-" and "-" both split; "\-" keeps its hyphen on show
    const parts = word.split(/(\\-|-)/);
    for (let i = 0; i < parts.length; i += 2) {
      let piece = parts[i];
      const sep = parts[i + 1];
      let held = 0;
      const m = /_+(?=[.,;:!?"'”’)]*$)/.exec(piece);
      if (m) { held = m[0].length; piece = piece.slice(0, m.index) + piece.slice(m.index + held); }
      if (piece) syls.push({ t: piece, notes: 1 + held, hy: false, end: false });
      else if (held && syls.length) syls[syls.length - 1].notes += held;
      if (sep === "\\-" && syls.length) syls[syls.length - 1].hy = true;
    }
    if (syls.length) syls[syls.length - 1].end = true;
  }
  return syls.length ? syls : null;
}
// The line as it reads, marks removed (whole words; real hyphens kept)
const sylPlain = syls => syls.map(x => x.t + (x.hy ? "-" : "") + (x.end ? " " : "")).join("").trim();
const sylNotes = syls => syls.reduce((n, x) => n + x.notes, 0);
// Which notes start on a bar's first beat (for bold syllables)
function downbeats(items) {
  const pick = pickupEighths(items), out = [];
  let t = 0;
  for (const n of items.filter(x => !x.bar)) {
    const into = t - pick;
    out.push(!n.pk && into > -1e-6 && Math.abs(into / METER.perBar - Math.round(into / METER.perBar)) < 1e-6);
    t += n.dur;
  }
  return out;
}
// A line's words as syllable spans, linked to the chips of its notes so each
// lights with its note. Returns false (and leaves the line alone) if the
// syllables don't fit the notes.
function fillSyllables(textEl, chips, marked, items) {
  const syls = parseSyl(marked);
  const notes = items.filter(x => !x.bar);
  if (!syls || sylNotes(syls) !== notes.length || chips.length !== notes.length) return false;
  const db = downbeats(items);
  let html = "", j = 0;
  syls.forEach((x, k) => {
    const first = notes[j];
    const cls = "syl" + (db[j] ? " db" : "") + (first.pk ? " pkl" : "");
    const hold = x.notes > 1 ? `<span class="hold" aria-hidden="true">${Array.from({ length: x.notes - 1 }, (_, r) => `<span class="hseg" data-g="hold${r + 1}"></span>`).join("")}</span>` : "";
    html += `<span class="${cls}" data-k="${k}">${esc(x.t)}</span>${hold}${x.hy ? "-" : ""}${x.end ? " " : ""}`;
    j += x.notes;
  });
  textEl.innerHTML = html.trim();
  const spans = textEl.querySelectorAll(".syl");
  j = 0;
  syls.forEach((x, k) => {
    const segs = spans[k].nextElementSibling && spans[k].nextElementSibling.classList.contains("hold")
      ? spans[k].nextElementSibling.querySelectorAll(".hseg") : [];
    for (let r = 0; r < x.notes; r++) { chips[j]._syl = spans[k]; chips[j]._hold = r ? segs[r - 1] || null : null; j++; }
  });
  return true;
}
// Startup check of the built-in syllable marks: one syllable per note, and
// the marked line reads the same as the plain one.
function validateSyllables() {
  const say = msg => reportError(T("err.song", { song: SONG.title, msg }));
  for (const set of Object.values(SONG.lyrics || {})) {
    const check = (group, phrases) => {
      if (!group.syl) return;
      group.syl.forEach((marked, k) => {
        const syls = parseSyl(marked), p = phrases[k];
        const vars = { set: set.name, label: group.label, line: k + 1 };
        if (!syls || !p) return;
        const notes = p.items.filter(x => !x.bar).length;
        if (sylNotes(syls) !== notes) say(T("err.sylCount", { ...vars, syl: sylNotes(syls), notes }));
        if (sylPlain(syls) !== (group.lines[k] || "")) say(T("err.sylText", { ...vars, marked, plain: group.lines[k] || "" }));
      });
    };
    (set.verses || []).forEach((g, i) => { if (VERSE_M[i + 1]) check(g, withItems(verseOf(i + 1))); });
    (set.choruses || []).forEach(g => check(g, withItems(chorusAfter(1))));
  }
}

// "All of them" the first set is used, since several would crowd the line.
// A verse phrase uses that verse's words; a chorus uses the chorus that goes
// with that verse if there is one, otherwise the first chorus.
function alongLyricFor(set, p) {
  if (!set) return null;
  const groups = p.kind === "verse" ? set.verses : set.choruses;
  const group = groups[p.verse - 1] || (p.kind === "chorus" ? groups[0] : null);
  if (!group || !group.lines[p.k]) return null;
  return { text: group.lines[p.k], meaning: group.meaning ? group.meaning[p.k] : "", syl: group.syl ? group.syl[p.k] : "" };
}
// Fills in the lyrics under every Play along line, in place (the lines
// themselves stay, so highlighting keeps working if this runs while playing).
function renderAlongLyrics() {
  const show = $("alongLyrics").checked && !SONG.instrumental;
  const set = show ? lyricSets()[0] : null;
  const withMeaning = $("showMeaning").checked;
  const lines = [...$("allNotes").querySelectorAll(".all-line")];
  if (lines.length !== SEQ.length) reportError(T("err.alongLines", { lines: lines.length, phrases: SEQ.length }));
  lines.forEach((line, i) => {
    const box = line.querySelector(".al-lyric");
    const lyric = show ? alongLyricFor(set, SEQ[i]) : null;
    box.hidden = !lyric;
    if (!lyric) return;
    const textEl = box.querySelector(".al-text");
    const chips = [...line.querySelectorAll(".n")];
    chips.forEach(c => { c._syl = null; c._hold = null; });
    // with syllable marks, each syllable lights with its note; otherwise the plain line
    if (!(lyric.syl && fillSyllables(textEl, chips, lyric.syl, SEQ[i].items))) textEl.textContent = lyric.text;
    const mean = box.querySelector(".al-mean");
    mean.textContent = lyric.meaning || "";
    mean.hidden = !(withMeaning && lyric.meaning);
  });
  // lyrics only applies while lyrics are shown, so the list is never empty
  $("allNotes").classList.toggle("lyrics-only", show && $("lyricsOnly").checked);
}
// Whenever the lyrics or how they're shown change, both places update.
function onLyricsChanged() {
  renderLyricBox();
  renderAlongLyrics();
}

// ---------- A–B loop ----------
// Turn on the switch, tap the bar number of the first line to repeat (A),
// then the bar number of the last line (B). The loop runs from the start of
// A's phrase to the end of B's phrase, then counts in and repeats.
let abRange = null;        // { a, b } phrase indexes, or null
let abPick = null;         // "a" or "b" while you're choosing
let abFirst = null;        // the A you've tapped, while choosing B
const AB_STORE = songKey("phrase-parrot-ab-v1");
const barNums = p => p.nBars > 1 ? [String(p.firstBarNum), String(p.lastBarNum)] : [String(p.firstBarNum)];
const firstBar = i => barNums(SEQ[i])[0];
const lastBar = i => barNums(SEQ[i])[1] || firstBar(i);
const abActive = () => !!abRange && $("loop").checked;

function playLabel() {
  if (abActive()) return T("seq.playAB", { a: firstBar(abRange.a), b: lastBar(abRange.b) });
  const sf = document.getElementById("startFrom");
  const i = sf ? +sf.value : 0;
  const sv = $("seqSel").value;
  const what = SEQ_CHOICES[sv] ? SEQ_CHOICES[sv].play : T("seq.playGeneric");
  return i === 0 ? what : T("seq.playFromBar", { bar: firstBar(i) });
}

function renderAB() {
  const lines = [...document.querySelectorAll("#allNotes .all-line")];
  lines.forEach((l, i) => {
    l.classList.toggle("in-ab", !!abRange && i >= abRange.a && i <= abRange.b);
    l.classList.toggle("ab-last", !!abRange && i === abRange.b);
    l.classList.toggle("ab-pending", abPick === "b" && i === abFirst);
  });
  $("allNotes").classList.toggle("picking", !!abPick);
  $("abOn").checked = !!abRange || !!abPick;
  $("abClear").hidden = !abRange;
  $("startFrom").disabled = abActive();
  const msg = $("abMsg");
  if (abPick === "a") {
    msg.innerHTML = T("along.abPickA");
  } else if (abPick === "b") {
    msg.innerHTML = T("along.abPickB", { bar: firstBar(abFirst) });
  } else if (abRange) {
    const range = T("seq.span", { a: firstBar(abRange.a), b: lastBar(abRange.b) });
    msg.innerHTML = $("loop").checked
      ? T("along.abLooping", { range, from: esc(SEQ[abRange.a].shortId), to: esc(SEQ[abRange.b].shortId) })
      : T("along.abInactive", { range });
  }
  msg.hidden = !abPick && !abRange;
  $("barTip").textContent = abPick ? T("along.barTipPicking") : T("along.barTip");
  updateAllLabel();
}

function startPickingAB() {
  if (wholeRun || wholePaused !== null) stopAll();
  abPick = "a"; abFirst = null; abRange = null;
  $("allDetails").open = true;
  renderAB();
  // bring the list into view so you can tap a line
  requestAnimationFrame(() => {
    const first = document.querySelector("#allNotes .all-section");
    if (first) window.scrollTo({ top: first.getBoundingClientRect().top + window.scrollY - 80, behavior: "smooth" });
  });
}
function clearAB() {
  abRange = null; abPick = null; abFirst = null;
  storeRemove(AB_STORE);
  renderAB();
}
function onBarTap(i) {
  if (abPick === "a") { abFirst = i; abPick = "b"; renderAB(); return; }
  if (abPick === "b") {
    abRange = { a: Math.min(abFirst, i), b: Math.max(abFirst, i) };
    abPick = null; abFirst = null;
    $("loop").checked = true;              // an A–B loop is meant to loop
    savePrefs();
    storeSet(AB_STORE, JSON.stringify({ ...abRange, seq: $("seqSel").value }));
    renderAB();
    return;
  }
  $("startFrom").value = abActive() ? $("startFrom").value : i;
  playWhole(i);
}

// ---------- Whole melody: play, pause, resume, start anywhere ----------
let wholeRun = null;       // { from, opt, passes: [{ starts: [audio times per phrase] }] }
let wholePaused = null;    // phrase index to resume at

function phraseLabel(i) {
  const p = SEQ[i];
  return T("phrase.label", { name: p.shortId, bar: p.firstBarNum });
}

function playWhole(from = 0, resuming = false) {
  ensureAudio(); stopAll();
  const beat = 60 / +$("tempo").value;
  // The phrases, lines and syllables for a pass starting at phrase i
  // With an A–B loop: the first pass plays from where you started to the end
  // of B (or to the end of the song if you started after B), and every
  // repeat plays A to B. Without one: the first pass plays to the end, and
  // repeats start from the beginning of the song.
  const ab = abActive() ? { ...abRange } : null;
  const lastI = SEQ.length - 1;
  const segment = (i, j) => {
    const lines = [...document.querySelectorAll("#allNotes .all-line")].slice(i, j + 1);
    const part = SEQ.slice(i, j + 1);
    return { lines, chips: lines.flatMap(l => [...l.querySelectorAll(".n")]),
             part, items: part.flatMap(p => p.items) };
  };
  const opt = {
    beat, eighth: beat / METER.beatLen,
    doMidi: +$("doPitch").value,
    countIn: $("countIn").checked || resuming,   // always count in when resuming
    countBars: countBars(),
    // with the melody off, the metronome keeps time through the whole song
    silent: !$("alongMelody").checked,
    leadDots: true,
    clickAll: $("clickAll").checked || !$("alongMelody").checked,
    loop: $("loop").checked
  };
  let t = ctx.currentTime + 0.12;
  if ($("doFirst").checked) { pluckAt(opt.doMidi, t, 1.0); t += 1.5; }
  setPlaying(true, "all");
  wholeRun = { from, opt, starts: [] };
  lastLineEl = null;
  handScrollUntil = 0;
  followTo(document.querySelector(`#allNotes .all-line[data-i="${from}"]`), true);
  // iPhone can still be coasting from your last swipe, which can cancel a
  // scroll, so set the position again a moment later.
  setTimeout(() => { if (wholeRun) followTo(document.querySelector(`#allNotes .all-line[data-i="${from}"]`), true); }, 250);
  showDock("playing", T("along.getReady"));
  $("alongBeats").hidden = false;
  $("pauseBtn").hidden = false; $("pauseBtn").textContent = T("along.pause");
  $("pauseBtn").parentElement.classList.add("two");
  showStatus(ab ? "" : from > 0 ? T("along.playingFrom", { phrase: phraseLabel(from) }) : "");

  // Each pass starts at phrase passFrom. The first pass starts wherever you
  // chose; when it loops, it goes back to the very beginning of the song.
  const pass = (start, passFrom, passTo, first) => {
    opt.firstPass = !!first;
    timers = timers.slice(-200);
    activeNodes = activeNodes.slice(-400);
    const { lines, chips, part, items } = segment(passFrom, passTo);
    opt.chips = chips;
    wholeRun.from = passFrom;
    const end = schedulePass({ items }, start, opt);
    // when each phrase starts, so Pause knows where you are
    let at = opt.noteStart;
    const starts = part.map((p, k) => {
      const here = at;
      at += p.items.filter(x => !x.bar).reduce((s, n) => s + n.dur, 0) * opt.eighth;
      // light the line while it plays. The first line lights from the very
      // start of the pass, so the page is already back at the top during the
      // count-in (and the silent lead-in measure when looping).
      const from = k === 0 ? Math.min(start, here) : here;
      // the last line stays lit through the rest of its final measure
      const to = k === part.length - 1 ? Math.max(at, end) : at;
      if (lines[k]) showAt(lines[k], from, to - from);
      return here;
    });
    wholeRun.starts = starts;
    if (opt.loop) {
      const nextFrom = ab ? ab.a : 0, nextTo = ab ? ab.b : lastI;
      looping = setTimeout(() => pass(end, nextFrom, nextTo), Math.max(0, (end - ctx.currentTime - 0.35) * 1000));
    } else {
      endTimer = setTimeout(() => { setPlaying(false); endWhole(); }, (end - ctx.currentTime) * 1000 + 600);
    }
  };
  // One extra "get ready" measure of metronome clicks before the first pass
  // only, so you have time to get your hands on the uke after tapping.
  // With the count-in on, that's two full measures of clicks before beat 1,
  // and a pickup note comes in at the end of the second. Loops don't repeat it.
  // With the count-in on, the pass brings its own lead-in
  // measure. Without one, the pickup has to sit at the end of the "get ready"
  // measure, so that beat 1 lands right after it, on the clicks' grid.
  // If "Keep clicking" is on, the pass clicks the pickup's beats itself, so the
  // get-ready measure leaves those out rather than clicking them twice.
  // (the first pass brings no lead-in of its own unless the count-in is on)
  const pickup = opt.countIn ? 0 : pickupEighths(SEQ[from].items);
  const pickupBeats = opt.clickAll ? Math.floor(pickup / METER.beatLen + 1e-9) : 0;
  const ready = countBars();          // the get-ready lead-in: as many measures as the count-in
  for (let b = 0; b < ready * BEATS_PER_BAR - pickupBeats; b++) clickAt(t + b * beat, b % BEATS_PER_BAR === 0, b % BEATS_PER_BAR, beat);
  showLeadMeasure(t, beat, ready);    // every beat of it, the pickup's beats too
  t += ready * BEATS_PER_BAR * beat;
  pass(t - pickup * opt.eighth, from, ab && from <= ab.b ? ab.b : lastI, true);
}

// Which phrase is sounding right now
function currentPhrase() {
  if (!wholeRun || !ctx) return 0;
  const now = heardTime() - (+$("visDelay").value) / 1000;
  let k = 0;
  wholeRun.starts.forEach((st, j) => { if (st <= now) k = j; });
  return wholeRun.from + k;
}

function pauseWhole() {
  if (!wholeRun) return;
  const at = currentPhrase();
  stopAll();                      // clears wholeRun
  wholePaused = at;
  $("alongBeats").hidden = true;
  $("pauseBtn").hidden = false;
  $("pauseBtn").parentElement.classList.add("two");
  $("pauseBtn").textContent = T("along.resumeAtBar", { bar: firstBar(at) });
  $("pauseBtn").classList.add("resume");
  document.querySelectorAll("#allNotes .all-line").forEach((l, i) => l.classList.toggle("resume-here", i === at));
  showStatus(T("along.paused", { phrase: phraseLabel(at) }));
  showDock("paused", T("along.dockPaused", { bar: firstBar(at) }));
}

// ---------- Keep the playing line in view ----------
// When a new line starts, the page glides so that line sits about a third of
// the way down the screen, leaving the next lines visible for reading ahead.
// It moves only when the music reaches a new line, so it follows any tempo.
// If you scroll by hand, it waits a few seconds before following again.
let lastLineEl = null;
let handScrollUntil = 0;
// Only an actual drag or wheel counts as scrolling by hand. (A tap on a
// button, like Play whole melody, must not pause the following.)
// Scrolling only counts once the melody is playing, so scrolling down to
// reach the Play button doesn't hold anything back.
["touchmove", "wheel"].forEach(ev => window.addEventListener(ev, e => {
  if (!wholeRun) return;
  if (!e.target.closest(".dock")) handScrollUntil = performance.now() + 4000;
}, { passive: true }));
window.addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "].includes(e.key) && e.target === document.body)
    handScrollUntil = performance.now() + 4000;
});

function onLineChange(el) {
  const bar = el.querySelector(".bn");
  if (bar) $("dockWhere").textContent = T("along.dockBar", { bar: bar.textContent });
  followTo(el, false);
}

// instant = jump right away (used the moment you tap play); otherwise glide
function followTo(el, instant) {
  if (!el || !$("followLine").checked || !$("allDetails").open) return;
  if (!instant && performance.now() < handScrollUntil) return;
  // Every playing line sits in the same spot: near the top of the screen,
  // with just enough room above it for a "Verse 1" or "Chorus" heading, so
  // the lines ahead fill the rest of the screen. Only at the end of the song,
  // when the page can't scroll any further, do lines sit lower.
  const LINE_TOP = 56;
  const top = el.getBoundingClientRect().top + window.scrollY - LINE_TOP;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: Math.max(0, top), behavior: reduce || instant ? "auto" : "smooth" });
}

function showDock(mode, where) {
  $("dock").hidden = mode === "off";
  document.body.classList.toggle("docked", mode !== "off");
  $("dockPause").textContent = mode === "paused" ? T("along.resume") : T("along.pause");
  $("dockPause").classList.toggle("resume", mode === "paused");
  if (where) $("dockWhere").textContent = where;
}

function endWhole() {
  wholeRun = null; wholePaused = null;
  $("alongBeats").hidden = true;
  showDock("off");
  $("pauseBtn").hidden = true;
  $("pauseBtn").classList.remove("resume");
  $("pauseBtn").parentElement.classList.remove("two");
  document.querySelectorAll("#allNotes .resume-here").forEach(l => l.classList.remove("resume-here"));
  showStatus("");
}

function showStatus(text) {
  $("allStatus").textContent = text;
  $("allStatus").hidden = !text;
}

function playPhrase(phrase, slow) {
  ensureAudio(); stopAll();
  const bpm = +$("tempo").value * (slow ? 0.6 : 1);
  const beat = 60 / bpm;
  const opt = {
    beat, eighth: beat / METER.beatLen,
    doMidi: +$("doPitch").value,
    countIn: $("countIn").checked,
    countBars: countBars(),
    clickAll: $("clickAll").checked,
    loop: $("loop").checked
  };
  let t = ctx.currentTime + 0.12;
  if ($("doFirst").checked) { pluckAt(opt.doMidi, t, 1.0); t += 1.5; }
  setPlaying(true);

  const pass = start => {
    // drop finished timers and audio nodes so a long loop stays light
    timers = timers.slice(-200);
    activeNodes = activeNodes.slice(-200);
    const end = schedulePass(phrase, start, opt);
    if (opt.loop) {
      // schedule the next pass a moment before this one ends
      const ms = (end - ctx.currentTime - 0.35) * 1000;
      looping = setTimeout(() => pass(end), Math.max(0, ms));
    } else {
      endTimer = setTimeout(() => setPlaying(false), (end - ctx.currentTime) * 1000 + 600);
    }
  };
  pass(t);
}

// Start metronome: clicks at the set tempo, beat 1 accented, until Stop, in
// the Beats per measure menu's meter. It schedules one measure at a time, so a
// tempo change takes effect at the next measure.
function playMetronome() {
  ensureAudio(); stopAll();
  setPlaying(true, "metro");
  playingMeter = metroMenuMeter();
  const beats = playingMeter.beats;
  renderBeatDots(beats);
  let t = ctx.currentTime + 0.12;
  const measure = () => {
    const beat = 60 / +$("tempo").value;
    timers = timers.slice(-200); activeNodes = activeNodes.slice(-200);
    for (let b = 0; b < beats; b++) clickAt(t + b * beat, b === 0, b, beat);
    t += beats * beat;
    looping = setTimeout(measure, Math.max(0, (t - ctx.currentTime - 0.35) * 1000));
  };
  measure();
}

// ---------- Sync calibration ----------
// The phone doesn't tell web pages how long the sound takes to reach your
// ears (speaker, wired or Bluetooth all differ). So we measure it: play slow,
// evenly spaced clicks, you tap when you hear each one, and the typical gap
// between "click scheduled" and "you tapped" becomes the highlight delay.
// Clicks are 1.5 s apart so even a long Bluetooth delay can't be mistaken
// for the next click.
let calibrating = false;
let calib = null;
const CAL_CLICKS = 10, CAL_GAP = 1.5;

function openCalib() {
  stopAll();
  $("calib").hidden = false; $("syncOpen").hidden = true;
  $("calibText").textContent = T("calib.intro");
  $("tapPad").textContent = T("calib.start"); $("calibCount").textContent = "";
  $("calibCancel").textContent = T("calib.cancel");
  calib = null;
}
function closeCalib() {
  calibrating = false; calib = null; stopAll();
  $("calib").hidden = true; $("syncOpen").hidden = false;
}
function startCalib() {
  ensureAudio(); stopAll();
  calibrating = true;
  const t0 = ctx.currentTime + 0.6;
  const clicks = [];
  for (let i = 0; i < CAL_CLICKS; i++) {
    const when = t0 + i * CAL_GAP;
    clickAt(when, true, 0);
    clicks.push(when);
  }
  calib = { clicks, taps: [] };
  setPlaying(true);
  $("tapPad").textContent = T("calib.tapEach");
  $("calibCount").textContent = T("calib.count", { n: 0, total: CAL_CLICKS });
  // keep the smoothed clock running so taps are measured accurately
  const keepAlive = () => { if (calibrating) { heardTime(); requestAnimationFrame(keepAlive); } };
  keepAlive();
  endTimer = setTimeout(finishCalib, (t0 - ctx.currentTime + CAL_CLICKS * CAL_GAP + 0.6) * 1000);
}
function calibTap() {
  if (!calib) { startCalib(); return; }
  const t = heardTime();
  calib.taps.push(t);
  $("calibCount").textContent = T("calib.count", { n: calib.taps.length, total: CAL_CLICKS });
  $("tapPad").classList.add("hit"); setTimeout(() => $("tapPad").classList.remove("hit"), 90);
}
function finishCalib() {
  if (!calib) return;
  const diffs = [];
  for (const tap of calib.taps) {
    // match each tap to the click it belongs to: up to 0.4 s early, 1.1 s late
    let best = null;
    for (const c of calib.clicks.slice(2)) {          // skip the first two while you settle in
      const d = tap - c;
      if (d > -0.4 && d < 1.1 && (best === null || Math.abs(d) < Math.abs(best))) best = d;
    }
    if (best !== null) diffs.push(best);
  }
  calibrating = false;
  setPlaying(false);
  if (diffs.length < 4) {
    calib = null;
    $("calibText").textContent = T("calib.tooFew");
    $("tapPad").textContent = T("calib.start"); $("calibCount").textContent = "";
    return;
  }
  diffs.sort((a, b) => a - b);
  const mid = diffs[Math.floor(diffs.length / 2)];
  const ms = Math.max(-300, Math.min(1000, Math.round(mid * 100) * 10));
  $("visDelay").value = ms;
  $("visDelayVal").textContent = T("units.ms", { n: ms });
  savePrefs();
  calib = null;
  $("calibText").textContent = T("calib.done", { ms });
  $("tapPad").textContent = T("calib.again"); $("calibCount").textContent = "";
  $("calibCancel").textContent = T("calib.close");
}

// Each instrument: a menu name, an optional note, and its open strings as
// [string name, MIDI note], in the usual tuning order (low string first,
// except ukulele-style re-entrant tunings, listed G C E A as players say it).
// The menu name and any note for each instrument are in STRINGS
// (tuning.name_<id>, tuning.note_<id>).
const TUNING_LIST = [
  ["uke",        [["G", 67], ["C", 60], ["E", 64], ["A", 69]]],
  ["lowg",       [["G", 55], ["C", 60], ["E", 64], ["A", 69]]],
  ["baritone",   [["D", 50], ["G", 55], ["B", 59], ["E", 64]]],
  ["guitalele",  [["A", 45], ["D", 50], ["G", 55], ["C", 60], ["E", 64], ["A", 69]]],
  ["guitaleleE", [["E", 40], ["A", 45], ["D", 50], ["G", 55], ["B", 59], ["E", 64]]],
  ["guitar",     [["E", 40], ["A", 45], ["D", 50], ["G", 55], ["B", 59], ["E", 64]]],
  ["violin",     [["G", 55], ["D", 62], ["A", 69], ["E", 76]]],
  ["mandolin",   [["G", 55], ["D", 62], ["A", 69], ["E", 76]]],
  ["viola",      [["C", 48], ["G", 55], ["D", 62], ["A", 69]]],
  ["cello",      [["C", 36], ["G", 43], ["D", 50], ["A", 57]]],
  ["dulcimer",   [["D", 50], ["A", 57], ["d", 62]]],
  ["tenorbanjo", [["C", 48], ["G", 55], ["D", 62], ["A", 69]]],
  ["irishbanjo", [["G", 43], ["D", 50], ["A", 57], ["E", 64]]],
  ["winds",      [["A", 69], ["B♭", 70]]]

const TUNINGS = Object.fromEntries(TUNING_LIST);
const tuningNote = id => STRINGS.tuning["note_" + id] || "";
let tuneMidi = null;
const refHz = () => +$("tuneRef").value;
const tuneFreq = m => refHz() * Math.pow(2, (m - 69) / 12);   // ignores Transpose and Fine tune

// A clean tone at exactly the right frequency: a fundamental plus a few
// gentle overtones, which makes it easier to hear against a string.
let toneWave = null;
// Low notes need help: our ears hear low pitches as much quieter, and phone
// speakers, earbuds and hearing aids play them weakly. So lower notes get
//  1. more overtones, which small speakers can play (the ear fills in the
//     low pitch from them), and
//  2. a volume boost, growing gradually toward the lowest notes.
// The pitch stays exact; only the tone color and loudness change.
const BASE_PARTIALS = [0, 1, 0.35, 0.18, 0.09, 0.05, 0, 0, 0, 0];
const RICH_PARTIALS = [0, 1, 0.85, 0.7, 0.55, 0.42, 0.32, 0.24, 0.17, 0.12];
const waveCache = new Map();
function toneWaveFor(freq) {
  // richness: 0 at 300 Hz and above, rising to 1 at about 100 Hz and below
  const key = Math.round(Math.max(0, Math.min(1, (300 - freq) / 200)) * 20);
  const hit = waveCache.get(key);
  if (!hit || hit.ctx !== ctx) {
    const r = key / 20;
    const real = new Float32Array(BASE_PARTIALS.map((b0, i) => b0 * (1 - r) + RICH_PARTIALS[i] * r));
    waveCache.set(key, { ctx, wave: ctx.createPeriodicWave(real, new Float32Array(real.length)) });
  }
  return waveCache.get(key).wave;
}
// Louder for lower notes: about 1.5x at 110 Hz (low A), 1.9x at 65 Hz (cello C)
const lowBoost = freq => Math.max(1, Math.min(2.2, Math.pow(330 / freq, 0.45)));
const tuneVolume = () => +(document.getElementById("tuneVol") || { value: 80 }).value / 100;

function toneAt(freq, when, steady, gap = 1) {
  const osc = ctx.createOscillator();
  osc.setPeriodicWave(toneWaveFor(freq));
  osc.frequency.value = freq;
  const g = ctx.createGain();
  const level = lowBoost(freq) * tuneVolume() / 0.8;   // 80% on the slider = the original loudness
  const steadyPeak = 0.22 * level, pluckPeak = 0.32 * level;
  g.gain.setValueAtTime(0.0001, when);
  if (steady) {
    g.gain.exponentialRampToValueAtTime(steadyPeak, when + 0.08);      // soft start, then hold
  } else {
    // plucked: quick attack, then a natural ring that fades gradually,
    // still clearly sounding when the next pluck arrives
    g.gain.exponentialRampToValueAtTime(pluckPeak, when + 0.006);
    g.gain.setTargetAtTime(0.0001, when + 0.02, gap * 0.55);
    // a short fade right at the end, so there's no click
    g.gain.setValueAtTime(pluckPeak * Math.exp(-(gap - 0.06) / (gap * 0.55)), when + gap - 0.04);
    g.gain.linearRampToValueAtTime(0.0001, when + gap + 0.02);
  }
  osc.connect(g).connect(ctx.destination);
  osc.start(when);
  if (!steady) osc.stop(when + gap + 0.05);
  activeNodes.push(osc);
}

function playTuning(midi) {
  ensureAudio(); stopAll();
  tuneMidi = midi;
  setPlaying(true, "tune");
  const f = tuneFreq(midi);
  let t = ctx.currentTime + 0.05;
  const sound = $("tuneSound").value;
  if (sound === "steady") { toneAt(f, t, true); return; }
  const gap = sound === "pluck2" ? 2 : 1;
  const tick = () => {
    activeNodes = activeNodes.slice(-20);
    toneAt(f, t, false, gap);
    t += gap;
    looping = setTimeout(tick, Math.max(0, (t - ctx.currentTime - 0.3) * 1000));
  };
  tick();
}

function noteLabel(m) { return ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"][m % 12] + (Math.floor(m / 12) - 1); }
function renderTuning() {

const STORE = songKey("phrase-parrot-v1");
let order = [], pos = -1;

// Chorus setting: "mixed" shuffles verse and chorus phrases together;
// "after" shuffles the verse phrases, then the chorus phrases; "skip"
// leaves the chorus out of the round.
const chorusMode = () => ($("chorusMode") && $("chorusMode").value) || "mixed";
function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffle() {
  const all = PHRASES.map((_, i) => i);
  const verse = all.filter(i => PHRASES[i].kind === "verse");
  const chorus = all.filter(i => PHRASES[i].kind === "chorus");
  const mode = chorusMode();
  order = mode === "after" ? [...shuffled(verse), ...shuffled(chorus)]
        : mode === "skip" ? shuffled(verse)
        : shuffled(all);
  pos = -1;
}
function save() {
  storeSet(STORE + "-" + drillVerse, JSON.stringify({ order, pos, mode: chorusMode() }));
}
function load() {
  const s = storeGetJSON(STORE + "-" + drillVerse);
  // only resume a round shuffled with today's chorus setting
  if (s && Array.isArray(s.order) && s.mode === chorusMode() && s.order.length && s.order.every(i => i >= 0 && i < PHRASES.length)) {
    order = s.order; pos = s.pos; return true;
  }
  return false;
}

function renderProgress() {
  const n = order.length;
  $("progress").classList.toggle("many", n > 16);
  // played pips show verse (teal) and chorus (darker gold), so you can see the mix;
  // upcoming ones stay plain so they don't give away what's next
  $("progress").innerHTML = order.map((ix, i) =>
    `<span class="pip ${i < pos && PHRASES[ix] && PHRASES[ix].kind === "chorus" ? "ch" : ""} ${i < pos ? "done" : i === pos ? "now" : ""}"></span>`).join("");
  if (pos < 0) $("count").textContent = T("drill.countNone", { n });
  else $("count").textContent = T("drill.countNow", { k: pos + 1, n });
  $("nextBtn").textContent = pos >= n - 1 ? T("drill.startNewRound") : cueMode() ? T("drill.newCue") : T("ui.newPhrase");
}

// Apple Notes (and some other apps) mark line breaks with special characters
// (Unicode "line separator" U+2028 or "paragraph separator" U+2029, or an old
// Mac carriage return) instead of a normal newline. A text box shows those as
// nothing, so pasted lines look run together. This turns them all into normal
// newlines. If a normal newline was also typed right next to one, the pair
// counts as a single line break, so lines don't end up double-spaced.
function normalizeBreaks(text) {
  return String(text)
    .replace(/\r\n/g, "\n")
    .replace(/[\u2028\u2029\u0085\r][ \t]*\n|\n[ \t]*[\u2028\u2029\u0085\r]/g, "\n")

    if (/^(verse|couplet|chorus|refrain)\b[^a-z]*\d*\s*:?\s*$/i.test(b[0])) { label = b[0].replace(/:$/, ""); body = b.slice(1); }
    const isChorus = label && /^(chorus|refrain)/i.test(label);
    let lines = [], meaning = [], badMeaning = false;
    for (const l of body) {
      if (l.startsWith("=")) {
        if (!lines.length || meaning[lines.length - 1]) badMeaning = true;
        else meaning[lines.length - 1] = l.slice(1).trim();
      } else { lines.push(l); meaning.push(""); }
    }
    const blockLabel = label || (isChorus ? FILE_LABELS.chorus : FILE_LABELS.verse(verses.length + 1));
    if (badMeaning) problems.push(T("lyrics.problemMeaning", { label: blockLabel }));
    const withMeaning = meaning.some(Boolean);
    if (isChorus) {
      if (CHORUS_PHRASES % 2 === 0 && lines.length === CHORUS_PHRASES / 2) { lines = lines.concat(lines); meaning = meaning.concat(meaning); }
      if (lines.length !== CHORUS_PHRASES) problems.push(T(CHORUS_PHRASES % 2 === 0 ? "lyrics.problemChorus" : "lyrics.problemChorusOdd",
        { label, lines: TN(lines.length, "lyrics.lines1", "lyrics.linesN"), need: CHORUS_PHRASES, half: CHORUS_PHRASES / 2 }));
      choruses.push(withMeaning ? { label, lines, meaning } : { label, lines });
    } else {
      label = label || FILE_LABELS.verse(verses.length + 1);
      if (lines.length !== VERSE_PHRASES) problems.push(T("lyrics.problemVerse", { label, lines: TN(lines.length, "lyrics.lines1", "lyrics.linesN"), need: VERSE_PHRASES }));
      verses.push(withMeaning ? { label, lines, meaning } : { label, lines });
    }
  }
  markSyllables(verses, choruses, problems);
  return { name: name || T("lyrics.mySetName"), verses, choruses, problems };
}
// How many notes each phrase has: verse v's phrases, and the chorus's.
let PHRASE_NOTES = null;
function phraseNotes(kind, v) {
  if (!PHRASE_NOTES) {
    const count = list => withItems(list).map(p => p.items.filter(x => !x.bar).length);
    PHRASE_NOTES = { verse: {}, chorus: HAS_CHORUS ? count(chorusAfter(1)) : [] };
    for (const n of VERSE_NUMS) PHRASE_NOTES.verse[n] = count(verseOf(n));
  }
  return kind === "chorus" ? PHRASE_NOTES.chorus : PHRASE_NOTES.verse[v] || [];
}
// Syllable marks in my own lyrics. If any line in the set has a "-" or "_",
// the whole set counts as marked: each line, as typed, becomes its syllable
// line (syl), read as one note per word unless marks say otherwise. A line
// whose syllables fit its notes shows without the marks; one that doesn't is
// listed as a problem and shows as typed (and lights as a whole line).
function markSyllables(verses, choruses, problems) {
  const all = [...verses, ...choruses];
  if (!all.some(g => g.lines.some(l => /[-_]/.test(l)))) return;
  const fix = (g, notes) => {
    g.syl = g.lines.slice();
    g.lines = g.lines.map((typed, k) => {
      const syls = parseSyl(typed);
      if (!syls || notes[k] == null) return typed;
      if (sylNotes(syls) === notes[k]) return sylPlain(syls);
      problems.push(T("lyrics.problemSyl", { label: g.label, line: k + 1, syl: sylNotes(syls), notes: notes[k] }));
      return typed;
    });
  };
  verses.forEach((g, i) => fix(g, phraseNotes("verse", i + 1)));
  choruses.forEach(g => fix(g, phraseNotes("chorus")));
}

// The lyric lines for one phrase (0–7 are verse phrases, 8–15 chorus)
// For a verse phrase, the line for the verse you're hearing comes first and
// is highlighted (French couplets 1, 2 and 6 stand in for verses 1, 2, 3).
function lyricsHTML(p) {
  const sets = lyricSets();
  const chorus = p.kind === "chorus";
  const k = p.k;
  const showMeaning = $("showMeaning").checked;
  const many = sets.length > 1;
  let html = "";
  for (const set of sets) {
    let groups = chorus ? set.choruses : set.verses;
    if (!groups.length) continue;
    const cur = chorus ? -1 : p.verse - 1;
    if (cur > 0 && cur < groups.length) groups = [groups[cur], ...groups.filter((_, gi) => gi !== cur)];
    const curGroup = cur >= 0 && cur < (chorus ? set.choruses : set.verses).length ? (chorus ? set.choruses : set.verses)[cur] : null;
    // Choruses that are identical only need showing once
    const seen = new Set();
    let rows = "";
    for (const g of groups) {
      const line = g.lines[k];
      if (chorus && seen.has(line)) continue;
      seen.add(line);
      const meaning = showMeaning && g.meaning ? `<span class="ly-mean">${esc(g.meaning[k] || "")}</span>` : "";
      rows += `<div class="ly-row${g === curGroup && !chorus ? " ly-current" : ""}"><span class="ly-label">${esc(g.label)}</span><span class="ly-text">${line ? esc(line) : `<em>${T("lyrics.noLine")}</em>`}${meaning}</span></div>`;
    }
    html += `<div class="ly-set">${many ? `<p class="ly-set-name">${esc(set.name)}</p>` : ""}${rows}</div>`;
  }
  if (!html) {
    html = `<p class="ly-empty">${T("lyrics.empty")}</p>`;
  }
  return html;
}

// Export as a real plain-text file. On phones, the share sheet is the
// reliable way: "Save to Files" there writes a true .txt file. (A plain
// download link makes iPhone Safari open the text as a web page instead.)
// Elsewhere, fall back to a download that browsers save rather than open.
// ---------- Save lyrics to a file ----------
// The file always uses the same tidy layout, which Import reads back:
//   Verse 1            <- a label line
//   words for phrase 1 <- one line per phrase, single-spaced
//   ...
//                      <- one blank line between verses and the chorus
//   Chorus
//   ...
//   = a meaning     <- optional, right under the line it explains
// A file with several sets puts "### Set: <name>" before each one.
function setFileText(text) {
  const parsed = parseMyLyrics(normalizeBreaks(text));
  const blocks = [];
  const linesWithMeaning = g => g.lines.flatMap((l, i) => g.meaning && g.meaning[i] ? [l, "= " + g.meaning[i]] : [l]);
  parsed.verses.forEach((v, i) => blocks.push([v.label || FILE_LABELS.verse(i + 1), ...linesWithMeaning(v)]));
  parsed.choruses.forEach((c, i) => {
    // a chorus whose two halves match (words and meanings) is saved as its 4 lines
    const L = c.lines, M = c.meaning || [];
    const halvesMatch = L.length === 8 && L.slice(0, 4).every((x, j) => x === L[4 + j] && (M[j] || "") === (M[4 + j] || ""));
    const shown = halvesMatch ? { lines: L.slice(0, 4), meaning: c.meaning && M.slice(0, 4) } : c;
    blocks.push([c.label || (parsed.choruses.length > 1 ? FILE_LABELS.chorusN(i + 1) : FILE_LABELS.chorus), ...linesWithMeaning(shown)]);
  });
  return blocks.map(b => b.join("\n")).join("\n\n") + "\n";
}
const allSetsFileText = () => readLyricSets().map(st => FILE_LABELS.setHeading + st.name + "\n\n" + setFileText(st.text)).join("\n");

const fileSlug = name => name.trim().toLowerCase().replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, "-") || "lyrics";
const fileNameFor = setName => T("lyrics.defaultFileSet", { song: SONG_ID, set: fileSlug(setName) });
function fileName() {
  let n = ($("myFileName").value || "").trim() || fileNameFor($("mySetName").value || T("lyrics.mySetName"));
  n = n.replace(/[\\/:*?"<>|]+/g, "-");
  if (!/\.txt$/i.test(n)) n += ".txt";
  return n;
}

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

// Hands a text file to the person in the best way this device allows.
async function saveTextFile(text, name) {
  const say = t => { $("myStatus").textContent = t; };

  // 1. Computers with Chrome or Edge (Windows, Chromebook, Mac):
  //    the real Save dialog, starting in Downloads, with the name filled in.
  if (window.showSaveFilePicker && !isIOS) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name, startIn: "downloads",
        types: [{ description: T("lyrics.fileType"), accept: { "text/plain": [".txt"] } }]
      });
      const w = await handle.createWritable();
      await w.write(text); await w.close();
      say(T("lyrics.savedAs", { name: handle.name }));
      return true;
    } catch (e) {
      if (e && e.name === "AbortError") return;      // you pressed Cancel
      reportError(T("err.saveFile", { how: "showSaveFilePicker", msg: e.message }));
    }
  }

  // 2. Phones and tablets: the share sheet. On iPhone choose Save to Files
  //    (pick a folder there); on Android choose Files, Drive, or similar.
  try {
    const file = new File([text], name, { type: "text/plain" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      say(isIOS ? T("lyrics.iosShared") : T("lyrics.shared"));
      return true;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;        // you closed the share sheet
    reportError(T("err.saveFile", { how: "share", msg: e.message }));
  }

  // 3. An iPhone viewer that can't save files (such as a preview inside
  //    another app): don't hand the file to Safari. Offer Copy instead.
  if (isIOS) {
    say(T("lyrics.iosNoSave"));
    return;
  }

  // 4. Everywhere else: an ordinary download to the Downloads folder,
  //    using the name in the box above.
  const blob = new Blob([text], { type: "application/octet-stream" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = name;
  document.body.appendChild(link); link.click();
  setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 1000);
  say(T("lyrics.downloaded", { name }));
  return true;
}
const exportMyLyrics = () => saveTextFile(setFileText($("myLyrics").value), fileName());
const exportAllSets = async () => {

// Splits a file into [name, text] sets: "### Set:" headings if it has them,
// otherwise the whole file is one set named after the file.
function setsInFile(text, fileNameText) {
  const head = FILE_LABELS.setHeading.trim();
  if (!text.split("\n").some(l => l.trim().startsWith(head))) {
    const base = fileNameText.replace(/\.txt$/i, "").replace(new RegExp("^" + SONG_ID + "-"), "").replace(/-/g, " ");
    return [[base || T("lyrics.mySetName"), text]];
  }
  const found = [];
  for (const line of text.split("\n")) {
    if (line.trim().startsWith(head)) found.push([line.trim().slice(head.length).trim() || T("lyrics.mySetName"), ""]);
    else if (found.length) found[found.length - 1][1] += line + "\n";
  }
  return found;
}
function importMyLyrics(file) {
  const r = new FileReader();
  r.onload = () => {
    if (!okToLeave()) return;
    const sets = readLyricSets(), added = [];
    for (const [name, text] of setsInFile(normalizeBreaks(r.result), file.name)) {
      if (!text.trim()) continue;
      const st = { id: newSetId(sets), name: uniqueSetName(sets, name), text: text.trim() + "\n" };
      sets.push(st); added.push(st);
    }
    if (!added.length) { $("myStatus").textContent = T("lyrics.importedNone"); return; }
    if (!writeLyricSets(sets)) return;
    showSet(added[0].id); afterSetsChanged();
    $("myStatus").textContent = added.length === 1 ? T("lyrics.importedOne", { name: added[0].name })
      : T("lyrics.importedMany", { n: added.length, names: added.map(x => x.name).join(", ") });
  };
  r.onerror = () => reportError(T("err.fileRead", { name: file.name, msg: (r.error && r.error.message) || "unknown" }));
  r.readAsText(file);
}

// Hides the phrase name, solfège and lyrics and disables replay (no phrase yet).
function hideStageReveals() {
  $("notes").hidden = $("phraseId").hidden = $("revealBtn").hidden = $("whichBtn").hidden = true;
  $("cueLyric").hidden = $("cueNote").hidden = $("scoreRow").hidden = true;
  $("lyricBox").hidden = $("lyricsBtn").hidden = true;
  $("againBtn").disabled = $("slowBtn").disabled = true;
}

function renderStage() {
  const has = pos >= 0;
  $("againBtn").disabled = !has;
  $("slowBtn").disabled = !has;
  if (!has) return;
  const p = PHRASES[order[pos]];
  const cue = cueMode();
  $("prompt").textContent = !cue ? T("drill.listen") : checkedThis ? T("drill.cueChecked") : T("drill.cuePrompt");
  $("prompt").classList.remove("quiet");
  $("againBtn").textContent = playing ? T("drill.stop") : againLabel();
  $("scoreRow").hidden = !(cue && checkedThis);
  let html = "";
  html += chipsHTML(p.items);
  $("notes").innerHTML = html;
  $("phraseNameText").textContent = p.id;
  $("phraseBars").textContent = p.bars;
  // the cue: the phrase name, its lyric line, or both
  let lyric = null, noLyric = false;
  if (cue && cueType() !== "name") {
    const set = lyricSets()[0];
    lyric = alongLyricFor(set, p);
    noLyric = !lyric;
    if (noLyric) $("cueNote").textContent = T("drill.noLyricCue", { set: set ? set.name : T("lyrics.mySetName") });
  }
  $("cueLyric").hidden = !lyric;
  $("cueNote").hidden = !noLyric;
  if (lyric) {
    $("cueLyricText").textContent = lyric.text;
    $("cueLyricMean").textContent = lyric.meaning || "";
    $("cueLyricMean").hidden = !($("showMeaning").checked && lyric.meaning);
  }
  const nameIsCue = cue && (cueType() !== "lyrics" || noLyric);
  const showName = nameIsCue || $("autoPhraseName").checked;
  $("phraseId").hidden = !showName;
  $("whichBtn").hidden = showName;
  // in cue mode, "right away" reveals wait until the cue has been checked
  const afterCheck = !cue || checkedThis;
  const show = $("autoReveal").checked && afterCheck;
  $("notes").hidden = !show;
  $("revealBtn").hidden = show;
  const showLy = $("autoLyrics").checked && !SONG.instrumental && afterCheck;
  renderLyricBox();
  $("lyricBox").hidden = !showLy;
  $("lyricsBtn").hidden = showLy || !!SONG.instrumental;
}

function next() {
  stopAll();
  if (pos >= order.length - 1) shuffle();
  pos++;
  checkedThis = false;
  const st = document.querySelector(".stage");
  st.classList.remove("flash"); void st.offsetWidth; st.classList.add("flash");
  save(); renderProgress(); renderStage();
  if (!cueMode()) playPhrase(PHRASES[order[pos]], false);
}
// Play again / Check. In cue mode the first play is the Check: after it the
// Got it / Not yet buttons appear, and the "right away" reveals apply.
function checkPhrase(slow) {
  if (playing) { stopAll(); return; }
  if (cueMode() && !checkedThis) {
    checkedThis = true;
    $("scoreRow").hidden = false;
    $("prompt").textContent = T("drill.cueChecked");
    if ($("autoReveal").checked) { $("notes").hidden = false; $("revealBtn").hidden = true; }
    if ($("autoLyrics").checked && !SONG.instrumental) { renderLyricBox(); $("lyricBox").hidden = false; $("lyricsBtn").hidden = true; }
  }
  playPhrase(PHRASES[order[pos]], slow);
}
// "Not yet": the phrase comes back later in this round (not straight away).
function notYet() {
  const earliest = Math.min(pos + 2, order.length);
  const at = earliest + Math.floor(Math.random() * (order.length - earliest + 1));
  order.splice(at, 0, order[pos]);
  next();
}

// Choose what Play along plays
function renderAlongSub() {
  // a pickup starts in the bar before the first full bar
  const hasPickup = pickupEighths(SEQ[0].items) > 0;
  const first = hasPickup ? +firstBar(0) - 1 : +firstBar(0);
  const lastNum = barNums(SEQ[SEQ.length - 1]).slice(-1)[0];
  const span = T("seq.span", { a: first >= 1 && first < +firstBar(0) ? first : firstBar(0), b: lastNum });
  const song = $("seqSel").value === "song";
  if (song && !planIsDefault()) {
    const verses = planVerses();
    $("alongSub").textContent = T(HAS_CHORUS ? "seq.subPlan" : "seq.subPlanNoChorus",
      { verses: verses.join(", "), c: verses.filter(planChorusAfter).length, span });
    return;
  }
  $("alongSub").textContent = song
    ? T(HAS_CHORUS ? "seq.subSong" : "seq.subSongNoChorus", { n: VERSE_COUNT, span })
    : T("seq.subOne", { label: SEQ_CHOICES[$("seqSel").value].label, span });
}
function renderPlan() {
  const show = $("seqSel").value === "song" && VERSE_COUNT > 1;
  $("planBox").hidden = !show;
  if (!show) return;
  $("planChorusRow").hidden = !HAS_CHORUS;
  $("chorusPlan").value = PLAN.chorus;
  const sung = planVerses();
  $("planRow").innerHTML = VERSE_NUMS.map(v => {
    const on = !PLAN.off.includes(v), ch = planChorusAfter(v), last = on && sung[sung.length - 1] === v;
    const vb = `<button class="pv${on ? "" : " off"}" data-pv="${v}" aria-pressed="${on}" title="${esc(T(on ? "plan.verseOn" : "plan.verseOff", { v }))}">${v}</button>`;
    const cb = HAS_CHORUS ? `<button class="pc${ch ? " on" : ""}${last ? " last" : ""}" data-pc="${v}" aria-pressed="${ch}"${on ? "" : " hidden"}
      title="${esc(T(last ? "plan.chorusLast" : ch ? "plan.chorusOn" : "plan.chorusOff", { v }))}">C</button>` : "";
    return `<span class="plan-pair">${vb}${cb}</span>`;
  }).join("");
  $("planHint").textContent = T(HAS_CHORUS ? "plan.hint" : "plan.hintNoChorus");
}

// Sets the tempo as if the slider had been moved (saved, and Play along picks it up).
function setTempo(bpm) {
  const el = $("tempo"), step = +el.step || 1;
  const v = Math.min(+el.max, Math.max(+el.min, Math.round(bpm / step) * step));
  if (String(v) === el.value) return;
  el.value = v;
  el.dispatchEvent(new Event("input"));
  el.dispatchEvent(new Event("change"));
}

// Tap tempo: the average of the last few gaps between taps; a pause of 2 s starts over.
let tapTimes = [];
$("tapTempo").addEventListener("click", () => {
  const now = performance.now();
  if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2000) tapTimes = [];
  tapTimes.push(now); tapTimes = tapTimes.slice(-5);
  if (tapTimes.length >= 2) {
    const gap = (tapTimes[tapTimes.length - 1] - tapTimes[0]) / (tapTimes.length - 1);
    setTempo(60000 / gap);
  }
  $("tapTempo").textContent = tapTimes.length < 4 ? T("ui.tapAgain") : T("ui.tapTempo");
  clearTimeout($("tapTempo")._reset);
  $("tapTempo")._reset = setTimeout(() => { tapTimes = []; $("tapTempo").textContent = T("ui.tapTempo"); }, 2000);
});

const savedLyricSet = storeGet(LYRICSET_STORE);
refreshLyricChoices();
normalizeLyricChoice(savedLyricSet || (savedPrefs && savedPrefs.lyricSet) || "");
const rememberLyricSet = () => storeSet(LYRICSET_STORE, $("lyricSet").value);
$("lyricSet").addEventListener("change", rememberLyricSet);
$("lyricBox").addEventListener("click", e => { if (e.target.closest(".ly-tab")) setTimeout(rememberLyricSet, 0); });
// apply the saved verse choice and play-along choice
if ($("seqSel").value !== Object.keys(SEQ_CHOICES)[0]) {
  SEQ = joinFill(withItems(SEQ_CHOICES[$("seqSel").value].build()));
  renderWhole(); renderStartFrom();
}
loadAB();
renderAlongSub();
renderPlan();
// the count-in measures: this song's saved choice, or 2 for two beats a bar
$("countBars").value = String(+storeGet(COUNTBARS_STORE) || (BEATS_PER_BAR === 2 ? 2 : 1));
renderLeadDots();
$("countBars").addEventListener("change", () => { stopAll(); storeSet(COUNTBARS_STORE, $("countBars").value); renderLeadDots(); });
drillVerse = $("drillVerse").value || "1";
PHRASES = buildPool(drillVerse);
renderDrillVerse();
renderChorusMode();
renderModeRows();
renderLede();       // with the restored mode
// Switching songs: start that song at verse 1, then reload with it
$("songSel").addEventListener("change", () => {
  stopAll();
  $("drillVerse").value = "1"; $("seqSel").value = Object.keys(SEQ_CHOICES)[0];
  savePrefs();
  location.reload();
});
// My lyric sets: open the set chosen under "Lyrics to show" if it's one of mine, else my first set
const chosenMine = $("lyricSet").value.startsWith(MY_SET_PREFIX) ? $("lyricSet").value.slice(MY_SET_PREFIX.length) : "";
showSet(chosenMine || (readLyricSets()[0] || {}).id || null);
setUpInstrumental();
// text that depends on the song's shape (phrase counts)
const halfChorus = CHORUS_PHRASES / 2;
$("myHelp").textContent = !HAS_CHORUS ? T("lyrics.helpNoChorus", { v: VERSE_PHRASES })
  : T(CHORUS_PHRASES % 2 === 0 ? "lyrics.help" : "lyrics.helpChorusOdd", { v: VERSE_PHRASES, c: CHORUS_PHRASES, half: halfChorus });
$("myHelp").textContent += " " + T("lyrics.helpMeaning");
$("myLyrics").placeholder = T(HAS_CHORUS ? "lyrics.placeholderChorus" : "lyrics.placeholder", { v: VERSE_PHRASES });
// the drill round: resume a saved one, or shuffle a new one
if (!load()) { shuffle(); save(); }
renderProgress();
if (pos >= 0) { renderStage(); $("prompt").textContent = T(cueMode() ? "drill.welcomeBackCue" : "drill.welcomeBack"); }
else $("prompt").textContent = T(cueMode() ? "drill.firstPromptCue" : "drill.firstPrompt", { n: order.length });
renderAB();   // show any saved A–B loop
renderAlongLyrics();   // with the restored lyric choices
renderTuning();
renderLegatoRow();
validateSong();
setUpDeployment();
setUpOfflineAndUpdates();
</script>
</body>
</html>
