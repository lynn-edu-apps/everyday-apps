<script>
  // Appearance chosen in Settings (Light or Dark), applied before the page
  // draws so it doesn't flash. The main script reads the same setting again
  // and reports any storage problem; this early copy only skips quietly.
  try {
    var pre = /\/melodies-by-ear-dev\//.test(location.pathname) ? "dev:" : /\/melodies-by-ear-stable\//.test(location.pathname) ? "stable:" : "";
    var t = (JSON.parse(localStorage.getItem(pre + "phrase-parrot-prefs-v1") || "{}") || {}).theme;
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) { /* reported by the main script's storage helpers */ }
</script>

<title>Melodies by Ear v0.90</title>
<style>
  :root {
    --paper: #F3F5F6;
    --ink: #22303C;
    --muted: #6B7A86;
    --teal: #1D6E7A;
    --teal-soft: #DCEBED;
    --gold: #D49A12;
    --koa: #6E4527;
    --card: #fff;
    --line: #C9D2D8;
    --line-soft: #DDE3E7;
    --idle: #D5DCE0;
    --gold-soft: #FBF0D4;
    --gold-line: #EED9A2;
    --gold-text: #8A5F00;
    --gold-done: #B88A12;
    --hl: #EEF5F6;
    --glass: rgba(255,255,255,.96);
    --faint: #B5C0C7;
    --pk: #7FA9B0;
    --pk-ring: #B9D3D7;
    --warn: #8A4B00;
    --on-teal: #fff;
    color-scheme: light;
  }
  /* Dark mode: follows the phone, unless Settings says Light or Dark */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    --paper: #12191E;
    --ink: #E3E9ED;
    --muted: #9AA8B2;
    --teal: #4FA8B5;
    --teal-soft: #1E363C;
    --gold: #D9A22A;
    --koa: #C89A72;
    --card: #1B242A;
    --line: #3A4750;
    --line-soft: #2C373F;
    --idle: #3A4650;
    --gold-soft: #3A3018;
    --gold-line: #5C4A1E;
    --gold-text: #E8BC55;
    --gold-done: #B88A12;
    --hl: #203840;
    --glass: rgba(27,36,42,.95);
    --faint: #5F6E78;
    --pk: #7FB4BD;
    --pk-ring: #3F6970;
    --warn: #E8A65A;
    --on-teal: #0D1417;
    color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12191E;
    --ink: #E3E9ED;
    --muted: #9AA8B2;
    --teal: #4FA8B5;
    --teal-soft: #1E363C;
    --gold: #D9A22A;
    --koa: #C89A72;
    --card: #1B242A;
    --line: #3A4750;
    --line-soft: #2C373F;
    --idle: #3A4650;
    --gold-soft: #3A3018;
    --gold-line: #5C4A1E;
    --gold-text: #E8BC55;
    --gold-done: #B88A12;
    --hl: #203840;
    --glass: rgba(27,36,42,.95);
    --faint: #5F6E78;
    --pk: #7FB4BD;
    --pk-ring: #3F6970;
    --warn: #E8A65A;
    --on-teal: #0D1417;
    color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 48px; }
  h1 {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 600; font-size: 1.55rem; margin: 0 0 4px;
  }
  .drill-title {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 600; font-size: 1.15rem; margin: 14px 0 2px;
  }
  .lede { color: var(--muted); margin: 0 0 18px; font-size: .95rem; line-height: 1.4; }

  .progress { display: flex; gap: 5px; margin: 0 0 6px; }
  .pip { flex: 1; height: 8px; border-radius: 4px; background: var(--idle); }
  .pip.done { background: var(--teal); }
  .pip.now { background: var(--gold); }
  .count { font-size: .88rem; color: var(--muted); margin: 0 0 16px; }

  .stage {
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 14px;
    padding: 18px 16px;
    min-height: 168px;
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
  }
  .prompt { font-size: 1.05rem; line-height: 1.45; margin: 0; }
  .prompt.quiet { color: var(--muted); }
  /* "Which phrase?": the phrase name, large, for quizzing yourself */
  .phrase-id { margin: 0; }
  .pn-name { display: block; font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 1.55rem; font-weight: 700; line-height: 1.2; color: var(--teal); }
  .pn-bars { display: block; font-size: .85rem; color: var(--muted); margin-top: 2px; }
  .notes { display: flex; flex-wrap: wrap; gap: 14px 4px; align-items: center; }
  .n { position: relative; }
  .n.s16::after {
    content: ""; position: absolute; left: 22%; right: 22%; bottom: -11px; height: 6px;
    border-top: 2px solid var(--teal); border-bottom: 2px solid var(--teal); opacity: .85;
  }
  /* the bars sit below the chip, so they keep their color when it lights up */
  .n.pk.s16::after { border-color: var(--pk); }
  .n.do.s16::after { border-color: var(--gold-text); }
  /* the dot of a dotted note: bigger, and a little apart from the octave mark */
  /* a tie: a small arc from the bottom of a chip toward the next one */
  .n.tied::before {
    content: ""; position: absolute; right: -15px; bottom: -7px; width: 26px; height: 7px;
    border-bottom: 2px solid var(--teal); border-radius: 0 0 50% 50% / 0 0 100% 100%; opacity: .75;
  }
  .n.pk.tied::before { border-color: var(--pk); }
  .n.do.tied::before { border-color: var(--gold-text); }
  #allNotes.lyrics-only .n.tied::before { display: none; }
  .n.dotted::after { content: "•"; font-weight: 900; font-size: .8em; margin-left: 5px; vertical-align: .1em; }
  /* octave marks: high as an apostrophe, low as an apostrophe dropped below the line */
  .oh { margin-left: 1px; }
  .ol { display: inline-block; transform: translateY(.42em); margin-left: 1px; }
  .n {
    font-weight: 650; font-size: 1.02rem;
    padding: 4px 8px; border-radius: 8px;
    background: var(--teal-soft); color: var(--teal);
    transition: background .06s, color .06s;
  }
  /* Shape notes: every chip carries its shape and its syllable; the setting
     (html[data-shapes]) decides which show. Off: syllable only, as before. */
  .n .sh { display: none; }
  .n .sh svg { width: 1.25em; height: .95em; vertical-align: -.08em; fill: currentColor; overflow: visible; }
  .n .sh::after { content: attr(data-acc); font-size: 1.12em; line-height: 0; font-weight: 700; margin-left: 1px; vertical-align: -.04em; }
  html[data-shapes="shapes"] .n .sh, html[data-shapes="both"] .n .sh { display: inline; }
  html[data-shapes="both"] .n .sy { margin-left: 4px; font-size: .9em; }
  html[data-shapes="shapes"] .n .sy { display: none; }
  html[data-shapes="shapes"] .n.peek .sy { display: inline; margin-left: 4px; font-size: .9em; }
  html[data-shapes="shapes"] .n { cursor: pointer; }
  /* Numbers (jianpu): the number, with its octave dots above or below */
  .nm { display: none; white-space: nowrap; }
  .nm-acc { font-size: .8em; margin-right: 1px; vertical-align: .1em; }
  .nm-d { position: relative; display: inline-block; }
  .nm-d[data-up]::before, .nm-d[data-down]::after {
    position: absolute; left: 50%; transform: translateX(-50%);
    white-space: pre; font-size: .62em; line-height: .55; font-weight: 900; text-align: center; }
  .nm-d[data-up]::before { content: attr(data-up); bottom: 90%; }
  .nm-d[data-down]::after { content: attr(data-down); top: 92%; }
  html[data-shapes="numbers"] .n .nm, html[data-shapes="numsyl"] .n .nm { display: inline; }
  html[data-shapes="numbers"] .n .sy, html[data-shapes="numbers"] .n .oh, html[data-shapes="numbers"] .n .ol,
  html[data-shapes="numsyl"] .n .oh, html[data-shapes="numsyl"] .n .ol { display: none; }
  html[data-shapes="numsyl"] .n .sy { margin-left: 5px; font-size: .85em; opacity: .85; }
  html[data-shapes="numbers"] .n.peek .sy { display: inline; margin-left: 5px; font-size: .85em; }
  html[data-shapes="numbers"] .n { cursor: pointer; }
  /* room inside the chip for the dots, so they never touch its edge;
     a chip with two dots above or below gets a little more */
  html[data-shapes="numbers"] .n, html[data-shapes="numsyl"] .n { padding-top: 8px; padding-bottom: 10px; }
  html[data-shapes="numbers"] .n:has(.nm-d[data-up*="\a"]), html[data-shapes="numsyl"] .n:has(.nm-d[data-up*="\a"]) { padding-top: 13px; }
  html[data-shapes="numbers"] .n:has(.nm-d[data-down*="\a"]), html[data-shapes="numsyl"] .n:has(.nm-d[data-down*="\a"]) { padding-bottom: 15px; }
  html[data-shapes="numbers"] .notes, html[data-shapes="numsyl"] .notes { row-gap: 18px; }
  .wq-note .nm, .wq-choice .nm { display: inline; }
  .wq-note .nm-d[data-up]::before { bottom: 88%; } .wq-note .nm-d[data-down]::after { top: 90%; }
  .wq-note.only-num .wq-sh, .wq-note.only-num .wq-acc, .wq-note.only-num .wq-sy, .wq-note.only-num .oh, .wq-note.only-num .ol,
  .wq-choices.only-num .wq-sh, .wq-choices.only-num .wq-acc, .wq-choices.only-num .wq-sy, .wq-choices.only-num .oh, .wq-choices.only-num .ol { display: none; }
  .wq-note:not(.only-num) .nm, .wq-choices:not(.only-num) .nm { display: none; }
  .wq-answer .nm { display: inline; }
  .wq-answer .wq-oct { margin-top: 6px; }
  .wq-note.only-num { padding: .2em 0; }
  .shape-quick[hidden] { display: none; }
  .shape-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 0; font-size: .9rem; color: var(--ink); }
  .shape-legend span { white-space: nowrap; }
  .shape-legend svg { width: 1.3em; height: 1em; vertical-align: -.12em; fill: currentColor; margin-right: 3px; overflow: visible; }
  .n.pk { background: transparent; color: var(--pk); box-shadow: inset 0 0 0 1.5px var(--pk-ring); }
  .n.do { background: var(--gold-soft); color: var(--gold-text); }
  .n.on { background: var(--teal); color: var(--on-teal); }
  .n.do.on { background: var(--gold); color: #2B2005; }
  .bar { color: var(--faint); padding: 0 2px; }
  .reveal {
    align-self: flex-start;
    font: inherit; font-size: .92rem;
    background: none; border: 0; padding: 4px 0;
    color: var(--teal); text-decoration: underline; cursor: pointer;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 10px; }
  .btn {
    font: inherit; font-weight: 600; font-size: 1.05rem;
    border: 0; border-radius: 12px; padding: 16px 10px;
    cursor: pointer; touch-action: manipulation;
  }
  .btn.primary { background: var(--teal); color: var(--on-teal); }
  .btn.secondary { background: var(--card); color: var(--teal); box-shadow: inset 0 0 0 2px var(--teal); }
  .btn.secondary.stop { background: var(--gold); color: #2B2005; box-shadow: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.wide { grid-column: 1 / -1; }
  .small-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .chipbtn {
    font: inherit; font-size: .9rem;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; cursor: pointer;
  }
  .chipbtn.active { background: var(--gold); border-color: var(--gold); color: #2B2005; }
  .chipbtn .gold { color: var(--gold-text); font-weight: 650; }

  .metro {
    margin-top: 16px;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: 14px;
    padding: 12px 16px; display: grid; gap: 10px;
  }
  .metro-head { display: flex; align-items: center; justify-content: space-between; }
  .metro-title { font-weight: 600; }
  .beats { display: flex; gap: 8px; }
  .beat { width: 12px; height: 12px; border-radius: 50%; background: var(--idle); transition: background .04s; }
  .beat.one { width: 16px; height: 16px; }
  .beat.on { background: var(--teal); }
  .beat.one.on { background: var(--gold); }
  .talk-panel { margin-top: 0; border-top: 1px solid var(--line-soft); padding-top: 4px; }
  .talk-panel summary { font-weight: 500; color: var(--teal); }
  .talk-body { display: grid; gap: 12px; padding: 8px 0 4px; }
  .talk-body .settings { padding: 0; }
  .talk-body .tempo-val { min-width: 0; white-space: nowrap; }
  .talk-body .row input[type=range] { min-width: 0; }
  .melody-row { display: grid; gap: 4px; }
  .talk-note { margin: 0; background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 10px; padding: 8px 10px; font-size: .88rem; line-height: 1.4; }
  .switch { display: flex; align-items: center; gap: 12px; font-size: .97rem; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track {
    flex: none; position: relative; width: 44px; height: 26px; border-radius: 13px;
    background: var(--line); transition: background .12s;
  }
  .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .12s;
  }
  .switch input:checked + .track { background: var(--teal); }
  .switch input:checked + .track::after { left: 21px; }
  .switch input:focus-visible + .track { outline: 3px solid var(--gold); outline-offset: 2px; }

  .calib { display: grid; gap: 10px; padding: 10px 0 2px; border-top: 1px solid var(--line-soft); }
  .calib-text { margin: 0; font-size: .95rem; line-height: 1.4; }
  .tap-pad {
    font: inherit; font-weight: 650; font-size: 1.2rem;
    border: 0; border-radius: 14px; padding: 30px 10px;
    background: var(--teal); color: var(--on-teal); cursor: pointer; touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .tap-pad.hit { background: #155760; }
  .calib-row { display: flex; align-items: center; justify-content: space-between; }
  .calib-count { color: var(--muted); font-size: .9rem; }

  /* Tap feedback: every button gives a quick press-and-glow when tapped,
     even if you tap the same one twice in a row */
  .btn, .chipbtn, .reveal, .tap-pad { transition: transform .08s ease; }
  @keyframes press {
    0%   { transform: scale(.94); filter: brightness(.82); box-shadow: 0 0 0 0 rgba(212,154,18,.75); }
    60%  { transform: scale(1);   filter: brightness(1);   box-shadow: 0 0 0 8px rgba(212,154,18,0); }
    100% { transform: scale(1);   filter: brightness(1);   box-shadow: 0 0 0 0 rgba(212,154,18,0); }
  }
  .pressed { animation: press .32s ease-out; }
  @keyframes flash {
    0%   { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,154,18,.45); }
    100% { border-color: var(--line-soft); box-shadow: 0 0 0 0 rgba(212,154,18,0); }
  }
  .stage.flash { animation: flash .6s ease-out; }

  .along-beats {
    position: sticky; top: 0; z-index: 2;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    min-height: 30px; padding: 5px 0; box-sizing: border-box; margin: 0 -16px; background: var(--glass);
  }
  /* one row of dots per count-in measure */
  .lead-row { display: flex; justify-content: center; align-items: center; gap: 14px; height: 18px; }
  .along-beats[hidden] { display: none; }
  .along-beats .beat { width: 14px; height: 14px; }
  .along-beats .beat.one { width: 18px; height: 18px; }
  .along {
    margin-top: 16px; background: var(--card); border: 1px solid var(--line-soft); border-radius: 14px;
    padding: 14px 16px; display: grid; gap: 12px;
  }
  .along h2 {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 600; font-size: 1.15rem; margin: 0 0 2px;
  }
  .along-sub { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.4; }
  .btn.primary.stop { background: var(--gold); color: #2B2005; }
  .btn.secondary.resume { background: var(--teal); color: var(--on-teal); }
  .along-notes { margin-top: 0; }
  .along-notes summary { font-weight: 500; color: var(--teal); }
  /* each verse and chorus starts after a clear gap, under a big heading */
  .all-section { font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 1.45rem; font-weight: 700; line-height: 1.2; color: var(--teal);
    margin: 44px 0 10px; padding-top: 14px; border-top: 2px solid var(--line); }
  .all-section:first-child { margin-top: 6px; padding-top: 0; border-top: 0; }
  .all-line { display: flex; flex-wrap: wrap; gap: 12px 3px; align-items: center; margin: 0 0 12px; }
  .all-line .bn { font-size: .75rem; color: var(--muted); min-width: 22px; }
  .all-line .n { font-size: .9rem; padding: 3px 6px; }
  /* Lyrics under each Play along line: larger than the solfège, easy to read */
  .al-lyric { flex-basis: 100%; padding-left: 30px; margin-top: 4px; }
  .al-text { display: block; font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 1.22rem; line-height: 1.3; color: var(--ink); }
  .al-mean { display: block; font-size: .86rem; line-height: 1.3; color: var(--muted); margin-top: 1px; }
  /* Lyrics only: the solfège chips are hidden, the bar numbers stay */
  #allNotes.lyrics-only .n, #allNotes.lyrics-only .bar, #allNotes.lyrics-only .trip { display: none; }
  #allNotes.lyrics-only .all-line { flex-wrap: nowrap; align-items: baseline; }
  #allNotes.lyrics-only .al-lyric { flex: 1 1 0; min-width: 0; padding-left: 4px; margin-top: 0; }

  .along-start label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .along-btns { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .along-btns.two { grid-template-columns: 1fr 1fr; }
  .along-status { margin: 0; font-size: .92rem; color: var(--ink); line-height: 1.4; }
  .along-tip { margin: 6px 0 0; font-size: .85rem; color: var(--muted); }
  .all-line { border-radius: 10px; padding: 2px 4px; margin-left: -4px; margin-right: -4px; transition: background .1s; }
  .all-line.on { background: var(--hl); }
  .all-line.resume-here { background: var(--gold-soft); }
  .all-line .bn {
    font: inherit; font-size: .75rem; color: var(--teal); min-width: 26px;
    background: none; border: 0; padding: 4px 2px; cursor: pointer; text-decoration: underline;
  }

  .switch.follow { margin: 10px 0 4px; font-size: .92rem; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--glass); border-top: 1px solid var(--line-soft);
    box-shadow: 0 -2px 10px rgba(34,48,60,.08);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .dock-where { flex: 1; min-width: 0; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ab { display: grid; gap: 8px; justify-items: start; }

  .transpose-row { justify-content: flex-start; }

  .pitch-note {
    font: inherit; font-size: .88rem; font-weight: 600; color: #2B2005;

  .reveal-row { display: flex; flex-wrap: wrap; gap: 4px 18px; }

  }
  .ly-tab.on { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }

  .ly-row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 3px 0; }
  .ly-label { font-size: .78rem; color: var(--muted); padding-top: 3px; }

  }

  #myStatus.warn { color: var(--warn); }
  .settings label.fname-label { margin-top: 10px; }

  .drill-verse { display: flex; align-items: center; gap: 6px; margin: 0 0 12px; }
  .dv-label { font-size: .9rem; color: var(--muted); margin-right: 4px; }
  .dv {
    font: inherit; font-size: .95rem; font-weight: 600; min-width: 44px; height: 36px; padding: 0 12px;

  }

  .cm, .dm, .ct, .wo {
    font: inherit; font-size: .88rem; height: 32px; padding: 0 11px;

  }
  .cm.on, .dm.on, .ct.on, .wo.on { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
  /* Cue first: the lyric line to play, large; and the Got it / Not yet buttons */
  .cue-lyric { margin: 0; }
  .cl-text { display: block; font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 1.4rem; font-weight: 600; line-height: 1.25; color: var(--ink); }
  .cl-mean { display: block; font-size: .9rem; color: var(--muted); margin-top: 3px; }

  .score-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 10px; }
  .btn.secondary.notyet { color: var(--gold-text); box-shadow: inset 0 0 0 2px var(--gold); }
  .pip.ch.done { background: var(--gold-done); }
  .progress.many { gap: 3px; }
  .ly-row.ly-current .ly-label { color: var(--teal); font-weight: 700; }
  .ly-row.ly-current .ly-text { font-weight: 600; }
  .trip { display: inline-flex; gap: 3px; position: relative; padding-top: 12px; }
  .trip::before {
    content: ""; position: absolute; top: 4px; left: 6px; right: 6px; height: 6px;
    border: 1.5px solid var(--faint); border-bottom: 0; border-radius: 3px 3px 0 0;
  }
  .trip::after {
    content: "3"; position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
    padding: 0 3px; background: var(--card); font-size: .66rem; font-weight: 700; color: var(--muted); line-height: 1;
  }

  .seg-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tstrings { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .tstr {
    font: inherit; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    padding: 10px 4px 8px; cursor: pointer; line-height: 1.15;
  }
  .tstr b { display: block; font-size: 1.25rem; }
  .tstr small { display: block; font-size: .72rem; color: var(--muted); margin-top: 2px; }
  .tstr.on { background: var(--gold); border-color: var(--gold); color: #2B2005; }
  .tstr.on small { color: #4A3608; }

  .song-row { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
  .song-row label { font-size: .9rem; color: var(--muted); }
  .song-row select { flex: 1; }
  .dv-btns { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }

  details { margin-top: 22px; }
  summary { cursor: pointer; font-weight: 600; color: var(--ink); padding: 6px 0; }
  .settings { display: grid; gap: 14px; padding: 8px 0 4px; }
  .settings label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row input[type=range] { flex: 1; accent-color: var(--teal); }
  .tempo-val { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  select {
    width: 100%; font: inherit; font-size: 1rem;
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink);
  }
  .check { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
  .check input { width: 18px; height: 18px; accent-color: var(--teal); }

  .footnote { font-size: .82rem; color: var(--muted); margin-top: 22px; line-height: 1.45; }

  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    .pressed { animation: none; filter: brightness(.85); }
    .stage.flash { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) { .n { transition: none; } }
  /* Error banner: stays until dismissed (alpha-testing phase: fail loudly) */
  .errbox {
    position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top)); z-index: 30;
    max-width: 560px; margin: 0 auto; max-height: 60vh; overflow-y: auto;
    background: #FFF1EE; color: #5A1408; border: 2px solid #C0391B; border-radius: 12px;
    box-shadow: 0 6px 24px rgba(90,20,8,.25); padding: 8px 12px 10px;
  }
  .err-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .err-head strong { font-size: 1rem; }
  .err-close { font: inherit; font-size: 1.1rem; border: 0; background: none; color: #5A1408; padding: 6px 10px; cursor: pointer; }
  .err-list { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 6px; }
  .err-item { font-size: .9rem; line-height: 1.35; padding: 6px 8px; border-radius: 8px; background: var(--card); border: 1px solid #F0B8AA; overflow-wrap: anywhere; }
  .err-item.copyable { cursor: pointer; }
  .err-details { display: block; margin-top: 6px; font: .74rem/1.35 ui-monospace, Menlo, Consolas, monospace;
    color: #5A3A33; white-space: pre-wrap; overflow-wrap: anywhere; }
  .err-item.copied { background: #E8F4EA; border-color: #9CCBA5; }
  .err-hint { margin: 2px 0 0; font-size: .8rem; color: #7A3A2C; }
  .deploy-tag { font-family: system-ui, -apple-system, sans-serif; font-size: .72rem; font-weight: 700; vertical-align: middle;
    margin-left: 6px; padding: 2px 7px; border-radius: 999px; color: #fff; background: #B84028; }
  .deploy-tag.stable { background: #3C5AA0; }
  /* "A new version is ready" notice (informational, so tapping it doesn't copy) */
  .update-note {
    position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 25;
    max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 2px solid var(--teal); border-radius: 12px; padding: 10px 12px;
    box-shadow: 0 6px 24px rgba(34,48,60,.2); font-size: .95rem;
  }
  .update-note span { flex: 1; }
  .update-note .btn { padding: 9px 14px; font-size: .95rem; }
  .info-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 12px; }
  .info-row .chipbtn { font-size: .82rem; padding: 5px 12px; }
  .info-modal { position: fixed; inset: 0; z-index: 40; background: rgba(10,16,20,.45); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
  .info-card { background: var(--card); color: var(--ink); width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto;
    border-radius: 16px; padding: 16px 18px calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .info-card h2 { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 1.25rem; margin: 0 0 8px; }
  .info-card h3 { font-size: 1rem; margin: 14px 0 4px; }
  .info-card p, .info-card li { font-size: .92rem; line-height: 1.45; margin: 0 0 8px; }
  .info-card ul { padding-left: 20px; margin: 0 0 8px; }
  .info-card .fine { color: var(--muted); font-size: .85rem; }
  .info-close { display: flex; justify-content: flex-end; margin-top: 8px; }
  .backup-note { color: var(--warn); }
  /* Warm-up: find the note */
  .warm { margin: 0 0 16px; background: var(--card); border: 1px solid var(--line-soft); border-radius: 14px; padding: 6px 16px; }
  .warm[open] { padding-bottom: 14px; }
  .warm > summary { font-weight: 600; color: var(--teal); }
  .warm-body { display: grid; gap: 10px; padding-top: 4px; }
  .warm-body .hint { margin: 0; }
  .warm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .warm-row .dv-label { margin-right: 2px; }
  .warm-count { margin: 0; color: var(--muted); font-size: .88rem; }
  .wq-note { font-size: 3rem; font-weight: 700; line-height: 1.1; text-align: center; color: var(--ink); min-height: 1.2em; }
  .wq-note.is-do { color: var(--gold-text); }
  .wq-note svg { width: 1.3em; height: 1em; vertical-align: -.1em; fill: currentColor; overflow: visible; }
  .wq-note .wq-acc { font-size: .8em; line-height: 0; vertical-align: .1em; margin-left: 2px; }
  .wq-note .wq-sy { margin-left: .2em; }
  .wq-note.only-shape .wq-sy, .wq-note.only-syl .wq-sh, .wq-note.only-syl .wq-acc { display: none; }
  .wq-note .wq-sh + .wq-acc + .wq-sy { margin-left: .25em; }
  .wq-key, .wq-answer { margin: 0; text-align: center; }
  .wq-key { color: var(--muted); font-size: .92rem; }
  .wq-answer { font-size: 1.15rem; font-weight: 600; }
  .wq-answer .wq-oct { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); }
  .warm-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .warm-actions[hidden], .wq-answer[hidden], .warm-row[hidden], .warm-hear[hidden] { display: none; }
  /* the key, big, at the top of the warm-up */
  .wq-keytop { margin: 2px 0 0; padding: 8px 12px; text-align: center; background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 10px; }
  .wq-keytop b { display: block; font-size: 1.45rem; line-height: 1.2; color: var(--ink); }
  .wq-keytop span { display: block; font-size: .88rem; color: var(--muted); }
  .warm-hear { display: grid; gap: 10px; }
  .wq-choices { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .wq-choice { font: inherit; font-weight: 650; font-size: 1.05rem; min-width: 52px; height: 40px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--teal-soft); color: var(--teal); cursor: pointer; }
  .wq-choice svg { width: 1.25em; height: .95em; vertical-align: -.08em; fill: currentColor; overflow: visible; }
  .wq-choice .wq-acc { font-size: 1.1em; line-height: 0; margin-left: 1px; }
  .wq-choice .wq-sh + .wq-acc + .wq-sy { margin-left: 4px; }
  .wq-choices.only-shape .wq-sy, .wq-choices.only-syl .wq-sh, .wq-choices.only-syl .wq-acc { display: none; }
  .wq-choice.do { color: var(--gold-text); }
  .wq-choice.wrong { opacity: .35; text-decoration: line-through; }
  .wq-choice.right { background: var(--teal); color: var(--on-teal); border-color: var(--teal); }
  .hooks { width: 100%; border-collapse: collapse; margin: 4px 0 10px; }
  .hooks td { padding: 6px 4px; border-top: 1px solid var(--line-soft); vertical-align: middle; font-size: .92rem; line-height: 1.35; }
  .hooks td.hk-shape { width: 2.2em; text-align: center; }
  .hooks td.hk-syl { width: 2.6em; font-weight: 650; }
  .hooks svg { width: 1.6em; height: 1.25em; fill: currentColor; overflow: visible; vertical-align: middle; }
  /* Chord symbols above the chips (html[data-chords] says which style, or off) */
  /* The name is in the flow, so it takes up its width (the next note moves over
     rather than the names overlapping), but has no height: it's lifted above the chip. */
  .chw { display: inline-flex; flex-direction: column; align-items: flex-start; }
  .chd { display: block; height: 0; position: relative; top: calc(-1em - 4px); padding-right: 6px; font-size: .78rem; font-weight: 700; line-height: 1;
    color: var(--ink); white-space: nowrap; pointer-events: none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .chd sup { font-size: .75em; vertical-align: .45em; line-height: 0; }
  .chs { display: inline-flex; flex-direction: column; align-items: flex-start; align-self: center; font-weight: 700; color: var(--muted); padding: 0 2px; }
  .chs .chd { top: calc(-1em - 5.5px); }
  .ngrp { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  html[data-chords="off"] .chd, html[data-chords="off"] .chs { display: none; }
  html:not([data-chords="off"]) .notes, html:not([data-chords="off"]) .all-line { row-gap: 30px; padding-top: 16px; }
  /* a little more room above the names, so the highlighted line's edge clears them */
  html:not([data-chords="off"]) .all-line { padding-top: 23px; }
  html:not([data-chords="off"]) #allNotes.lyrics-only .all-line { padding-top: 0; }
  #allNotes.lyrics-only .chs, #allNotes.lyrics-only .chd, #allNotes.lyrics-only .chw, #allNotes.lyrics-only .ngrp { display: none; }
  /* Lyric syllables in Play along: the one being sung lights up; a syllable on
     a bar's first beat is bold, a pickup syllable lighter */
  .syl { border-radius: 4px; transition: background .08s; }
  .syl.db { font-weight: 700; }
  .syl.pkl { opacity: .72; }
  /* a held syllable's extender line: about half an em for each extra note */
  .hold { display: inline-flex; gap: 2px; margin: 0 2px; vertical-align: .05em; }
  .hseg { display: inline-block; width: .5em; height: 0; border-bottom: 2px solid var(--muted); opacity: .7; }
  /* each segment lights as its note starts, and stays lit to the end of the syllable */
  .hseg.on { border-bottom: 3px solid var(--teal); opacity: 1; }
  html[data-holds="off"] .hold { display: none; }
  .syl.on { background: var(--teal); color: var(--on-teal); opacity: 1; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  /* The song plan: verse buttons, each followed by its chorus toggle */
  .plan { margin: 4px 0 10px; }
  .plan[hidden], .plan-chorus[hidden] { display: none; }
  .plan-chorus { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .plan-row { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; }
  .plan-pair { display: inline-flex; gap: 2px; align-items: center; margin-right: 6px; }
  .pv, .pc { font: inherit; font-weight: 650; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); }
  .pv { min-width: 34px; height: 34px; background: var(--teal); color: var(--on-teal); border-color: var(--teal); }
  .pv.off { background: transparent; color: var(--muted); text-decoration: line-through; border-style: dashed; }
  .pc { min-width: 26px; height: 26px; font-size: .78rem; background: transparent; color: var(--muted); border-style: dashed; padding: 0 4px; }
  .pc.on { background: var(--gold-soft); color: var(--gold-text); border: 1px solid var(--gold-line); }
  .pc.last { cursor: default; }
  .pc[hidden] { display: none; }
  .count-bars { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 6px 0 10px; }
  .count-bars select { width: auto; }
  .count-bars .hint { flex-basis: 100%; margin: 0; }
  .ver { font-family: system-ui, -apple-system, sans-serif; font-size: .8rem; font-weight: 500; color: var(--muted); vertical-align: middle; margin-left: 4px; }

<body>
<main>
  <h1><span data-s="app.name"></span> <span class="ver">v0.90</span><span class="deploy-tag" id="deployTag" hidden></span></h1>
  <div class="info-row">
    <button class="chipbtn" id="aboutBtn" data-s="info.about"></button>
    <button class="chipbtn" id="historyBtn" data-s="info.history"></button>
    <button class="chipbtn" id="creditsBtn" data-s="info.credits"></button>
    <button class="chipbtn" id="helpBtn" data-s="info.help"></button>
  </div>
  <div class="song-row">
    <label for="songSel" data-s="ui.song"></label>
    <select id="songSel"></select>
  </div>
  <button class="pitch-note" id="pitchNote" hidden></button>
  <details class="warm" id="warmPanel">
    <summary data-s="warm.title"></summary>
    <div class="warm-body">
      <p class="wq-keytop" id="warmKeyTop"></p>
      <p class="hint" id="warmIntro"></p>
      <div class="warm-row" role="group" data-s-aria-label="warm.modeAria">
        <span class="dv-label" data-s="warm.mode"></span>
        <button class="wo" data-wmode="see" data-s="warm.modeSee"></button><button class="wo" data-wmode="hear" data-s="warm.modeHear"></button>
        <input type="hidden" id="warmMode" value="see">
      </div>

function T(key, vars) {
  const [group, name] = key.split(".");
  let text = STRINGS[group] && STRINGS[group][name];
  if (typeof text !== "string") { reportError(STRINGS.err.missingText.replace("{key}", key)); return key; }
  return text.replace(/\{(\w+)\}/g, (all, v) => {
    if (vars && v in vars) return String(vars[v]);
    reportError(T("err.missingValue", { key, name: v }));
    return all;
  });
}
// Picks the "1 thing" or "n things" form of a text.
const TN = (n, oneKey, manyKey, vars) => T(n === 1 ? oneKey : manyKey, Object.assign({ n }, vars));
function applyStrings(root) {
  root.querySelectorAll("[data-s]").forEach(el => { el.textContent = T(el.dataset.s); });
  root.querySelectorAll("[data-s-html]").forEach(el => { el.innerHTML = T(el.dataset.sHtml); });
  for (const attr of ["aria-label", "placeholder", "title", "label"]) {
    const data_attr = "data-s-" + attr;
    root.querySelectorAll(`[${data_attr}]`).forEach(el => el.setAttribute(attr, T(el.getAttribute(data_attr))));
  }
}

// ---------- Which deployment is this? ----------
// The same file runs in three folders on GitHub Pages: melodies-by-ear/
// (latest), melodies-by-ear-dev/ and melodies-by-ear-stable/. They share one
// web origin, and browser storage is per origin, not per folder, so dev and
// stable prefix their storage keys (as Remember does) to keep data apart.
const DEPLOYMENT = /\/melodies-by-ear-dev\//.test(location.pathname) ? "dev"
                 : /\/melodies-by-ear-stable\//.test(location.pathname) ? "stable" : "main";
const STORE_PREFIX = DEPLOYMENT === "main" ? "" : DEPLOYMENT + ":";
const storageKey = key => STORE_PREFIX + key;

// ---------- Loud errors ----------
// During alpha testing every failure shows a banner that stays until it's
// dismissed (a fading toast is too easy to miss). Tapping a message copies it,
// so it can be pasted to Claude, except messages about the clipboard itself,
// since copying them would overwrite what the person was trying to copy.
// Every report also shows (and copies) the technical context: app version,
// deployment, installed app or browser tab, time, page and browser identity.
// opts.details: extra technical lines (where, stack trace) shown under the message.
const shownErrors = new Set();
function appVersion() {
  const ver = document.querySelector("h1 .ver");
  return ver ? ver.textContent : "(unknown version)";
}
function errorContext() {
  const installed = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  return T("err.context", {
    version: appVersion(), deployment: DEPLOYMENT, mode: T(installed ? "err.modeApp" : "err.modeBrowser"),
    time: new Date().toISOString(), page: location.href, ua: navigator.userAgent
  });
}
function reportError(message, opts) {
  const copy = !(opts && opts.noCopy);
  const details = [opts && opts.details, errorContext()].filter(Boolean).join("\n");
  const fullText = message + "\n\n" + details;
  console.error("[Melodies by Ear] " + fullText);
  const dedupKey = message + "\n" + ((opts && opts.details) || "");
  if (shownErrors.has(dedupKey)) return;          // the same problem once is enough
  shownErrors.add(dedupKey);
  const box = document.getElementById("errBox"), list = document.getElementById("errList");
  if (!box || !list) { alert(fullText); return; }
  const item = document.createElement("li");
  item.className = "err-item" + (copy ? " copyable" : "");
  const msgEl = document.createElement("span");
  msgEl.className = "err-msg"; msgEl.textContent = message;
  const detailsEl = document.createElement("span");
  detailsEl.className = "err-details"; detailsEl.textContent = details;
  item.append(msgEl, detailsEl);
  if (copy) {
    item.setAttribute("role", "button"); item.tabIndex = 0;
    const copyIt = () => copyText(fullText).then(ok => {
      if (ok) { item.classList.add("copied"); setHint(T("err.copied")); }
    });
    item.addEventListener("click", copyIt);
    item.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); copyIt(); } });
  }
  list.appendChild(item);
  setHint(copy ? T("err.hint") : T("err.hintNoCopy"));
  box.querySelector("strong").textContent = T("err.title");
  box.hidden = false;
  function setHint(t) { document.getElementById("errHint").textContent = t; }
}
function dismissErrors() {
  document.getElementById("errBox").hidden = true;
  document.getElementById("errList").innerHTML = "";
  shownErrors.clear();
}
// Describes any thrown value: an Error's name, message and stack, or the raw value.
function describeThrown(value) {
  if (value instanceof Error || (value && typeof value === "object" && "message" in value && "stack" in value)) {
    return { msg: `${value.name || "Error"}: ${value.message}`, stack: value.stack || "" };
  }
  let text;
  try { text = typeof value === "string" ? value : JSON.stringify(value); } catch (e) { text = String(value); }
  return { msg: T("err.valueType", { type: value === null ? "null" : typeof value, value: text }), stack: "" };
}
// Safari raises this exact hidden error on EVERY page that listens for errors
// when its Share button is tapped, even a blank test page (errorprobe-v1.html,
// 2026-11-02). It is the only error the app ignores, and only when every field
// matches exactly; anything different still gets the full banner.
const isSafariShareSheetError = e =>
  e.message === "Script error." && e.filename === "" && e.lineno === 0 && e.colno === 0 && e.error == null;
window.addEventListener("error", e => {
  if (isSafariShareSheetError(e)) { console.warn("[Melodies by Ear] " + T("err.ignoredShareSheet")); return; }
  // A bare "Script error." with no file means the browser hid an error from
  // code that isn't this page's own (an extension, a content blocker, the
  // browser itself). There is nothing more to read, so say so plainly.
  if (!e.filename && !e.error && /^Script error\.?$/i.test(e.message || "")) {
    reportError(T("err.hiddenScriptError", { msg: e.message }));
    return;
  }
  const thrown = e.error ? describeThrown(e.error) : { msg: e.message, stack: "" };
  const lines = [T("err.uncaughtWhere", { file: e.filename || "?", line: e.lineno || "?", col: e.colno || "?" })];
  if (thrown.stack) lines.push(T("err.stack", { stack: thrown.stack }));
  reportError(T("err.uncaught", { msg: thrown.msg || e.message }), { details: lines.join("\n") });
});
window.addEventListener("unhandledrejection", e => {
  const thrown = describeThrown(e.reason);
  reportError(T("err.rejection", { msg: thrown.msg }), { details: thrown.stack ? T("err.stack", { stack: thrown.stack }) : "" });
});

// Copies text to the clipboard. Resolves to true if it worked. Never reports
// a copy failure through a copyable message (that would overwrite the clipboard).
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}


// ---------- Saved data (this browser only) ----------
// All storage goes through these four, so a failure is never silent, and
// every key gets this deployment's prefix in exactly one place.
function storeGet(key) {
  try { return localStorage.getItem(storageKey(key)); }
  catch (e) { reportError(T("err.storageRead", { key, msg: e.message })); return null; }
}
function storeGetJSON(key) {
  const raw = storeGet(key);
  if (raw === null) return null;
  try { return JSON.parse(raw); }
  catch (e) { reportError(T("err.storageCorrupt", { key, msg: e.message })); return null; }
}
function storeSet(key, value) {
  try { localStorage.setItem(storageKey(key), value); return true; }
  catch (e) { reportError(T("err.storageWrite", { key, msg: e.message })); return false; }
}
function storeRemove(key) {
  try { localStorage.removeItem(storageKey(key)); return true; }
  catch (e) { reportError(T("err.storageWrite", { key, msg: e.message })); return false; }
}

// ---------- Melody data ----------
// Durations are in eighth notes. Notes in ( ) are pickups.
// Octave marks, the usual way: no mark is the octave from do up to ti; each
// ' after a syllable is an octave higher (do', do''); each , an octave lower
// (so, la,, ). On screen a low mark shows as a lowered apostrophe.
const STEP = { do: 0, di: 1, ra: 1, re: 2, ri: 3, me: 3, mi: 4, fa: 5, fi: 6, se: 6,
               so: 7, si: 8, le: 8, la: 9, li: 10, te: 10, ti: 11 };
// Half steps from do, or null for a syllable the app doesn't know.
function pitchOf(syl) {
  const m = /^([a-z]+)('*|,*)$/.exec(syl || "");
  if (!m || !(m[1] in STEP)) return null;
  return STEP[m[1]] + 12 * (m[2][0] === "," ? -m[2].length : m[2].length);
}
const sylBase = syl => syl.replace(/['，,]+$/, "");
// The octave mark, for display: high marks as they are, low marks lowered.
function markHTML(syl) {
  const mark = syl.slice(sylBase(syl).length);
  if (!mark) return "";
  return mark[0] === "," ? `<span class="ol">${"'".repeat(mark.length)}</span>` : `<span class="oh">${mark}</span>`;
}

// sessions sound brighter and others duller, because the sounds are rebuilt
// whenever the audio restarts. Now the noise comes from a fixed "recipe" per
// note: we try 9 recipes, measure how bright each one is, and keep the middle
// one. So every note has a typical, steady tone, the same every session.
function seededNoise(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function excitation(N, passes, freq) {
  const candidates = [];
  for (let c = 0; c < 9; c++) {
    const rnd = seededNoise(Math.round(freq * 100) * 31 + c * 7919 + passes);
    let ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = rnd() * 2 - 1;
    for (let p = 0; p < passes; p++) {
      const r2 = new Float32Array(N);
      for (let i = 0; i < N; i++) r2[i] = (ring[i] + ring[(i + 1) % N]) / 2;
      ring = r2;
    }
    const mean = ring.reduce((a, b) => a + b, 0) / N;
    for (let i = 0; i < N; i++) ring[i] -= mean;
    // brightness: how much the wave jumps sample to sample, relative to its size
    let edge = 0, size = 0;
    for (let i = 0; i < N; i++) { edge += Math.abs(ring[i] - ring[(i + 1) % N]); size += Math.abs(ring[i]); }
    candidates.push({ ring, bright: edge / (size || 1) });
  }
  candidates.sort((a, b) => a.bright - b.bright);
  return candidates[4].ring;
}

function makePluck(freq, timbre) {
  const key = freq.toFixed(3) + timbre;
  if (cache.has(key)) return cache.get(key);
  const sr = ctx.sampleRate;
  const N = Math.max(2, Math.floor(sr / freq - 0.5));
  const rate = freq / (sr / (N + 0.5));
  const dur = timbre === "uke" ? 2.2 : 3.0;
  const decay = timbre === "uke" ? 0.994 : 0.997;
  const passes = timbre === "uke" ? 3 : 1;
  const len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(1, len, sr);
  const out = buf.getChannelData(0);
  const ring = excitation(N, passes, freq);
  for (let i = 0; i < len; i++) {
    const idx = i % N, nxt = (idx + 1) % N;
    out[i] = ring[idx];
    ring[idx] = decay * 0.5 * (ring[idx] + ring[nxt]);
  }
  let peak = 0;
  for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(out[i]));
  const fadeStart = len - Math.floor(sr * 0.15);
  for (let i = 0; i < len; i++) {
    out[i] /= (peak || 1);
    if (i > fadeStart) out[i] *= (len - i) / (len - fadeStart);
  }
  const res = { buf, rate };
  cache.set(key, res);
  return res;
}

const windWaves = new Map();
function windWave(type) {
  const hit = windWaves.get(type);

  const p = WINDS[type].partials;
  const real = new Float32Array(p.length + 1), imag = new Float32Array(p.length + 1);
  p.forEach((a, i) => { imag[i + 1] = a; });
  const wave = ctx.createPeriodicWave(real, imag);

let noiseBuf = null;

  if (noiseBuf && noiseBuf.sampleRate === ctx.sampleRate && noiseBuf.ctxRef === ctx) return noiseBuf;
  const len = ctx.sampleRate * 2;
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  const rnd = seededNoise(12345);
  for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;

}
function windAt(midi, when, holdSec, type) {
  const w = WINDS[type];

  // a tiny gap before the next note, so repeated notes are tongued separately
  const end = when + Math.max(0.06, holdSec - 0.035);
  const voices = w.voices || [0];
  const oscs = voices.map(c => {
    const o = ctx.createOscillator();
    o.setPeriodicWave(windWave(type));
    o.frequency.value = freq; o.detune.value = c;
    return o;
  });
  const osc = { connect: n => oscs.forEach(o => o.connect(n)), start: t => oscs.forEach(o => o.start(t)),

    const lfo = ctx.createOscillator(), depth = ctx.createGain();
    lfo.frequency.value = w.vib.rate;

    depth.gain.setValueAtTime(0, when + w.vib.delay);
    depth.gain.linearRampToValueAtTime(amount, when + w.vib.delay + 0.3);
    oscs.forEach(o => depth.connect(o.frequency));
    lfo.connect(depth);

  const shaped = toneChain(w, cutoff);

// Shapes the raw tone. Winds/brass: a lowpass plus optional peaks.
// Bowed strings: a highpass, then the body resonances in parallel (plus a
// little of the direct sound), then a gentle top-end lowpass.
// Returns { input, output, lp } — lp is the filter whose cutoff can follow the note.
function toneChain(w, cutoff) {
  if (w.bowed) {
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = w.bowed.hp; hp.Q.value = 0.7;
    const sum = ctx.createGain();
    for (const [f, gain, q] of w.bowed.formants) {
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
      const g = ctx.createGain(); g.gain.value = gain;
      hp.connect(bp).connect(g).connect(sum);
    }
    const dry = ctx.createGain(); dry.gain.value = w.bowed.dry;
    hp.connect(dry).connect(sum);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = w.q; lp.frequency.value = cutoff;
    sum.connect(lp);
    return { input: hp, output: lp, lp };
  }
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = w.q; lp.frequency.value = cutoff;
  let out = lp;
  for (const pkDef of [...(w.peak ? [w.peak] : []), ...(w.body || [])]) {
    const pk = ctx.createBiquadFilter();
    pk.type = "peaking"; pk.frequency.value = pkDef.f; pk.gain.value = pkDef.gain; pk.Q.value = pkDef.q;
    out.connect(pk); out = pk;
  }
  return { input: lp, output: out, lp };
}
// A slight pulse in volume that goes with the vibrato (bowed strings)
function tremoloNode(w, when, end) {
  const node = ctx.createGain(); node.gain.value = 1;
  if (!w.trem) return node;
  const lfo = ctx.createOscillator(), depth = ctx.createGain();
  lfo.frequency.value = w.vib ? w.vib.rate : 5.5;
  depth.gain.setValueAtTime(0, when);
  depth.gain.setValueAtTime(0, when + (w.vib ? w.vib.delay : 0.15));
  depth.gain.linearRampToValueAtTime(w.trem, when + (w.vib ? w.vib.delay : 0.15) + 0.3);
  lfo.connect(depth).connect(node.gain);
  lfo.start(when); lfo.stop(end + 0.4);
  activeNodes.push(lfo);
  return node;
}

// The sound of the bow catching the string: a brief, soft scrape of
// filtered noise at the start of each bow stroke.
function bowScrape(when, freq, amount) {
  const n = ctx.createBufferSource(); n.buffer = breathNoise();
  const hp = ctx.createBiquadFilter(); hp.type = "bandpass";
  hp.frequency.value = Math.min(5000, Math.max(1800, freq * 5)); hp.Q.value = 0.9;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(amount, when + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
  n.connect(hp).connect(g).connect(ctx.destination);
  n.start(when, Math.random() * 1.5); n.stop(when + 0.1);
  activeNodes.push(n);
}

// Legato: the whole run of notes is ONE continuous sound that changes pitch
// at each note, the way a player slurs, so nothing overlaps. A repeated
// note gets a brief dip in volume so you still hear it as a new note.
// events: [{ midi, t, dur }] in time order.
function legatoVoice(events, type) {
  if (!events.length) return;
  const w = WINDS[type];
  const first = events[0], last = events[events.length - 1];
  const start = first.t, end = last.t + Math.max(0.06, last.dur - 0.035);
  const f0 = freqOf(first.midi);

  const oscs = voices.map(c => {
    const o = ctx.createOscillator();
    o.setPeriodicWave(windWave(type));
    o.frequency.setValueAtTime(f0, start); o.detune.value = c;
    return o;
  });

  const osc = {
    connect: n => oscs.forEach(o => o.connect(n)),
    start: t => oscs.forEach(o => o.start(t)),
    stop: t => oscs.forEach(o => o.stop(t)),
    frequency: {
      setValueAtTime: (v, t) => oscs.forEach(o => o.frequency.setValueAtTime(v, t)),
      exponentialRampToValueAtTime: (v, t) => oscs.forEach(o => o.frequency.exponentialRampToValueAtTime(v, t))
    }
  };
  const shaped = toneChain(w, 1000);
  const lp = shaped.lp;
  const g = ctx.createGain();
  const levelFor = m => w.level * (0.8 + 0.2 * Math.min(1.6, 330 / freqOf(m))) / Math.sqrt(voices.length);
  const cutFor = m => Math.min(w.lowpass, Math.max(freqOf(m) * (w.track || 6), 1200));
  if (w.swell) {
    lp.frequency.setValueAtTime(Math.min(w.swell.from, cutFor(first.midi)), start);
    lp.frequency.exponentialRampToValueAtTime(cutFor(first.midi), start + w.swell.time);
  } else lp.frequency.setValueAtTime(cutFor(first.midi), start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(levelFor(first.midi), start + w.attack);
  events.forEach((e, i) => {
    if (i === 0) return;
    const prev = events[i - 1];
    const f = freqOf(e.midi), lvl = levelFor(e.midi);
    if (e.midi === prev.midi) {
      if (w.scrape) bowScrape(e.t, f, w.scrape * 0.7);
      // same note again: a quick dip, like a light re-tongue or bow change
      g.gain.setValueAtTime(levelFor(prev.midi), e.t - 0.035);
      g.gain.linearRampToValueAtTime(levelFor(prev.midi) * 0.3, e.t - 0.004);
      g.gain.linearRampToValueAtTime(lvl, e.t + 0.03);
    } else {
      // move to the new pitch: winds slide very briefly, so it sounds
      // connected; bowed strings change instantly, like a finger on the string
      if (w.slide === 0) {
        osc.frequency.setValueAtTime(f, e.t);
      } else {
        const gl = w.glide || 0.022;
        osc.frequency.setValueAtTime(freqOf(prev.midi), e.t - gl / 2);
        osc.frequency.exponentialRampToValueAtTime(f, e.t + gl / 2);
      }
      g.gain.setValueAtTime(levelFor(prev.midi), e.t - 0.012);
      g.gain.linearRampToValueAtTime(lvl, e.t + 0.04);
      lp.frequency.setValueAtTime(cutFor(prev.midi), e.t - 0.012);
      lp.frequency.linearRampToValueAtTime(cutFor(e.midi), e.t + 0.01);
    }

  g.gain.exponentialRampToValueAtTime(0.0001, end + w.release);

  const trem = tremoloNode(w, start, end);
  shaped.output.connect(trem);
  trem.connect(g).connect(ctx.destination);
  osc.start(start); osc.stop(end + w.release + 0.05);
  activeNodes.push(...oscs);
  if (w.scrape) bowScrape(start, f0, w.scrape);
  if (w.vib) {
    // vibrato that eases in after each new pitch, as players do
    const lfo = ctx.createOscillator(), depth = ctx.createGain();
    lfo.frequency.value = w.vib.rate;
    events.forEach(e => {
      const amount = freqOf(e.midi) * (Math.pow(2, w.vib.cents / 1200) - 1);
      depth.gain.setValueAtTime(0, e.t);
      if (e.dur > w.vib.delay + 0.1) {
        depth.gain.setValueAtTime(0, e.t + w.vib.delay);
        depth.gain.linearRampToValueAtTime(amount, e.t + Math.min(e.dur - 0.02, w.vib.delay + 0.3));
      }
    });
    oscs.forEach(o => depth.connect(o.frequency));
    lfo.connect(depth);
    lfo.start(start); lfo.stop(end + w.release + 0.05);
    activeNodes.push(lfo);
  }
  if (w.breath) {
    const n = ctx.createBufferSource(); n.buffer = breathNoise(); n.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = Math.min(6000, f0 * 3); bp.Q.value = 0.8;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, start);
    ng.gain.exponentialRampToValueAtTime(w.breath * 2.5, start + 0.02);
    ng.gain.exponentialRampToValueAtTime(w.breath, start + 0.12);
    ng.gain.setValueAtTime(w.breath, end);
    ng.gain.exponentialRampToValueAtTime(0.0001, end + w.release);
    n.connect(bp).connect(ng).connect(ctx.destination);
    n.start(start, Math.random() * 1.5); n.stop(end + w.release + 0.05);
    activeNodes.push(n);
  }
}

// ---------- Piano ----------
// A struck string: overtones slightly stretched (as real piano strings are),
// each fading at its own rate (higher ones faster, higher notes faster), plus
// a soft hammer "thunk". Built once per pitch and reused, like the ukulele.
const pianoCache = new Map();
function makePiano(freq) {
  const key = freq.toFixed(3) + "|" + ctx.sampleRate;
  const hit = pianoCache.get(key);
  if (hit && hit.ctx === ctx) return hit.buf;
  const sr = ctx.sampleRate, dur = 3.2, len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(1, len, sr), out = buf.getChannelData(0);
  const B = 0.00035;                                  // string stiffness (stretches overtones)
  const pitchFactor = Math.pow(freq / 261.6, 0.6);     // higher notes fade faster
  const rnd = seededNoise(Math.round(freq * 10));
  for (let n = 1; n <= 14; n++) {
    const fn = n * freq * Math.sqrt(1 + B * n * n);
    if (fn > sr / 2 - 500) break;
    const amp = Math.pow(n, -1.15) * (n === 1 ? 1 : 0.9) * (1 + 0.15 * Math.sin(n * 1.7));
    const decay = 1.6 * pitchFactor * (1 + 0.35 * (n - 1));     // per second (shortened in v0.36 and v0.37)
    const phase = rnd() * 6.283;
    const w = 2 * Math.PI * fn / sr;
    for (let i = 0; i < len; i++) out[i] += amp * Math.exp(-decay * i / sr) * Math.sin(w * i + phase);
  }
  // hammer: a short, soft thump of low noise at the very start
  let lpState = 0;
  const thump = Math.floor(sr * 0.03);
  for (let i = 0; i < thump; i++) {
    lpState += 0.08 * ((rnd() * 2 - 1) - lpState);
    out[i] += lpState * 1.6 * (1 - i / thump);
  }
  // quick attack and normalize
  let peak = 0;

// ---------- Highlights that follow the sound ----------
// Highlights follow the audio clock rather than a separate timer, so they
// wait for the sound if the phone starts it late. Two iPhone quirks matter:
// 1. Its audio clock often moves in jumps instead of smoothly, so we smooth
//    it, using the phone's "what is being heard right now" timestamp when it
//    offers one.
// 2. A jump can skip right over a short highlight, so instead of asking
//    "is this one on right now?", each group (beat dots, note syllables)
//    lights its most recent event and holds it long enough to see.
let visuals = [];          // { el, group, start, end } in audio-clock seconds
let rafId = null;
const MIN_HOLD_MS = 120;
let lastCT = -1, lastCTwall = 0, lastHeard = 0, heardCtx = null;

function showAt(el, when, dur) {
  const group = el.dataset.g || (el.classList.contains("lead-beat") ? "lead" : el.classList.contains("beat") ? "beat" : el.classList.contains("all-line") ? "line" : el.classList.contains("syl") ? "syl" : "note");
  visuals.push({ el, group, start: when, end: when + dur, shownAt: 0 });
  if (!rafId) rafId = requestAnimationFrame(drawVisuals);
}

function heardTime() {
  const wall = performance.now();
  const ct = ctx.currentTime;
  if (ctx !== heardCtx) { heardCtx = ctx; lastCT = -1; lastHeard = 0; }
  if (ct !== lastCT) { lastCT = ct; lastCTwall = wall; }
  const sinceTick = (wall - lastCTwall) / 1000;
  // If the clock hasn't moved for a while, the sound isn't playing yet
  // (or has paused): hold still rather than run ahead of it.
  const ahead = sinceTick > 0.35 ? 0 : sinceTick;
  const lag = (ctx.outputLatency || 0) + (ctx.baseLatency || 0);
  let t = ct + ahead - lag;
  try {
    if (ctx.getOutputTimestamp) {
      const ts = ctx.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
        const heard = ts.contextTime + (wall - ts.performanceTime) / 1000;
        t = Math.min(heard, ct + ahead);   // never ahead of the clock itself
      }
    }
  } catch (e) { reportError(T("err.audio", { where: "getOutputTimestamp", msg: e.message })); }
  lastHeard = Math.max(lastHeard, t);     // never step backwards
  return lastHeard;
}

function drawVisuals() {
  rafId = null;
  if (!ctx || !visuals.length) return;
  const now = heardTime() - (+$("visDelay").value) / 1000;
  const wall = performance.now();
  const keep = [];
  for (const group of ["beat", "lead", "note", "line", "syl", ...new Set(visuals.map(v => v.group).filter(g => g.startsWith("hold")))]) {
    const items = visuals.filter(v => v.group === group);
    // the latest event that has started
    let current = null;
    for (const v of items) if (v.start <= now && (!current || v.start > current.start)) current = v;
    if (current && !current.shownAt) current.shownAt = wall;
    const lit = current && (now < current.end || wall - current.shownAt < MIN_HOLD_MS) ? current : null;
    for (const v of items) {
      if (v !== lit && v.el !== (lit && lit.el)) v.el.classList.remove("on");
      // keep future events, and the current one until it's done showing
      if (v.start > now || v === lit) keep.push(v);
    }
    if (lit) lit.el.classList.add("on");
    if (group === "line" && lit && lit.el !== lastLineEl) { lastLineEl = lit.el; onLineChange(lit.el); }
  }
  visuals = keep;
  if (visuals.length) rafId = requestAnimationFrame(drawVisuals);
  else document.querySelectorAll(".n.on, .beat.on, .syl.on, .hseg.on").forEach(el => el.classList.remove("on"));
}

// ---------- Keep the screen on while playing ----------
// The phone may sleep in the middle of a song while you're playing your own
// instrument. A screen wake lock keeps it on while anything plays; the phone
// drops it when the app goes to the background, so it's asked for again on return.

async function updateWakeLock() {
  const want = wakeWanted && $("wakeOn").checked && document.visibilityState === "visible";
  const note = t => { $("wakeNote").textContent = t; $("wakeNote").hidden = !t; };
  if (!want) {
    if (wakeLock) { const w = wakeLock; wakeLock = null; w.release().catch(e => reportError(T("err.audio", { where: "wake lock release", msg: e.message }))); }
    return;
  }
  if (wakeLock) return;
  if (!("wakeLock" in navigator)) { note(T("ui.wakeUnsupported")); return; }
  try {
    const w = await navigator.wakeLock.request("screen");
    w.addEventListener("release", () => { if (wakeLock === w) wakeLock = null; });
    wakeLock = w; note("");
    if (!(wakeWanted && $("wakeOn").checked)) updateWakeLock();   // stopped while asking
  } catch (e) { note(T("ui.wakeFailed", { msg: e.message })); }
}

const TALK_SPEEDS = ["1", "1.25", "1.5", "2.0"];
const TALK_NUM = ["one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
const TALK_SWING_NUM = ["one", "twon", "threen", "fourn", "fiven"];
const TALK_DEFAULT_SWING = 67;
let talkWords = null, talkLoading = null;
const talkingOn = () => $("talkOn").checked;
// The standalone metronome can use its own meter; everything else uses the song's.
const METRO_METERS = {
  "2/4": { beats: 2, compound: false }, "3/4": { beats: 3, compound: false }, "4/4": { beats: 4, compound: false },
  "5/4": { beats: 5, compound: false }, "6/8": { beats: 2, compound: true }, "9/8": { beats: 3, compound: true },
  "12/8": { beats: 4, compound: true }
};
const songMeter = () => ({ beats: BEATS_PER_BAR, compound: METER.beatLen === 3 });
let playingMeter = null;                            // set only while Start metronome plays
const meterNow = () => playingMeter || songMeter();
const metroMenuMeter = () => METRO_METERS[$("metroMeter").value] || songMeter();
const talkCompound = () => meterNow().compound;     // 6/8, 9/8, 12/8: beats of three eighths

function talkDecode(audio, buf) {
  return new Promise((res, rej) => { const p = audio.decodeAudioData(buf, res, rej); if (p && p.then) p.then(res, rej); });
}
// Where the word's sound starts, where its vowel arrives (35% of its loudest),
// and where it ends, measured in 5 ms steps.
function talkAnalyse(buffer) {
  const x = buffer.getChannelData(0), hop = Math.max(1, Math.round(buffer.sampleRate * 0.005));
  const env = [];
  for (let i = 0; i + hop <= x.length; i += hop) { let sum = 0; for (let j = i; j < i + hop; j++) sum += x[j] * x[j]; env.push(Math.sqrt(sum / hop)); }
  const mx = Math.max(...env);
  if (!(mx > 0)) throw new Error("silent recording");
  let first = env.findIndex(v => v > mx * 0.03), beat = env.findIndex(v => v > mx * 0.35), last = env.length - 1;
  while (last > 0 && env[last] < mx * 0.02) last--;
  const t = f => f * hop / buffer.sampleRate;
  return { buffer, start: t(Math.max(0, first)), beatPoint: t(beat), end: Math.min(buffer.duration, t(last + 1)) };
}
// Decodes every recording once (with an offline engine, so it doesn't need the
// sound to be started); the decoded words work with any later sound engine.
function loadTalkWords() {
  if (talkWords || talkLoading) return talkLoading;
  const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const audio = Off ? new Off(1, 1, 44100) : (ensureAudio(), ctx);
  const b64ToBuf = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
  talkLoading = (async () => {
    const out = {};
    for (const [name, bySpeed] of Object.entries(TALK_CLIPS)) {
      out[name] = {};
      for (const sp of TALK_SPEEDS) out[name][sp] = talkAnalyse(await talkDecode(audio, b64ToBuf(bySpeed[sp])));
    }
    talkWords = out;
  })().catch(e => {
    talkLoading = null;
    reportError(T("talk.loadFailed", { msg: e && e.message || String(e) }));
  });
  return talkLoading;
}

// The "What to say" choices follow the song's meter.
function talkChoices(meter) {
  const nums = n => Array.from({ length: n }, (_, i) => i + 1).join(" ");
  if (meter.compound) return [
    ["all", T("talk.sayAll", { list: nums(meter.beats * 3) })],
    ["divided", T("talk.sayDivided")],
    ["beats", T("talk.sayBeats", { list: nums(meter.beats) })]
  ];
  return [
    ["beats", T("talk.sayBeats", { list: nums(meter.beats) })],
    ["eighths", T("talk.sayEighths")],
    ["swing", T("talk.saySwing")],
    ["swingDuh", T("talk.saySwingDuh")],
    ["triplets", T("talk.sayTriplets")],
    ["sixteenths", T("talk.saySixteenths")]
  ];
}
// The menu lists the choices for the meter Start metronome will use (the song's,
// unless Beats per measure says otherwise).
function fillTalkChoices(prefer) {
  const keep = prefer || $("talkSay").value, meter = metroMenuMeter();
  $("talkSay").innerHTML = talkChoices(meter).map(([v, label]) => `<option value="${v}">${esc(label)}</option>`).join("");
  $("talkSay").value = talkHow(meter.compound, keep);
}
// A choice made for one kind of meter, used in the other kind: the nearest match.
function talkHow(compound, how) {
  if (compound) return ["all", "divided", "beats"].includes(how) ? how : how === "eighths" ? "all" : "divided";
  if (["beats", "eighths", "swing", "swingDuh", "triplets", "sixteenths"].includes(how)) return how;
  return how === "all" ? "eighths" : how === "divided" ? "triplets" : "beats";
}
const talkSwingChoice = () => !talkCompound() && /^swing/.test($("talkSay").value);
function renderTalkRows() {
  $("talkSwingRow").hidden = !talkSwingChoice();
  const sw = +$("talkSwing").value, nudge = +$("talkNudge").value;
  $("talkSwingVal").textContent = sw === 50 ? T("talk.swingStraight", { n: sw }) : sw === TALK_DEFAULT_SWING ? T("talk.swingDefault", { n: sw }) : T("units.pct", { n: sw });
  $("talkNudgeVal").textContent = nudge === 0 ? T("talk.nudgeOnTime") : T(nudge < 0 ? "talk.nudgeEarlier" : "talk.nudgeLater", { n: Math.abs(nudge) });
  $("talkVolVal").textContent = T("units.pct", { n: $("talkVol").value });
}

// The counts within one beat: { frac (0–1 of the beat), word, level, join }.
// pos is the beat's place in the measure (0 = beat 1).
function talkBeatCounts(pos) {
  const how = talkHow(talkCompound(), $("talkSay").value), beatWord = "t_" + TALK_NUM[pos];
  const beatLevel = pos === 0 ? "one" : "beat";
  const list = [{ frac: 0, word: beatWord, level: beatLevel }];
  const sub = (frac, w) => list.push({ frac, word: "t_" + w, level: "sub" });
  if (talkCompound()) {
    if (how === "all") { list[0].word = "t_" + TALK_NUM[pos * 3]; sub(1 / 3, TALK_NUM[pos * 3 + 1]); sub(2 / 3, TALK_NUM[pos * 3 + 2]); }
    else if (how === "divided") { sub(1 / 3, "and"); sub(2 / 3, "a"); }
    return list;
  }
  const up = +$("talkSwing").value / 100;
  if (how === "eighths") sub(0.5, "and");
  else if (how === "swing") sub(up, "and");
  else if (how === "swingDuh") {
    // "twon duh": the beat word runs straight into a relaxed "duh"
    if (TALK_SWING_NUM[pos]) list[0].word = "s_" + TALK_SWING_NUM[pos];
    list[0].join = true;
    list.push({ frac: up, word: "s_duh", level: "sub" });
  }
  else if (how === "triplets") { sub(1 / 3, "and"); sub(2 / 3, "a"); }
  else if (how === "sixteenths") { sub(0.25, "e"); sub(0.5, "and"); sub(0.75, "a"); }

}
function talkBeat(when, pos, beatSec) {
  const counts = talkBeatCounts(pos);
  counts.forEach((c, i) => {
    const next = counts[i + 1];
    const room = ((next ? next.frac : 1) - c.frac) * beatSec;
    talkWordAt(c.word, when + c.frac * beatSec, room, c.level, c.join && next ? next.word : null);
  });
}
// Plays one word so its vowel lands at `when`. `room` is the time until the
// next count. Squeeze picks the slowest version that ends before the next
// word starts; anything still too long fades out as the next count begins.
// joinTo (swing "twon duh"): the word instead lasts right up to the next
// word's first sound, with a short crossfade, so the two run together.
function talkWordAt(name, when, room, level, joinTo) {
  const w = talkWords[name];
  if (!w) { reportError(T("talk.noWord", { word: name })); return; }
  const lead = v => v.beatPoint - v.start, tail = v => v.end - v.beatPoint;
  const speed = +$("talkSpeed").value;
  const choices = TALK_SPEEDS.slice(speed).map(sp => w[sp]);   // the chosen speed or quicker
  let v = choices[0], playFor;
  if (joinTo && talkWords[joinTo]) {
    const gap = room - lead(talkWords[joinTo][TALK_SPEEDS[speed]]);
    const filling = choices.filter(x => tail(x) >= gap);
    v = filling.length ? filling[filling.length - 1] : choices[0];
    playFor = Math.min(v.end - v.start, lead(v) + gap + 0.025);
  } else {
    if ($("talkSqueeze").checked) v = choices.find(x => tail(x) <= room - 0.05) || choices[choices.length - 1];
    playFor = Math.min(v.end - v.start, room + lead(v) - 0.02);

  // meant to sound relaxed and lazy, so both are played softer

  const gain = levelGain * setGain * duhGain * (+$("talkVol").value / 100);

  src.buffer = v.buffer;

  g.gain.setValueAtTime(gain, startAt);
  g.gain.setValueAtTime(gain, fadeAt);
  g.gain.linearRampToValueAtTime(0.0001, fadeAt + 0.03);

}
// A change while Metronome only is running takes effect right away.

// Schedules one pass of a phrase starting at audio time t.
// Returns the time the pass is finished. In loop mode the pass always has a
// lead-in measure (clicked if count-in is on) and the last measure is filled
// out to a full bar, so every repeat lines up with the beat.
// opt.beat is one metronome beat in seconds (a quarter note in 4/4 or 3/4,
// a dotted quarter in 6/8); opt.eighth is an eighth note.
function schedulePass(phrase, t, opt) {
  const { beat, eighth, doMidi, countIn, clickAll, loop } = opt;
  const notes = phrase.items.filter(x => !x.bar);
  const pickup = pickupEighths(phrase.items);
  const total = notes.reduce((s, n) => s + n.dur, 0);

  // the count-in is opt.countBars measures; a loop without one gets a single
  // lead-in measure, except on Play along's first pass, which follows the
  // get-ready measures directly. Every lead-in measure clicks: a measure of
  // silence right before the music starts never helps.
  const leadBars = countIn ? (opt.countBars || 1) : loop && !opt.firstPass ? 1 : 0;
  const downbeat = leadBars ? t + leadBars * BEATS_PER_BAR * beat : t + pickup * eighth;
  for (let b = 0; b < leadBars * BEATS_PER_BAR; b++) clickAt(t + b * beat, b % BEATS_PER_BAR === 0, b % BEATS_PER_BAR, beat);
  if (opt.leadDots && leadBars) showLeadMeasure(t, beat, leadBars);

  const noteStart = downbeat - pickup * eighth;
  const phraseEnd = noteStart + total * eighth;
  const fullBars = Math.ceil((total - pickup) / METER.perBar - 1e-6);
  const barEnd = downbeat + fullBars * BEATS_PER_BAR * beat;
  const clickUntil = loop ? barEnd : phraseEnd;

  if (clickAll) {
    const firstBeat = leadBars ? 0 : -Math.floor(pickup / METER.beatLen);   // the lead-in already clicked the pickup's beats
    for (let k = firstBeat; downbeat + k * beat < clickUntil - 0.01; k++) {
      const pos = ((k % BEATS_PER_BAR) + BEATS_PER_BAR) % BEATS_PER_BAR;
      clickAt(downbeat + k * beat, pos === 0, pos, beat);
    }
  }

  const chips = opt.chips || [...document.querySelectorAll(opt.chipSel || "#notes .n")];
  if (chips.length !== notes.length) reportError(T("err.chipMismatch", { chips: chips.length, notes: notes.length }));
  opt.noteStart = noteStart;
  let nt = noteStart;
  const timbreNow = $("timbre").value;
  const legatoRun = WINDS[timbreNow] && $("legato").checked ? [] : null;
  notes.forEach((n, i) => {
    const dur = n.dur * eighth;
    // a tied note sounds once, for the length of all the notes tied to it
    let sound = dur;
    for (let j = i; notes[j].tie && notes[j + 1]; j++) sound += notes[j + 1].dur * eighth;
    const tiedOn = i > 0 && notes[i - 1].tie;
    if (opt.silent || tiedOn) { /* melody off, or the second half of a tie: highlights only */ }
    else if (legatoRun) legatoRun.push({ midi: doMidi + pitchOf(n.syl), t: nt, dur: sound });
    else pluckAt(doMidi + pitchOf(n.syl), nt, sound);
    const chip = chips[i];
    if (chip) {
      showAt(chip, nt, Math.max(0.05, dur - 0.03));
      if (chip._syl) showAt(chip._syl, nt, Math.max(0.05, dur - 0.03));
      if (chip._hold) {
        let end = nt + dur;
        for (let j = i + 1; j < notes.length && chips[j] && chips[j]._syl === chip._syl; j++) end += notes[j].dur * eighth;
        showAt(chip._hold, nt, Math.max(0.05, end - nt - 0.03));
      }
    }
    nt += dur;
  });
  if (legatoRun) legatoVoice(legatoRun, timbreNow);
  return loop ? barEnd : phraseEnd;
}

// What the user sees if the audio gets interrupted mid-play

// The whole melody is just the 16 phrases joined end to end. Each phrase
// already carries its own pickups, so joined together they rebuild the

const wholeItems = () => SEQ.flatMap(p => p.items);

// ---------- Seven-shape note heads ----------

// books): do a pointed triangle, re a half-moon, mi a diamond, fa a right
// triangle, sol an oval, la a rectangle, ti an "ice-cream cone". Drawn on a
// 26 × 20 grid, filled with the chip's text color, so they work in light and
// dark mode and light up with the chip.
const SHAPE_SVG = {
  do: '<polygon points="13,1 25,19 1,19"/>',
  re: '<path d="M1 4 H25 A12 12 0 0 1 1 4 Z"/>',
  mi: '<polygon points="13,0 25,10 13,20 1,10"/>',
  fa: '<polygon points="1,19 25,19 25,1"/>',
  sol: '<ellipse cx="13" cy="10" rx="12" ry="8.5"/>',

  ti: '<path d="M1 8 A12 7 0 0 1 25 8 L13 20 Z"/>'

const SHAPE_OF = {

  di: ["do", "♯"], ri: ["re", "♯"], fi: ["fa", "♯"], si: ["sol", "♯"], li: ["la", "♯"],
  ra: ["re", "♭"], me: ["mi", "♭"], se: ["sol", "♭"], le: ["la", "♭"], te: ["ti", "♭"]
};
// Jianpu: each syllable's number and its sharp or flat (written in front).
const NUM_OF = {
  do: ["", 1], re: ["", 2], mi: ["", 3], fa: ["", 4], so: ["", 5], la: ["", 6], ti: ["", 7],
  di: ["♯", 1], ri: ["♯", 2], fi: ["♯", 4], si: ["♯", 5], li: ["♯", 6],
  ra: ["♭", 2], me: ["♭", 3], se: ["♭", 5], le: ["♭", 6], te: ["♭", 7]

function numHTML(syl) {
  const base = sylBase(syl), mark = syl.slice(base.length), nm = NUM_OF[base];
  if (!nm) return "";
  const dots = "•\n".repeat(mark.length).trim();
  const oct = !mark ? "" : mark[0] === "," ? ` data-down="${dots}"` : ` data-up="${dots}"`;
  return `<span class="nm">${nm[0] ? `<span class="nm-acc">${nm[0]}</span>` : ""}<span class="nm-d"${oct}>${nm[1]}</span></span>`;
}
const shapeSVG = name => `<svg viewBox="0 0 26 20" aria-hidden="true">${SHAPE_SVG[name]}</svg>`;
// A chip's inside: its shape (hidden unless shapes are on), then the syllable.
// The octave mark comes after the syllable (or the shape, in Shapes only).
function chipInner(syl) {
  const base = sylBase(syl);
  const sh = SHAPE_OF[base];
  if (!sh) { reportError(T("err.noShape", { syl })); return `<span class="sy">${syl}</span>`; }
  return `<span class="sh"${sh[1] ? ` data-acc="${sh[1]}"` : ""}>${shapeSVG(sh[0])}</span>${numHTML(syl)}<span class="sy">${base}</span>${markHTML(syl)}`;
}
function applyShapes() {
  const mode = $("noteShapes").value;
  document.documentElement.dataset.shapes = mode;
  for (const id of ["shapeSylDrill", "shapeSylAlong"]) $(id).checked = mode === "both" || mode === "numsyl";
  for (const id of ["shapeSylDrillRow", "shapeSylAlongRow"]) $(id).hidden = mode === "off";
}

// ---------- Warm-up: find the note ----------
// Spelling a note by its place in the key, so fi in G is C♯ (not D♭) and ti
// in F♯ is E♯: the letter comes from the scale step, the sharp or flat from
// how far the pitch is from that letter.
const LETTERS = "CDEFGAB", LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
const STEP_OF = { do: 0, di: 0, ra: 1, re: 1, ri: 1, me: 2, mi: 2, fa: 3, fi: 3, se: 4, so: 4, si: 4, le: 5, la: 5, li: 5, te: 6, ti: 6 };
const ACC = { "-2": "𝄫", "-1": "♭", "0": "", "1": "♯", "2": "𝄪" };
function spellNote(base, midi, doMidi) {
  const keyLetter = LETTERS.indexOf(KEY_NAMES[((doMidi % 12) + 12) % 12][0]);
  const li = (keyLetter + STEP_OF[base]) % 7;
  const pc = ((midi % 12) + 12) % 12;
  const diff = ((pc - LETTER_PC[li]) + 18) % 12 - 6;
  const letter = LETTERS[li] + (ACC[diff] ?? "");
  return { letter, name: letter + (Math.floor((midi - diff) / 12) - 1) };
}
// The scale, do up to ti, half steps above do
const WARM_SCALE = [["do", 0], ["re", 2], ["mi", 4], ["fa", 5], ["so", 7], ["la", 9], ["ti", 11]];
// The quiz notes: { syl (as shown, with any octave mark), base, step (half steps from do) }
function warmNotes() {
  if ($("warmSet").value === "scale") return WARM_SCALE.map(([syl, step]) => ({ syl, base: syl, step }));
  const seen = new Map();
  for (const p of buildPool("mix")) for (const it of p.items) {
    if (it.bar || seen.has(it.syl)) continue;
    if (pitchOf(it.syl) === null) { reportError(T("err.noPitch", { syl: it.syl })); continue; }
    seen.set(it.syl, { syl: it.syl, base: sylBase(it.syl), step: pitchOf(it.syl) });
  }
  return [...seen.values()].sort((a, b) => a.step - b.step);
}
// One round: warmDeck[0] is the current note. "See it, play it": Check plays

// you tap syllables until you find it; a note you missed comes back later.
let warmDeck = [], warmTotal = 0, warmDone = 0, warmChecked = false;
let warmWrong = new Set(), warmSolved = false;
function warmStart() {
  warmDeck = shuffled(warmNotes()); warmTotal = warmDeck.length; warmDone = 0;
  warmNewNote();
  renderWarm();
}
function warmNewNote() { warmChecked = false; warmWrong = new Set(); warmSolved = false; }
const warmDoMidi = () => SONG_DO_MIDI + +$("transpose").value;
const keyOf = m => KEY_NAMES[((m % 12) + 12) % 12];
// The key's full name for a do: "G major", or for a minor song (mode:
// "minor", la-based on the key signature) its relative minor, "E minor".
// Solfège stays tied to the key signature (do = G), so E minor runs la to la.
const keyFull = m => SONG.mode === "minor"
  ? T("warm.keyMinor", { key: KEY_NAMES[(((m + 9) % 12) + 12) % 12] })
  : T("warm.keyMajor", { key: keyOf(m) });
const warmHearing = () => $("warmMode").value === "hear";
// A note's face: its shape, sharp or flat, syllable and octave mark (CSS shows what Show asks for)
function noteFace(n) {
  const sh = SHAPE_OF[n.base] || ["do", ""];

}
const showClass = () => ({ shape: " only-shape", syl: " only-syl", num: " only-num" })[$("warmShow").value] || "";
// How the answer names a note: the syllable with its mark, or in Number mode "♯4 (fi)"
const warmName = syl => $("warmShow").value === "num"
  ? `${numHTML(syl)} (${esc(sylBase(syl))}${markHTML(syl)})` : esc(sylBase(syl)) + markHTML(syl);
function warmAnswerHTML(key, cur, doM) {
  const sp = spellNote(cur.base, doM + cur.step, doM);

    + `<span class="wq-oct">${esc(T("warm.octave", { name: sp.name }))}</span>`;

  document.querySelectorAll(".wo[data-wset]").forEach(b => b.classList.toggle("on", b.dataset.wset === set));
  document.querySelectorAll(".wo[data-wmode]").forEach(b => b.classList.toggle("on", b.dataset.wmode === mode));

    + `<span>${esc(T("warm.keySong", { song: SONG.title, do: keyOf(doM) }))}</span>`
    + (t ? `<span>${esc(T("warm.keyTopFrom", { orig: keyFull(SONG_DO_MIDI) }))}</span>` : "");
